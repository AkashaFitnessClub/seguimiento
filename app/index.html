/* Crossfy exporta con un problema de doble codificación UTF-8 (p. ej. "GÃ©nero"
   en vez de "Género"). fixMojibake lo repara reinterpretando los caracteres
   como bytes y volviendo a decodificarlos como UTF-8. */
function fixMojibake(s){
  if(typeof s !== 'string' || !/[ÃÂ]/.test(s)) return s;
  try{
    const bytes = Uint8Array.from(Array.from(s).map(c => c.charCodeAt(0) & 0xFF));
    const fixed = new TextDecoder('utf-8', {fatal:true}).decode(bytes);
    return fixed;
  }catch(e){ return s; }
}
function normTxt(s){ return fixMojibake(String(s==null?'':s)).trim(); }
function normHeader(s){
  return normTxt(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
}

/* Fecha y hora del listado de turnos. Con cellDates llegan como fechas
   de verdad, pero un CSV o un export distinto puede traerlas como texto
   o como número de Excel, así que se contemplan los tres casos. */
function aFechaImport(v){
  if(v instanceof Date && !isNaN(v)) return v;
  if(typeof v === 'number') return new Date(Math.round((v - 25569) * 86400000));
  const s = normTxt(v);
  if(!s) return null;
  let m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
  if(m) return new Date(+m[3], +m[2]-1, +m[1]);
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return new Date(+m[1], +m[2]-1, +m[3]);
  const d = new Date(s);
  return isNaN(d) ? null : d;
}
function aHoraImport(v){
  if(v instanceof Date && !isNaN(v)) return dosDig(v.getHours()) + ':' + dosDig(v.getMinutes());
  if(typeof v === 'number'){
    const mins = Math.round((v % 1) * 1440);
    return dosDig(Math.floor(mins/60)) + ':' + dosDig(mins % 60);
  }
  const m = normTxt(v).match(/(\d{1,2}):(\d{2})/);
  return m ? dosDig(+m[1]) + ':' + m[2] : '';
}
/* Una rutina puede ser de varias clases puntuales: las horas van
   separadas por ";" como los ejercicios ("18:00; 19:00"). */
function horasImport(v){
  if(typeof v === 'string' && /[;\n]/.test(v))
    return v.split(/\s*[;\n]\s*/).map(aHoraImport).filter(Boolean).join('; ');
  return aHoraImport(v);
}
function horasDe(r){ return String((r && r.hora) || '').split(/\s*;\s*/).filter(Boolean); }
function fechaLegible(clave){
  const p = clave.split('-');
  return p[2] + '/' + p[1];
}

/* Cruce por nombre y apellido contra la base de alumnos. Sirve para que
   el listado de turnos se pueda importar solo, sin haber subido antes el
   listado de usuarios (que es lo que habilita el cruce por email). */
let indiceNombres = null;
/* Crossfy marca las clases de prueba con "(prueba)" junto al nombre de
   la reserva. Para cruzar con la base se saca: si la persona ya tiene
   usuario, la reserva tiene que ir a su ficha, no a una provisoria. */
function sinMarcaPrueba(t){ return String(t || '').replace(/\(\s*prueba\s*\)/ig, ' '); }
function tieneMarcaPrueba(t){ return /\(\s*prueba\s*\)/i.test(String(t || '')); }
function claveNombre(nombre, apellido){
  return normHeader(sinMarcaPrueba(nombre) + ' ' + sinMarcaPrueba(apellido)).replace(/\s+/g,' ').trim();
}
function buscarAlumnoPorNombre(nombre, apellido){
  if(!nombre && !apellido) return null;
  if(!indiceNombres){
    indiceNombres = {};
    ALUMNOS.forEach(a => {
      const k = claveNombre(a.nombre, a.apellido);
      /* Si hay una ficha de Prueba y un usuario real con el mismo nombre,
         gana el usuario real. */
      if(k && (indiceNombres[k] === undefined || (indiceNombres[k].id < 0 && a.id > 0))) indiceNombres[k] = a;
    });
  }
  return indiceNombres[claveNombre(nombre, apellido)] || null;
}

/* Alumno que reservó pero no tiene cuenta en Crossfy: ficha provisoria
   con id negativo y etiqueta de Prueba, que es justo lo que el profe
   necesita ver en la lista. Si vuelve a aparecer en otro import, se
   reusa la misma ficha en vez de duplicarla. */
function idProvisorio(nombre, apellido, extra){
  const k = claveNombre(nombre, apellido);
  extra = extra || {};
  const existente = alumnosProvisorios.find(p => p.clave === k || claveNombre(p.nombre, p.apellido) === k);
  if(existente){
    /* Si ahora se conocen sus datos de contacto, se completan. */
    if(extra.tel && !existente.tel) existente.tel = extra.tel;
    if(extra.email && !existente.email) existente.email = extra.email;
    return existente.id;
  }
  const id = -(alumnosProvisorios.length + 1);
  const prov = {id, clave:k, nombre:nombre || 'Sin nombre', apellido:apellido || ''};
  if(extra.tel) prov.tel = extra.tel;
  if(extra.email) prov.email = extra.email;
  if(extra.prueba === false) prov.prueba = false;
  alumnosProvisorios.push(prov);
  ALUMNOS.push({id, nombre:prov.nombre, apellido:prov.apellido, estado:'', paquete:'',
                objetivo:'', nivel:2, observacionIngreso:'', prueba: prov.prueba !== false,
                condiciones:[], adaptaciones:[]});
  indiceNombres = null; // la base cambió
  return id;
}

/* Cuando alguien que vino a una prueba sin usuario se registra en
   Crossfy, su ficha provisoria se une a la de su usuario: reservas,
   ajustes de clase, novedades, cargas, ficha, nivel y lo que Agu anotó
   en el registro pasan al Id Socio. Sin esto, la prueba quedaba en una
   ficha y la compra en otra, y el registro la daba por Perdida. Se cruza
   por nombre y apellido (sin la marca "(prueba)"), y sólo si hay un
   único usuario con ese nombre. */
function unirProvisorios(){
  if(!alumnosProvisorios.length) return 0;
  const reales = {};
  ALUMNOS.forEach(a => {
    if(!(a.id > 0)) return;
    const k = claveNombre(a.nombre, a.apellido);
    if(k) reales[k] = reales[k] === undefined ? a.id : null;   // null = nombre repetido
  });
  let unidos = 0;
  alumnosProvisorios.slice().forEach(p => {
    let real = reales[claveNombre(p.nombre, p.apellido)];
    /* Con el email que se cargó al crearlo, el cruce no depende de que
       el nombre esté escrito igual. */
    const em = String(p.email || '').trim().toLowerCase();
    if(em && importIndex.byEmail[em] !== undefined && getAlumno(Number(importIndex.byEmail[em]))) real = Number(importIndex.byEmail[em]);
    if(!real) return;
    pasarAlumno(p.id, real);
    alumnosProvisorios.splice(alumnosProvisorios.indexOf(p), 1);
    const i = ALUMNOS.findIndex(a => a.id === p.id);
    if(i !== -1) ALUMNOS.splice(i, 1);
    unidos++;
  });
  if(unidos){
    indiceNombres = null;
    persistReservas(); persistAjustes(); persistNovedades(); persistCargas();
    persistPendientes(); persistFichas(); persistNivel(); persistRegistroExtra();
    CLASES = construirClases();
  }
  return unidos;
}
function pasarAlumno(de, a){
  const cambiar = lista => (lista || []).map(x => x === de ? a : x).filter((x, i, arr) => arr.indexOf(x) === i);
  Object.keys(reservasImportadas).forEach(f => (reservasImportadas[f] || []).forEach(r => {
    /* Era una ficha de Prueba: esa reserva fue una clase de prueba. */
    if(r.alumnoId === de){ r.alumnoId = a; r.prueba = true; }
  }));
  Object.keys(ajustesClase).forEach(k => {
    const aj = ajustesClase[k];
    ['agregados', 'ausentes', 'quitados', 'presentes'].forEach(c => { if(aj[c]) aj[c] = cambiar(aj[c]); });
    if(aj.agregadosEn && aj.agregadosEn[de] !== undefined){
      if(aj.agregadosEn[a] === undefined) aj.agregadosEn[a] = aj.agregadosEn[de];
      delete aj.agregadosEn[de];
    }
  });
  novedades.forEach(n => { if(n.alumnoId === de) n.alumnoId = a; });
  cargas.forEach(k => { if(k.alumnoId === de) k.alumnoId = a; });
  pruebasReg.forEach(k => { if(k.alumnoId === de) k.alumnoId = a; });
  persistPruebasReg();
  devoluciones.forEach(k => { if(k.alumnoId === de) k.alumnoId = a; });
  persistDevoluciones();
  Object.keys(cargasPendientes).forEach(k => {
    const p = k.split('|');
    if(Number(p[1]) !== de) return;
    p[1] = String(a);
    const nk = p.join('|');
    if(cargasPendientes[nk] === undefined) cargasPendientes[nk] = cargasPendientes[k];
    delete cargasPendientes[k];
  });
  if(fichaOverrides[de]){
    const vieja = fichaOverrides[de], destino = getAlumno(a);
    if(destino){
      if(vieja.objetivo && !destino.objetivo) destino.objetivo = vieja.objetivo;
      if(vieja.observacionIngreso && !destino.observacionIngreso) destino.observacionIngreso = vieja.observacionIngreso;
      destino.condiciones = (destino.condiciones || []).concat((vieja.condiciones || []).filter(x =>
        !(destino.condiciones || []).some(y => String(y.texto || '').toLowerCase() === String(x.texto || '').toLowerCase())));
      destino.adaptaciones = (destino.adaptaciones || []).concat((vieja.adaptaciones || []).filter(x =>
        !(destino.adaptaciones || []).some(y => (x && x.id && y && y.id) ? x.id === y.id : JSON.stringify(y).toLowerCase() === JSON.stringify(x).toLowerCase())));
      fichaOverrides[a] = {objetivo:destino.objetivo, observacionIngreso:destino.observacionIngreso,
                           condiciones:destino.condiciones, adaptaciones:destino.adaptaciones};
    }
    delete fichaOverrides[de];
  }
  if(nivelOverrides[de] !== undefined){
    if(nivelOverrides[a] === undefined){
      nivelOverrides[a] = nivelOverrides[de];
      const destino = getAlumno(a); if(destino) destino.nivel = nivelOverrides[de];
    }
    delete nivelOverrides[de];
  }
  Object.keys(registroExtra).forEach(k => {
    const p = k.split('|');
    if(Number(p[0]) !== de) return;
    p[0] = String(a);
    const nk = p.join('|');
    if(registroExtra[nk] === undefined) registroExtra[nk] = registroExtra[k];
    delete registroExtra[k];
  });
}

/* El nombre de la pestaña, si es un día de la semana. La plantilla nueva
   tiene una pestaña por día y no trae columna "Día". */
function diaDeNombreHoja(nombre){
  const n = normHeader(nombre);
  const i = DIAS_SEMANA.map(normHeader).indexOf(n);
  return i === -1 ? '' : DIAS_SEMANA[i];
}
/* Busca "Semana del" en las primeras filas de una hoja y saca hasta dos
   fechas de esa misma fila. */
function buscarSemanaEn(rows){
  const out = {desde:null, hasta:null};
  (rows || []).slice(0, 12).forEach(fila => {
    if(out.desde) return;
    (fila || []).forEach((celda, i) => {
      if(out.desde) return;
      if(/semana\s+del/i.test(normTxt(celda))){
        for(let j = i + 1; j < fila.length; j++){
          const f = parseFechaCelda(fila[j]);
          if(!f) continue;
          if(!out.desde) out.desde = f;
          else { out.hasta = f; break; }
        }
      }
    });
  });
  return out;
}

function detectarTipoArchivo(headersNorm){
  const has = kw => headersNorm.some(x => x.includes(kw));
  if(has('submission id') && has('respondent id')) return 'formulario';
  if(has('turnos disponibles') || has('disciplinas')) return 'paquetes';
  if(has('fecha de clase') || has('hora de clase')) return 'turnos';
  /* La plantilla de Rutinas: una fila por bloque, con la clase a la que
     pertenece. Va antes que 'planificacion' porque comparte la columna
     "Nivel 1" con el planificador viejo. */
  /* Plantilla nueva: una fila por bloque/nivel, con los movimientos en su
     propia columna. Va antes que la vieja porque comparte "disciplina". */
  if(has('disciplina') && has('ejercicio')) return 'rutinas';
  if(has('bloque') && (has('para todos') || has('nivel 1')) && has('disciplina')) return 'rutinas';
  if(has('nivel 1') || (has('bloque') && has('duracion')) || (has('dia') && has('profe a cargo'))) return 'planificacion';
  if(has('id socio') && has('apellido')) return 'usuarios';
  return 'desconocido';
}

const importIndex = {byEmail:{}, byNombre:{}};

/* Respuestas del formulario ya leídas pero todavía sin cruzar, porque
   cuando se subió el archivo no estaba cargado el listado de usuarios de
   Crossfy (que es de donde sale el email → Id Socio). Se guardan acá
   sólo en memoria — no van a localStorage, así los emails no quedan
   almacenados — y se reintenta el cruce cada vez que termina de
   procesarse un archivo. Así no importa en qué orden se suban. */
let pendientesFormulario = [];

function aplicarPendientesFormulario(){
  if(!pendientesFormulario.length) return 0;
  const porPersona = {};
  pendientesFormulario.forEach(f => {
    const idSocio = importIndex.byEmail[f.email];
    if(idSocio === undefined) return;
    porPersona[idSocio] = {id: Number(idSocio), objetivo: f.objetivo, observacionIngreso: f.observacionIngreso};
  });
  return aplicarRespuestasFormulario(Object.values(porPersona), true);
}

/* Cuántas respuestas todavía no tienen usuario en Crossfy con el índice
   que haya cargado en este momento. */
function formularioSinCruzar(){
  return pendientesFormulario.filter(f => importIndex.byEmail[f.email] === undefined).length;
}

function textoResultadoFormulario(total){
  const sin = formularioSinCruzar();
  const aplicadas = total - sin;
  /* Si el listado de usuarios todavía no entró, las que no cruzaron
     probablemente sí tengan cuenta y falte con qué buscarlas. Si ya
     entró, es al revés: son personas que no están en Crossfy. Decir lo
     que no corresponde manda al profe a subir un archivo al pedo. */
  const hayIndice = Object.keys(importIndex.byEmail).length > 0;
  return total + ' respuestas · ' + aplicadas + ' ficha(s) actualizada(s) con objetivo y observación de ingreso'
    + (sin ? ' · ' + sin + (hayIndice
        ? ' sin usuario en Crossfy (todavía no tienen ficha)'
        : ' sin cruzar: subí el listado de alumnos y se aplican solas') : '');
}

/* Orden en que se aplican las planillas, sin importar en qué orden las
   haya elegido el profe. El listado de usuarios va primero porque es el
   que arma el índice email → Id Socio del que dependen los turnos (para
   reconocer quién reservó) y el formulario (para saber a qué ficha va
   cada respuesta). Antes había que acordarse de subirlo primero; ahora
   se puede soltar todo junto y la app se encarga. */
/* El banco y la semana se aplican ANTES que las rutinas: el banco para
   que los ejercicios ya se puedan cruzar al leerlas, y la semana porque
   es el rango de fechas con el que se van a guardar. */
const ORDEN_APLICACION = {ejercicios:0, semana:0, usuarios:1, paquetes:2, turnos:3, rutinas:4, planificacion:5, formulario:6, respaldo:7, desconocido:8};

/* Rutinas leídas en la importación que está corriendo, AGRUPADAS POR
   SEMANA: { '2026-10-05': [clases] }. Varias hojas (o varios archivos)
   de la misma semana se suman entre sí; dos semanas distintas en la
   misma importación no se mezclan, que es lo que pasaba cuando el lote
   era una sola lista. Se vacía al arrancar cada importación. */
let rutinasLote = {};
/* Rango de fechas leído de la hoja de resumen de esta importación. Se
   aplica a las hojas de rutinas del mismo archivo, que ya no lo traen
   encima de sus propias filas. */
let semanaLote = null;
/* Rango "Semana del" leído de la hoja de resumen, por archivo. */
let semanaPorArchivo = {};
/* Rutinas leídas en esta importación que todavía no se guardaron. */
let esperaRutinas = [];
let colaRutinas = [];

/* Guarda clases en una semana SUMÁNDOLAS a lo que ya había. Si llega
   una clase que ya estaba (mismo día, disciplina y hora) y cambió, la
   nueva es la que se muestra y la anterior queda como versión. Si llega
   idéntica, no se toca. Con soloContar=true no escribe nada: es lo que
   usa el aviso para decir qué va a pasar antes de confirmar. */
function guardarClasesEnSemana(clases, desde, hasta, sinFecha, soloContar){
  const claveSem = claveFecha(lunesDe(desde));
  const previa = planificaciones[claveSem];
  const base = previa ? previa.clases.slice() : [];
  const cuenta = {claveSem, sumadas:0, versionadas:0, iguales:0};
  const sello = new Date().toISOString();
  clases.forEach(nc => {
    const k = claveClase(nc);
    const i = base.findIndex(c => claveClase(c) === k);
    if(i === -1){ cuenta.sumadas++; if(!soloContar){ nc.importado = HOY_CLAVE; nc.importadoEn = sello; base.push(nc); } return; }
    const vieja = base[i];
    if(firmaClase(vieja) === firmaClase(nc)){ cuenta.iguales++; return; }
    cuenta.versionadas++;
    if(soloContar) return;
    nc.importado = HOY_CLAVE; nc.importadoEn = sello;
    nc.versiones = (vieja.versiones || []).concat([{
      importado: vieja.importado || (previa && previa.importado) || '',
      importadoEn: vieja.importadoEn || '', archivo: vieja.archivo || '', bloques: vieja.bloques,
    }]);
    base[i] = nc;
  });
  if(soloContar) return cuenta;
  let rDesde = claveFecha(desde), rHasta = claveFecha(hasta);
  if(previa){
    if(previa.desde < rDesde) rDesde = previa.desde;
    if(previa.hasta > rHasta) rHasta = previa.hasta;
  }
  planificaciones[claveSem] = {desde: rDesde, hasta: rHasta, importado: HOY_CLAVE, supuesta: false, clases: base};
  limpiarRutinasViejas();
  persistPlanificaciones();
  recalcularRutinasDelDia();
  recalcularRutinaHoy();
  ultimoImport.rutinas = HOY_CLAVE;
  try{ akStore.setItem(ULTIMO_IMPORT_KEY, JSON.stringify(ultimoImport)); }catch(e){}
  return cuenta;
}
function textoCuenta(c){
  return [
    c.sumadas ? c.sumadas + ' clase(s) nuevas' : '',
    c.versionadas ? c.versionadas + ' ya estaban y cambiaron (la anterior queda guardada como versión)' : '',
    c.iguales ? c.iguales + ' idénticas a las que ya estaban' : '',
  ].filter(Boolean).join(' · ');
}
/* Agrupa lo leído para preguntar UNA vez por semana y no una vez por
   pestaña: la plantilla nueva trae hasta siete hojas de la misma semana.
   Las hojas sin fecha se agrupan por archivo. */
function agruparEsperaRutinas(){
  const grupos = [];
  esperaRutinas.forEach(e => {
    const k = e.sinFecha ? 'sin|' + (e.hoja.archivo || '') : claveFecha(lunesDe(e.desde));
    let g = grupos.find(x => x.k === k);
    if(!g){ g = {k, sinFecha: e.sinFecha, desde: e.desde, hasta: e.hasta, items: []}; grupos.push(g); }
    g.items.push(e);
  });
  return grupos;
}
function clasesDeGrupo(g){ return g.items.reduce((a, e) => a.concat(e.clases), []); }
function semanaTieneRutinas(desde){
  const p = planificaciones[claveFecha(lunesDe(desde))];
  return !!(p && p.clases && p.clases.length);
}
function cerrarGrupo(g, texto){
  g.items.forEach(e => {
    if(!e.res) return;
    e.res.esperando = false;
    e.res.detalle = e.resumenParse + ' · ' + texto;
  });
  pintarResultadosImportacion();
}
function guardarGrupo(g, desde){
  const hasta = g.sinFecha ? sumarDias(lunesDe(desde), 6) : g.hasta;
  const d = g.sinFecha ? lunesDe(desde) : g.desde;
  const c = guardarClasesEnSemana(clasesDeGrupo(g), d, hasta, g.sinFecha, false);
  cerrarGrupo(g, 'Guardada en la semana del ' + etiquetaSemana(planificaciones[c.claveSem]) + ' · ' + textoCuenta(c));
}
/* Procesa la cola de a una semana. Si la semana está vacía y la planilla
   trae fecha, entra directo. Si no trae fecha, o si esa semana ya tiene
   rutinas, se abre el aviso y se espera la respuesta. */
let cancelóAlguna = false;
function procesarEsperaRutinas(){
  while(colaRutinas.length){
    const g = colaRutinas[0];
    if(!g.sinFecha && !semanaTieneRutinas(g.desde)){
      colaRutinas.shift();
      guardarGrupo(g, g.desde);
      continue;
    }
    state.semanaModal = {g, eleccion: g.sinFecha ? 'esta' : 'fija', otra: ''};
    pintarModalSemana();
    return;
  }
  state.semanaModal = null;
  pintarModalSemana();
  if(cancelóAlguna){ cancelóAlguna = false; recruzarTodo(); }
  pintarResultadosImportacion();
}
/* La semana elegida en el aviso. */
function desdeElegido(m){
  if(!m.g.sinFecha) return m.g.desde;
  const lun = lunesDe(new Date());
  if(m.eleccion === 'esta') return lun;
  if(m.eleccion === 'proxima') return sumarDias(lun, 7);
  if(m.eleccion === 'anterior') return sumarDias(lun, -7);
  if(m.eleccion === 'otra' && m.otra){ const f = fechaDesdeClave(m.otra); return f ? lunesDe(f) : null; }
  return null;
}
function elegirSemanaModal(v){ if(state.semanaModal){ state.semanaModal.eleccion = v; pintarModalSemana(); } }
function otraSemanaModal(input){
  if(!state.semanaModal) return;
  state.semanaModal.eleccion = 'otra';
  state.semanaModal.otra = input.value;
  pintarModalSemana();
}
function confirmarSemanaModal(){
  const m = state.semanaModal;
  if(!m) return;
  const d = desdeElegido(m);
  if(!d) return;
  colaRutinas.shift();
  guardarGrupo(m.g, d);
  procesarEsperaRutinas();
}
function cancelarSemanaModal(){
  const m = state.semanaModal;
  if(!m) return;
  colaRutinas.shift();
  cancelóAlguna = true;
  cerrarGrupo(m.g, 'NO se importó: cancelado');
  procesarEsperaRutinas();
}
function etiquetaRango(d){
  const h = sumarDias(d, 6);
  return dosDig(d.getDate()) + '/' + dosDig(d.getMonth()+1) + ' al ' + dosDig(h.getDate()) + '/' + dosDig(h.getMonth()+1);
}
function renderSemanaModal(m){
  const g = m.g;
  const d = desdeElegido(m);
  const archivos = [...new Set(g.items.map(e => e.hoja.archivo))].join(', ');
  const clases = clasesDeGrupo(g);
  const lun = lunesDe(new Date());
  const opcion = (v, txt) => `<button type="button" class="chip ${m.eleccion===v?'active':''}" onclick="elegirSemanaModal('${v}')">${txt}</button>`;
  let aviso = '';
  if(d && semanaTieneRutinas(d)){
    const c = guardarClasesEnSemana(clases, d, sumarDias(d, 6), g.sinFecha, true);
    const p = planificaciones[claveFecha(lunesDe(d))];
    aviso = `<div class="aviso-pasado" style="margin-top:14px;">
      <strong>La semana del ${esc(etiquetaRango(lunesDe(d)))} ya tiene rutinas cargadas</strong> (${p.clases.length} clase(s)).
      Si confirmás: ${esc(textoCuenta(c) || 'no cambia nada')}. No se borra nada de lo que ya estaba.
    </div>`;
  }
  return `
    <div class="modal-overlay">
      <div class="modal-sheet">
        <h2>${g.sinFecha ? '¿De qué semana es esta planilla?' : 'Esta semana ya tiene rutinas'}</h2>
        <div class="modal-sub">${esc(archivos)} · ${clases.length} clase(s)</div>
        ${g.sinFecha ? `
          <p style="margin:0 0 12px; font-size:15px;">La planilla no trae el rango de fechas en "Resumen semanal". Elegí a qué semana pertenece.</p>
          <div class="filter-row" style="flex-wrap:wrap;">
            ${opcion('anterior', 'Anterior · ' + etiquetaRango(sumarDias(lun,-7)))}
            ${opcion('esta', 'Esta · ' + etiquetaRango(lun))}
            ${opcion('proxima', 'Próxima · ' + etiquetaRango(sumarDias(lun,7)))}
          </div>
          <label style="font-size:14px; color:var(--text-soft);">Otra semana (cualquier día de esa semana):
            <input type="date" value="${esc(m.otra)}" onchange="otraSemanaModal(this)"
                   style="margin-left:6px; padding:7px 9px; border:1.5px solid var(--border); border-radius:var(--radius-sm); background:var(--bg); color:var(--text);">
          </label>
          ${m.eleccion === 'otra' && d ? `<div style="font-size:14px; margin-top:8px;">Semana del ${esc(etiquetaRango(d))}</div>` : ''}
        ` : `<p style="margin:0; font-size:15px;">La planilla es de la semana del ${esc(etiquetaRango(lunesDe(g.desde)))}.</p>`}
        ${aviso}
        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="cancelarSemanaModal()">No importar</button>
          <button class="btn btn-primary" ${d ? '' : 'disabled'} onclick="confirmarSemanaModal()">${aviso ? 'Confirmar y sumar' : 'Guardar en esa semana'}</button>
        </div>
      </div>
    </div>`;
}
function pintarModalSemana(){
  const root = ensureModalRoot();
  if(state.semanaModal) root.innerHTML = renderSemanaModal(state.semanaModal);
  else if(!state.novedadModal && !state.fichaModal && !state.finalizarModal && !state.cargaModal) root.innerHTML = '';
}
/* Cuántas clases sumó, versionó o encontró iguales la hoja que se está
   aplicando. Se informa en el detalle y se pone en cero. */
let cuentaImport = {sumadas:0, versionadas:0, iguales:0};
/* Lo que hace que dos versiones de una clase sean "la misma": el
   contenido de sus bloques, sin lo medido (que se marca en la app). */
function duracionDeFormatoTxt(f){ return normalizarFormato(f).dur; }
function firmaClase(c){
  const n = t => String(t == null ? '' : t).toLowerCase().replace(/\s+/g, ' ').trim();
  return n(JSON.stringify((c.bloques || []).map(b => [
    b.bloque || '', b.duracion || duracionDeFormatoTxt(b.formato) || null, b.todos || '', (b.niveles || []).join('¦'),
    b.notas || '', normalizarFormato(b.formato).texto, b.reps || '',
    (b.ejercicios || []).map(x => x.texto).join('¦'),
    Object.keys(b.filas || {}).map(k => ((b.filas[k] || {}).notasEj || []).join('¦')).join('|'),
  ])));
}

function procesarArchivos(ev){
  const files = Array.from(ev.target.files || []);
  /* Limpiar el input permite volver a elegir el mismo archivo dos veces
     seguidas (si no, el navegador no dispara el change la segunda vez). */
  ev.target.value = '';
  if(!files.length) return;
  importarArchivos(files);
}

function importarArchivos(files){
  const resultDiv = document.getElementById('import-result');
  if(resultDiv) resultDiv.innerHTML = `<div class="import-result"><div class="import-file-row"><span>Procesando…</span></div></div>`;

  rutinasLote = {};
  semanaLote = null;
  semanaPorArchivo = {};
  esperaRutinas = [];
  return Promise.all(files.map(leerLibro)).then(hojasPorArchivo => {
    const hojas = hojasPorArchivo.flat()
      .sort((a,b) => (ORDEN_APLICACION[a.tipo] ?? 9) - (ORDEN_APLICACION[b.tipo] ?? 9));
    const resultados = hojas.map(aplicarHoja);
    esperaRutinas.forEach(e => { e.res = resultados[hojas.indexOf(e.hoja)]; });
    /* Segunda pasada para las respuestas que quedaron sin cruzar porque
       el listado de usuarios se subió en OTRA importación, en otro
       momento. Dentro de un mismo lote ya no hace falta, pero no molesta. */
    const aplicadas = aplicarPendientesFormulario();
    if(aplicadas){
      resultados.forEach(r => {
        if(r.tipo === 'formulario') r.detalle = textoResultadoFormulario(pendientesFormulario.length);
      });
    }
    state.importResults = resultados;
    registrarUltimoImport(resultados);
    pintarResultadosImportacion();
    colaRutinas = agruparEsperaRutinas();
    procesarEsperaRutinas();
    return resultados;
  }).catch(() => {
    if(resultDiv) resultDiv.innerHTML = `<div class="import-result"><div class="import-file-row"><span class="fname">No se pudo leer el archivo.</span></div></div>`;
    return [];
  });
}

/* ---------- Cuándo se importó cada cosa por última vez ----------
   Sirve para dos avisos: el de la pantalla de inicio ("faltan las
   reservas de hoy") y el "última vez" de cada fuente en la pantalla de
   importación, para que no importen de más por las dudas. */
const ULTIMO_IMPORT_KEY = 'akasha-ultimo-import';
let ultimoImport = {};

function registrarUltimoImport(resultados){
  const hoy = claveFecha(new Date());
  /* Las rutinas que quedaron esperando confirmación todavía no
     entraron: se registran recién cuando se guardan. */
  resultados.forEach(r => { if(r.tipo && r.tipo !== 'desconocido' && !r.esperando) ultimoImport[r.tipo] = hoy; });
  try{ akStore.setItem(ULTIMO_IMPORT_KEY, JSON.stringify(ultimoImport)); }catch(e){}
}

function diasDesde(clave){
  if(!clave) return null;
  const partes = String(clave).split('-').map(Number);
  if(partes.length !== 3 || partes.some(isNaN)) return null;
  const then = new Date(partes[0], partes[1]-1, partes[2]);
  const hoy = new Date();
  const dif = Date.UTC(hoy.getFullYear(), hoy.getMonth(), hoy.getDate())
            - Date.UTC(then.getFullYear(), then.getMonth(), then.getDate());
  return Math.round(dif / 86400000);
}

function textoUltimoImport(tipo){
  const d = diasDesde(ultimoImport[tipo]);
  if(d === null) return 'nunca importado';
  if(d <= 0) return 'importado hoy';
  if(d === 1) return 'importado ayer';
  return 'importado hace ' + d + ' días';
}

/* ¿Están las reservas del día de hoy? Es lo único que hay que importar
   todos los días; el resto es semanal. */
function faltanReservasDeHoy(){ return !reservasImportadas[HOY_CLAVE]; }

/* Las cinco fuentes, con cada cuánto conviene traerlas. La idea es que
   el profe vea de un vistazo qué está al día y qué no, en vez de subir
   las cinco planillas todos los días por las dudas. */
const FUENTES_IMPORT = [
  {tipo:'turnos',        titulo:'Reservas de clases',    frecuencia:'todos los días', origen:'Crossfy'},
  {tipo:'usuarios',      titulo:'Listado de alumnos',    frecuencia:'una vez por semana', origen:'Crossfy'},
  {tipo:'paquetes',      titulo:'Paquetes',              frecuencia:'una vez por semana', origen:'Crossfy'},
  {tipo:'formulario',    titulo:'Formulario de ingreso', frecuencia:'cuando entra gente nueva', origen:'Tally / Drive'},
  {tipo:'rutinas',       titulo:'Rutinas de las clases', frecuencia:'una vez por semana', origen:'Plantilla de Rutinas'},
];

function estadoFuentesHtml(){
  return FUENTES_IMPORT.map(f => {
    const d = diasDesde(ultimoImport[f.tipo]);
    /* Rojo sólo para las reservas de hoy, que es lo único que rompe la
       clase si falta. El resto avisa en amarillo y sin dramatismo. */
    const alDia = f.tipo === 'turnos' ? !faltanReservasDeHoy() : (d !== null && d <= 7);
    return `
      <div class="fuente-row">
        <span class="fuente-punto ${alDia ? 'ok' : (f.tipo === 'turnos' ? 'falta' : 'viejo')}"></span>
        <span class="fuente-nombre">${esc(f.titulo)}<span class="fuente-origen">${esc(f.origen)} · ${esc(f.frecuencia)}</span></span>
        <span class="fuente-cuando">${esc(textoUltimoImport(f.tipo))}</span>
      </div>`;
  }).join('');
}

/* Leer y aplicar quedaron separados a propósito: leerLibro sólo abre el
   archivo y dice de qué es cada hoja, sin tocar ningún dato. Recién
   después, ya con todas las hojas a la vista, se aplican en el orden que
   corresponde (ver ORDEN_APLICACION). */
function leerLibro(file){
  const fallo = motivo => [{nombre:file.name, archivo:file.name, tipo:'desconocido', dataRows:[], headersNorm:[], error:motivo}];

  /* El resumen del día de otro aparato viene en .json, no en Excel: se lee
     como texto y entra por el mismo botón que las planillas. */
  if(/\.json$/i.test(file.name)){
    return new Promise((resolve) => {
      const lector = new FileReader();
      lector.onload = e => {
        try{
          const obj = JSON.parse(e.target.result);
          resolve([{nombre:file.name, archivo:file.name, tipo:'respaldo', dataRows:[], headersNorm:[], respaldo:obj}]);
        }catch(err){ resolve(fallo('el archivo está incompleto o no es un resumen de Akasha')); }
      };
      lector.onerror = () => resolve(fallo('no se pudo leer'));
      lector.readAsText(file);
    });
  }

  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = function(e){
      try{
        const data = new Uint8Array(e.target.result);
        /* cellDates: el listado de turnos trae fecha y hora como fechas
           de Excel; sin esto llegan como números y no hay forma de saber
           qué día es cada reserva. */
        const wb = XLSX.read(data, {type:'array', cellDates:true});
        const hojas = [];

        wb.SheetNames.forEach(sheetName => {
          /* Las hojas de ayuda y de ejemplo de la plantilla tienen la misma
             forma que la hoja real, así que si no se saltean el import las
             lee como si fueran rutinas y pisa las de verdad. */
          /* "Semana del" vive en la hoja de resumen, que no tiene filas
             de datos. Se la lee aparte para sacarle el rango de fechas:
             sin eso la app no sabe a qué semana pertenece lo que entra. */
          const rowsCrudas = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {header:1, defval:''});
          const fechasSem = buscarSemanaEn(rowsCrudas);
          if(fechasSem.desde){
            hojas.push({nombre: file.name + ' · ' + sheetName, archivo: file.name,
                        tipo: 'semana', hoja: sheetName, semana: fechasSem,
                        headersNorm: [], dataRows: [], previas: []});
          }
          /* La hoja de ayuda y la de ejemplo tienen la misma forma que una
             hoja real, así que si no se saltean se importan como rutinas.
             "Ejercicios" ya NO se saltea: es el banco. */
          if(/instruccion|ejemplo|c[oó]mo se completa|ayuda/i.test(sheetName)) return;
          if(/^ejercicios$/i.test(sheetName)){
            hojas.push({nombre: file.name + ' · ' + sheetName, archivo: file.name,
                        tipo: 'ejercicios', hoja: sheetName,
                        headersNorm: [], dataRows: rowsCrudas, previas: []});
            return;
          }
          if(/^resumen/i.test(sheetName)) return;
          /* La lista del desplegable de la plantilla: la app ya la tiene
             (sale de Crossfy), no hay nada que leer. */
          if(/^(disciplinas|listas)$/i.test(sheetName)) return;
          const sheet = wb.Sheets[sheetName];
          const rows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:''});
          if(!rows.length) return;

          /* Algunas hojas traen títulos arriba del encabezado real. Antes
             se tomaba la primera fila con 3 o más celdas llenas, y eso se
             rompe con la fila "Semana del: <desde> <hasta>", que también
             tiene tres. Ahora se busca la fila que MÁS se parece a un
             encabezado (cuántas de sus celdas son nombres de columna
             conocidos) y la regla de las 3 celdas queda sólo como
             respaldo para una planilla con nombres que no conocemos. */
          const PALABRAS_ENCABEZADO = ['dia','hora','disciplina','bloque','nivel','nivel 1','nivel 2','nivel 3',
            'para todos','min','minutos','duracion','ejercicio','ejercicios','notas','formato','reps','series',
            'reps/series','ejercicio a medir','id socio','apellido','nombre','email','fecha de clase','hora de clase',
            'estado','paquete','turnos disponibles','disciplinas','submission id','respondent id'];
          let headerRowIdx = 0, mejorPuntaje = 0;
          const limite = Math.min(rows.length, 8);
          for(let i=0; i<limite; i++){
            const celdas = (rows[i]||[]).map(normHeader).filter(Boolean);
            if(celdas.some(c => /semana\s+del/.test(c))) continue;
            const puntaje = celdas.filter(c => PALABRAS_ENCABEZADO.indexOf(c) !== -1).length;
            if(puntaje > mejorPuntaje){ mejorPuntaje = puntaje; headerRowIdx = i; }
          }
          if(mejorPuntaje < 2){
            headerRowIdx = 0;
            for(let i=0; i<limite; i++){
              const fila = rows[i] || [];
              if(fila.some(c => /semana\s+del/i.test(String(c)))) continue;
              const filled = fila.filter(c => String(c).trim() !== '').length;
              if(filled >= 3){ headerRowIdx = i; break; }
            }
          }
          const headersRaw = rows[headerRowIdx].map(normTxt);
          const headersNorm = headersRaw.map(normHeader);
          const dataRows = rows.slice(headerRowIdx+1).filter(r => r.some(c => String(c).trim() !== ''));
          /* Una exportación de paquetes vacía se reconoce igual, para poder
             decir por qué no sirvió (casi siempre: falta el rango de fechas). */
          if(!dataRows.length && detectarTipoArchivo(headersNorm) !== 'paquetes') return;

          hojas.push({
            nombre: file.name + (wb.SheetNames.length > 1 ? ' · ' + sheetName : ''),
            archivo: file.name,
            tipo: detectarTipoArchivo(headersNorm),
            hoja: sheetName,
            /* Si la pestaña se llama como un día, ese es el día de todas
               sus filas: la plantilla nueva no tiene columna "Día". */
            diaHoja: diaDeNombreHoja(sheetName),
            headersNorm, dataRows,
            /* Lo que está ARRIBA del encabezado — ahí va "Semana del". */
            previas: rows.slice(0, headerRowIdx),
          });
        });

        resolve(hojas.length ? hojas : fallo('no se reconocieron hojas con datos'));
      }catch(err){
        resolve(fallo('no se pudo procesar'));
      }
    };
    reader.onerror = () => resolve(fallo('no se pudo leer'));
    reader.readAsArrayBuffer(file);
  });
}

/* Aplica UNA hoja ya leída y devuelve la fila de resultado que se
   muestra en pantalla. Acá es donde los datos entran de verdad a la app. */
function aplicarHoja(hoja){
          const {tipo, headersNorm, dataRows} = hoja;
          if(hoja.error) return {nombre: hoja.nombre, tipo:'desconocido', filas:0, detalle: hoja.error};

          const idx = kw => headersNorm.findIndex(h => h === kw || h.includes(kw));
          let detalle = dataRows.length + ' filas';

          if(tipo === 'respaldo'){
            const r = aplicarRespaldo(hoja.respaldo);
            return {nombre: hoja.nombre, tipo, filas: 0,
                    detalle: r.error ? r.error : textoResultadoRespaldo(r)};
          }
          if(tipo === 'usuarios'){
            const idxEstado = idx('estado'), idxEmail = idx('email'), idxNombre = idx('nombre'), idxApellido = idx('apellido'), idxIdSocio = idx('id socio');
            let activos = dataRows.length;
            if(idxEstado >= 0){
              activos = dataRows.filter(r => normTxt(r[idxEstado]).toLowerCase().includes('activ')).length;
              detalle = activos + ' alumnos activos de ' + dataRows.length;
            }
            const idxPaq = idx('ultimo paquete');
            const idxReg = idx('fecha de registro'), idxNotas = idx('notas');
            const idxCant = idx('cantida'), idxVence = idx('vencimiento paquete');
            let nuevos = 0, actualizados = 0, unidosU = 0;
            if(idxIdSocio >= 0){
              dataRows.forEach(r => {
                const email = idxEmail>=0 ? normTxt(r[idxEmail]).toLowerCase() : '';
                const nombre = idxNombre>=0 ? normTxt(r[idxNombre]) : '';
                const apellido = idxApellido>=0 ? normTxt(r[idxApellido]) : '';
                const idSocio = r[idxIdSocio];
                if(email) importIndex.byEmail[email] = idSocio;
                if(nombre && apellido) importIndex.byNombre[(nombre+' '+apellido).toLowerCase()] = idSocio;

                /* El listado de Crossfy es la verdad sobre quién es socio:
                   el que no esté en la base se agrega, y al que ya está se
                   le actualizan estado y paquete. No se tocan objetivo,
                   alertas ni adaptaciones, que son de la app. */
                const idNum = Number(idSocio);
                if(!idNum || !nombre) return;
                /* Para el registro de pruebas: alta en Crossfy, nota de
                   prueba y último paquete. Nada de datos de contacto. */
                crossfyInfo[idNum] = {
                  reg: idxReg>=0 ? claveDeCelda(r[idxReg]) : '',
                  prueba: idxNotas>=0 ? /c(la|al)se de p/i.test(normTxt(r[idxNotas])) : false,
                  clases: idxCant>=0 ? numCelda(r[idxCant]) : null,
                  paq: idxPaq>=0 ? normTxt(r[idxPaq]).toUpperCase() : '',
                  vence: idxVence>=0 ? claveDeCelda(r[idxVence]) : '',
                };
                const estado = idxEstado>=0 ? normTxt(r[idxEstado]) : '';
                const paquete = idxPaq>=0 ? normTxt(r[idxPaq]).toUpperCase() : '';
                const ya = getAlumno(idNum);
                if(ya){
                  if(ya.faltante){
                    /* Estaba como "Socio #123456": ahora tiene nombre. */
                    ya.nombre = nombre; ya.apellido = apellido; delete ya.faltante;
                    const reg = alumnosImportados.find(x => x.id === idNum);
                    if(reg){ reg.nombre = nombre; reg.apellido = apellido; delete reg.faltante; }
                    nuevos++;
                  }
                  if(estado && ya.estado !== estado){ ya.estado = estado; actualizados++; }
                  if(paquete && ya.paquete !== paquete) ya.paquete = paquete;
                }else{
                  ALUMNOS.push({id:idNum, nombre, apellido, estado, paquete,
                                objetivo:'', nivel:2, observacionIngreso:'',
                                condiciones:[], adaptaciones:[]});
                  alumnosImportados.push({id:idNum, nombre, apellido, estado, paquete});
                  nuevos++;
                }
              });
              indiceNombres = null;   // la base cambió
              unidosU = unirProvisorios();
              persistReservas();      // guarda también los alumnos nuevos
              persistRegistroDatos();
            }
            detalle += (nuevos ? ' · ' + nuevos + ' alumno(s) nuevo(s) agregado(s)' : '')
                     + (unidosU ? ' · ' + unidosU + ' ficha(s) de Prueba unidas a su usuario' : '')
                     + (actualizados ? ' · ' + actualizados + ' con el estado actualizado' : '');
          } else if(tipo === 'turnos'){
            /* Acá se arman de verdad las clases: cada fila del listado
               de turnos es una reserva con fecha, hora, disciplina y
               persona. Se guardan por fecha, así un export que cubre
               toda la semana sirve todos los días sin volver a subirlo. */
            const idxEmail = idx('email'), idxNombre = idx('nombre'), idxApellido = idx('apellido');
            const idxFecha = idx('fecha de clase'), idxHora = idx('hora de clase');
            const idxDisc = idx('disciplina'), idxEstado = idx('estado');
            const idxReserva = idx('fecha de reserva');
            let porEmail=0, porNombre=0, provisorios=0, sinFecha=0, marcadasPrueba=0;
            const porFecha = {};
            const disciplinas = new Set();

            dataRows.forEach(r => {
              const fecha = idxFecha>=0 ? aFechaImport(r[idxFecha]) : null;
              const hora = idxHora>=0 ? aHoraImport(r[idxHora]) : '';
              if(!fecha || !hora){ sinFecha++; return; }
              const estado = idxEstado>=0 ? normTxt(r[idxEstado]).toUpperCase() : '';
              /* Una reserva cancelada no debería aparecer en la lista. */
              if(estado.indexOf('CANCEL') === 0) return;

              const email = idxEmail>=0 ? normTxt(r[idxEmail]).toLowerCase() : '';
              const nombre = idxNombre>=0 ? normTxt(r[idxNombre]) : '';
              const apellido = idxApellido>=0 ? normTxt(r[idxApellido]) : '';
              const disciplina = idxDisc>=0 ? (normTxt(r[idxDisc]) || DISCIPLINA) : DISCIPLINA;
              disciplinas.add(disciplina);

              let alumnoId = null;
              /* Por email sólo se puede si antes se subió el listado de
                 usuarios (de ahí sale el índice email → Id Socio). Si no,
                 se cruza por nombre y apellido contra la base cargada. */
              if(email && importIndex.byEmail[email] !== undefined){
                alumnoId = Number(importIndex.byEmail[email]); porEmail++;
              }else{
                const porNom = buscarAlumnoPorNombre(nombre, apellido);
                if(porNom){ alumnoId = porNom.id; porNombre++; }
              }
              if(alumnoId === null){
                alumnoId = idProvisorio(nombre, apellido);
                provisorios++;
              }
              const clave = claveFecha(fecha);
              const reg = {hora, disciplina, alumnoId, estado,
                reserva: idxReserva>=0 ? claveDeCelda(r[idxReserva]) : ''};
              if(tieneMarcaPrueba(nombre + ' ' + apellido)){ reg.prueba = true; marcadasPrueba++; }
              (porFecha[clave] = porFecha[clave] || []).push(reg);
            });

            Object.keys(porFecha).forEach(k => { reservasImportadas[k] = porFecha[k]; });
            const discNuevas = sumarDisciplinas([...disciplinas]);
            const unidosT = unirProvisorios();
            persistReservas();
            CLASES = construirClases();

            const fechas = Object.keys(porFecha).sort();
            const hoyCubierto = !!porFecha[HOY_CLAVE];
            const rangoTxt = fechas.length
              ? (fechas.length === 1 ? fechaLegible(fechas[0]) : fechaLegible(fechas[0]) + ' al ' + fechaLegible(fechas[fechas.length-1]))
              : 'sin fechas reconocidas';
            const totalReservas = Object.keys(porFecha).reduce((a,k)=>a+porFecha[k].length,0);
            detalle = totalReservas + ' reservas · ' + rangoTxt
              + ' · ' + [...disciplinas].join(', ')
              + ' · identificados: ' + porEmail + ' por email, ' + porNombre + ' por nombre'
              + (provisorios ? ', ' + provisorios + ' sin usuario en Crossfy (quedan como Prueba)' : '')
              + (marcadasPrueba ? ' · ' + marcadasPrueba + ' clase(s) de prueba' : '')
              + (unidosT ? ' · ' + unidosT + ' ficha(s) de Prueba unidas a su usuario de Crossfy' : '')
              + (discNuevas ? ' · ' + discNuevas + ' disciplina(s) nueva(s): copialas a la plantilla desde el banco' : '')
              + (sinFecha ? ' · ' + sinFecha + ' fila(s) sin fecha u hora legible' : '')
              + (hoyCubierto ? ' · HOY: ' + CLASES.length + ' clase(s) cargadas' : ' · el archivo no incluye el día de hoy');
          } else if(tipo === 'semana'){
            semanaPorArchivo[hoja.archivo] = hoja.semana;
            detalle = 'Semana del ' + dosDig(hoja.semana.desde.getDate()) + '/' + dosDig(hoja.semana.desde.getMonth()+1)
              + (hoja.semana.hasta ? ' al ' + dosDig(hoja.semana.hasta.getDate()) + '/' + dosDig(hoja.semana.hasta.getMonth()+1) : '')
              + ' — es la semana con la que se van a guardar estas rutinas';
          } else if(tipo === 'ejercicios'){
            /* Banco de ejercicios. Las filas de categoría (las que
               arrancan con una raya) son separadores para leer la hoja,
               no movimientos. */
            let nuevos = 0, actualizados = 0;
            /* Arriba de la tabla hay un título y un párrafo explicando
               cómo funciona el banco. Sin saltearlos, ese párrafo entraba
               como si fuera un ejercicio. Se busca la fila de encabezado
               ("Ejercicio (nombre oficial)") y se lee de ahí para abajo. */
            let desdeFila = 0;
            (hoja.dataRows || []).slice(0, 12).forEach((r, i) => {
              if(desdeFila) return;
              if(/^ejercicio/i.test(normTxt(r[0]))) desdeFila = i + 1;
            });
            (hoja.dataRows || []).slice(desdeFila).forEach(r => {
              const nombre = normTxt(r[0]);
              if(!nombre || /^[—–-]/.test(nombre)) return;
              if(/^ejercicio/i.test(nombre) || /^banco/i.test(nombre)) return;
              /* Un texto largo no es el nombre de un movimiento: es una
                 explicación que se coló. */
              if(nombre.length > 60) return;
              const alias = normTxt(r[1]).split(/\s*,\s*/).map(x => x.trim()).filter(Boolean);
              const notas = normTxt(r[2]);
              /* Manda la app: la hoja sólo SUMA. Lo que ya está en el
                 banco no se renombra ni se le cambian las notas, y lo que
                 se borró a mano en la app no vuelve. */
              if(bancoBorrados.indexOf(normEj(nombre)) !== -1) return;
              const yaId = buscarEnBanco(nombre);
              if(yaId){
                const e = ejercicioPorId(yaId);
                let cambio = false;
                alias.forEach(a => {
                  if(bancoBorrados.indexOf(normEj(a)) !== -1) return;
                  if(buscarEnBanco(a)) return;   // ya es de este o de otro: no se toca
                  e.alias.push(a); cambio = true;
                  construirIndiceBanco();
                });
                if(notas && !e.notas){ e.notas = notas; cambio = true; }
                if(cambio) actualizados++;
              }else{
                banco.push({id: idDesdeNombre(nombre), nombre: nombre, alias: alias, notas: notas});
                nuevos++;
              }
              construirIndiceBanco();
            });
            if(nuevos || actualizados) recruzarTodo();
            else persistBanco();
            detalle = banco.length + ' ejercicios en el banco · ' + nuevos + ' nuevos, '
              + actualizados + ' actualizados'
              + (ejPendientes.length ? ' · quedan ' + ejPendientes.length + ' sin reconocer' : '');
          } else if(tipo === 'rutinas'){
            /* Una fila por bloque. Día, Hora y Disciplina se completan
               sólo en la primera fila de cada clase, así que se arrastran
               hacia abajo hasta que aparezca una fila que los vuelva a
               declarar. Esa es la regla que hace que la planilla sea
               cómoda de llenar a mano. */
            const iDia = idx('dia'), iHora = idx('hora'), iDisc = idx('disciplina');
            const iBloque = idx('bloque'), iMin = idx('min');
            const iTodos = idx('para todos');
            const iN1 = idx('nivel 1'), iN2 = idx('nivel 2'), iN3 = idx('nivel 3');
            const iNotas = idx('notas');
            const iNotasEj = idx('notas ej.');
            const iMedir = idx('ejercicio a medir');
            /* Columnas de la plantilla nueva. Si está la de Ejercicios,
               la hoja viene en formato largo: una fila por nivel, con los
               movimientos sueltos en vez de un texto corrido. */
            const iEjs = idx('ejercicios') >= 0 ? idx('ejercicios') : idx('ejercicio');
            const iNivel = idx('nivel'), iFormato = idx('formato');
            const iTiempo = idx('tiempo'), iReps = idx('reps/series') >= 0 ? idx('reps/series') : idx('reps');
            const formatoNuevo = iEjs >= 0 && iTodos < 0 && iN1 < 0;
            const campo = (r, i) => i >= 0 ? normTxt(r[i]) : '';

            /* "Semana del" está arriba del encabezado. De esa fila se
               sacan hasta DOS fechas: desde y hasta. Ya no alcanza con
               mostrar un texto — el rango es lo que decide a qué semana
               pertenece esta planificación y, por lo tanto, qué día va a
               mostrarla y qué día va a decir que no hay rutina. */
            let semanaDesde = null, semanaHasta = null;
            (hoja.previas || []).forEach(fila => {
              (fila || []).forEach((celda, i) => {
                if(semanaDesde) return;
                if(/semana\s+del/i.test(normTxt(celda))){
                  for(let j = i + 1; j < fila.length; j++){
                    const f = parseFechaCelda(fila[j]);
                    if(!f) continue;
                    if(!semanaDesde) semanaDesde = f;
                    else { semanaHasta = f; break; }
                  }
                }
              });
            });

            const clases = [];
            let actual = null, dia = '', hora = '', disc = '', sinBloque = 0, repsDesparejas = 0;
            let formatosNormalizados = 0; const formatosSinLeer = [];
            /* El día puede venir de una columna (plantilla vieja) o del
               nombre de la pestaña (plantilla nueva, una por día). */
            const diaHoja = hoja.diaHoja || '';

            /* Arranca una clase nueva cuando día, hora o disciplina
               CAMBIAN — no con sólo estar escritos. Antes bastaba con que
               la celda tuviera algo, así que una planilla donde se repite
               la disciplina en cada fila (lo más natural de escribir en un
               Excel) partía la clase en una clase por bloque, en silencio.
               Ahora andan las dos formas: dejar vacío para seguir, o
               repetir los mismos valores. */
            function ubicar(r){
              const dDia = campo(r, iDia) || diaHoja;
              const dHora = horasImport(iHora >= 0 ? r[iHora] : '');
              const dDisc = campo(r, iDisc);
              /* La hora vacía sigue la de arriba sólo mientras sea la misma
                 clase. Si la fila arranca otra disciplina (u otro día) sin
                 hora, esa rutina vale para todo el día: antes se quedaba
                 con la hora de la clase anterior y no encontraba su clase. */
              const otraClase = (dDisc && dDisc !== disc) || (dDia && dDia !== dia);
              const nDia = dDia || dia, nHora = dHora || (otraClase ? '' : hora), nDisc = dDisc || disc;
              if(!actual || nDia !== dia || nHora !== hora || nDisc !== disc){
                dia = nDia; hora = nHora; disc = nDisc;
                actual = null;
              }
            }
            function abrirClase(){
              if(actual) return;
              actual = {dia, hora, disciplina: disc, bloques: []};
              clases.push(actual);
            }

            if(formatoNuevo){
              /* Formato largo: una fila por nivel. Un bloque junta las
                 filas consecutivas que comparten nombre; si no tiene
                 nombre, las que van completando niveles distintos. En
                 cuanto se repite un nivel ya cargado, empieza otro. */
              let bloqueActual = null, nombreBloque = '';
              dataRows.forEach(r => {
                const antes = actual;
                ubicar(r);
                if(actual !== antes || !actual){ bloqueActual = null; nombreBloque = ''; }

                const ejsTxt = partirEjercicios(campo(r, iEjs));
                /* El formato se lee y se deja en la forma de siempre
                   ("EMOM 12'", "4 vueltas · tope 12'"). Lo que no se
                   entiende queda como lo escribieron y se avisa. */
                const formatoOrig = campo(r, iFormato);
                const fmtN = normalizarFormato(formatoOrig);
                const formato = fmtN.texto;
                if(fmtN.reconocido){ if(formato !== formatoOrig) formatosNormalizados++; }
                else if(formatosSinLeer.indexOf(formatoOrig) === -1) formatosSinLeer.push(formatoOrig);
                const reps = campo(r, iReps);
                const notas = campo(r, iNotas);
                const nivTxt = campo(r, iNivel);
                const nivel = /[123]/.test(nivTxt) ? Number(nivTxt.match(/[123]/)[0]) : 0;
                if(!ejsTxt.length && !formato && !reps){ sinBloque++; return; }
                if(!dia || !disc){ sinBloque++; return; }
                abrirClase();

                const nom = campo(r, iBloque);
                const arranca = !bloqueActual
                  || (nom && nom !== nombreBloque)
                  || (!nom && !nivel)
                  || (!nom && nivel && bloqueActual.niveles[nivel-1]);
                if(arranca){
                  nombreBloque = nom || (nom === '' && bloqueActual && !nivel ? '' : nom);
                  let minutos = parseInt(campo(r, iTiempo), 10);
                  if(isNaN(minutos) && fmtN.dur) minutos = fmtN.dur;
                  bloqueActual = {
                    bloque: nom,
                    clave: nom || ('#' + (actual.bloques.length + 1)),
                    duracion: isNaN(minutos) ? null : minutos,
                    formato: formato, reps: reps,
                    todos: '', niveles: ['', '', ''],
                    ejercicios: [], notas: notas, medicion: [], medicionPlanilla: [],
                  };
                  actual.bloques.push(bloqueActual);
                }else if(notas && !bloqueActual.notas){ bloqueActual.notas = notas; }

                /* Se guarda la fila ESTRUCTURADA (formato, reps y
                   ejercicios por separado) y el texto de la pared se arma
                   de ahí (ver componerBloque). Así, si después se renombra
                   un ejercicio en el banco, la pared muestra el nombre
                   nuevo sin volver a importar. */
                bloqueActual.filas = bloqueActual.filas || {};
                const repsLista = partirEjercicios(reps);
                bloqueActual.filas[nivel || 0] = {formato: formato, reps: repsLista, ejs: ejsTxt};
                const notasEjLista = iNotasEj >= 0 ? partirNotasEj(r[iNotasEj]) : [];
                if(notasEjLista.some(Boolean)) bloqueActual.filas[nivel || 0].notasEj = notasEjLista;
                if(repsLista.length > 1 && repsLista.length !== ejsTxt.length){
                  bloqueActual.repsDesparejas = true;
                  repsDesparejas++;
                }
                componerBloque(bloqueActual);

                const cruzados = cruzarEjercicios(ejsTxt);
                cruzados.forEach(x => {
                  if(!bloqueActual.ejercicios.some(y => normEj(y.texto) === normEj(x.texto)))
                    bloqueActual.ejercicios.push(x);
                });
              });
            }else{
              dataRows.forEach(r => {
                ubicar(r);
                const bloque = campo(r, iBloque);
                const todos = campo(r, iTodos);
                const niveles = [campo(r, iN1), campo(r, iN2), campo(r, iN3)];
                /* El nombre del bloque es OPCIONAL: las rutinas de
                   Funcional, GAP y Athletic Cross no le ponen nombre, son
                   una secuencia identificada por su formato (TABATA, EMOM,
                   AMRAP, WOD). Alcanza con que la fila tenga contenido. */
                const hayContenido = !!(todos || niveles.some(n => n));
                if(!bloque && !hayContenido){ sinBloque++; return; }
                if(!dia || !disc){ sinBloque++; return; }
                abrirClase();
                const minutos = iMin >= 0 ? parseInt(campo(r, iMin), 10) : NaN;
                actual.bloques.push({
                  bloque,
                  /* Clave estable del bloque dentro de su clase: si no
                     tiene nombre se usa la posición, para que el ejercicio
                     medido quede bien atado igual. */
                  clave: bloque || ('#' + (actual.bloques.length + 1)),
                  duracion: isNaN(minutos) ? null : minutos,
                  todos,
                  niveles,
                  /* La plantilla vieja no trae los movimientos sueltos: el
                     bloque es un texto corrido. Por eso acá no hay lista
                     que cruzar contra el banco, y el ejercicio a medir se
                     elige del banco entero en vez de los del bloque. */
                  ejercicios: [],
                  notas: campo(r, iNotas),
                  /* El ejercicio a medir puede venir ya elegido de la
                     planilla. Lo que marque el profe a mano desde la app lo
                     pisa después (ver aplicarMedicionGuardada). */
                  medicion: campo(r, iMedir) ? [campo(r, iMedir)] : [],
                  medicionPlanilla: campo(r, iMedir) ? [campo(r, iMedir)] : [],
                });
              });
            }

            /* Se acumulan dentro de la misma importación en vez de pisarse:
               si las rutinas vinieran repartidas en varias hojas o en varios
               archivos, la última ya no borra a las anteriores. El lote se
               reinicia al empezar cada importación (ver importarArchivos). */
            /* A qué semana pertenece lo que se está importando. Primero
               las fechas de la celda "Semana del"; si no se pueden leer,
               la semana del día en que se importa — y eso queda anotado,
               porque es una suposición de la app y no un dato de la
               planilla. */
            /* A qué semana pertenece. Primero las fechas de la propia hoja;
               si no, las de la hoja "Resumen semanal" DEL MISMO ARCHIVO
               (antes se tomaban las de cualquier archivo de la tanda, y
               una planilla vieja sin fechas se llevaba las de la nueva). */
            const semArch = semanaPorArchivo[hoja.archivo] || null;
            let desde = semanaDesde || (semArch && semArch.desde) || null;
            let hasta = semanaHasta || (semArch && semArch.hasta) || null;
            const sinFecha = !desde;
            if(!desde) desde = lunesDe(new Date());
            if(!hasta || hasta < desde) hasta = sumarDias(desde, 6);

            const conNiv = clases.filter(claseConNiveles).length;
            const dias = [...new Set(clases.map(c => c.dia))];
            const discs = [...new Set(clases.map(c => c.disciplina))];
            const totalBloques = clases.reduce((a,c) => a + c.bloques.length, 0);
            if(!clases.length) return {nombre: hoja.nombre, tipo, filas: dataRows.length,
              detalle: 'ninguna clase reconocida — revisá que estén completos Día, Disciplina y Bloque'};
            clases.forEach(nc => { nc.archivo = hoja.archivo || ''; });

            /* No se guarda acá: se deja en espera. Cuando termina de leer
               todo el lote, la app decide por semana si entra directo, si
               hay que preguntar de qué semana es (planilla sin fecha) o si
               hay que avisar que esa semana ya tiene rutinas y pedir
               confirmación (ver procesarEsperaRutinas). */
            const resumenParse = clases.length + ' clase(s) · ' + totalBloques + ' bloques · '
              + dias.join(', ') + ' · ' + discs.join(', ')
              + ' · ' + conNiv + ' con niveles, ' + (clases.length - conNiv) + ' para todos'
              + (sinBloque ? ' · ' + sinBloque + ' fila(s) ignoradas por estar incompletas' : '')
              + (formatosNormalizados ? ' · ' + formatosNormalizados + ' formato(s) escritos distinto se unificaron' : '')
              + (formatosSinLeer.length ? ' · ⚠ formato sin reconocer (queda como está escrito): ' + formatosSinLeer.slice(0, 4).join(', ') + (formatosSinLeer.length > 4 ? '…' : '') : '')
              + (repsDesparejas ? ' · ⚠ ' + repsDesparejas + ' fila(s) con distinta cantidad de reps que de ejercicios: las reps se muestran juntas arriba, revisalas' : '')
              + (() => {
                  /* Se compara con el nombre exacto de Crossfy (sin
                     distinguir mayúsculas): una rutina con otro nombre no
                     aparece en ninguna clase. */
                  if(!disciplinasCrossfy.length) return '';
                  const conocidas = disciplinasCrossfy.map(normDisc);
                  const raras = [...new Set([].concat(...clases.map(c => disciplinasDe(c))))].filter(d => conocidas.indexOf(d) === -1);
                  if(!raras.length) return '';
                  const originales = raras.map(d => { const c = clases.find(x => disciplinasDe(x).indexOf(d) !== -1);
                    return (String(c.disciplina).split(/\s*[,/+]\s*/).find(t => normDisc(t) === d) || d); });
                  return ' · ⚠ Disciplina(s) que no figuran en Crossfy: ' + originales.join(', ')
                    + '. Esas rutinas no van a aparecer en ninguna clase: elegí el nombre del desplegable de la plantilla';
                })();
            esperaRutinas.push({hoja, clases, desde, hasta, sinFecha, resumenParse});
            return {nombre: hoja.nombre, tipo, filas: dataRows.length, esperando: true,
                    detalle: resumenParse + ' · esperando confirmación…'};
          } else if(tipo === 'planificacion'){
            detalle = dataRows.length + ' filas del planificador viejo — esta app lee la plantilla de Rutinas';
          } else if(tipo === 'paquetes'){
            /* Movimientos de paquetes: quién compró qué y cuándo. Es lo
               que da Fecha de inscripción, Plan y Ticket en el registro. Se
               suman a los ya guardados (sin duplicar por ID de paquete). */
            const iPid = idx('id'), iSoc = idx('id socio'), iCre = idx('creacion'), iDes = idx('fecha desde');
            const iVen = idx('vencimiento'), iTur = idx('turnos'), iImp = idx('importe'), iAbo = idx('abonado');
            const iPre = idx('precio'), iPlan = idx('plan'), iEst = idx('estado');
            let nuevas = 0, actualizadas = 0;
            dataRows.forEach(r => {
              const id = iSoc >= 0 ? Number(r[iSoc]) : 0;
              if(!id) return;
              const c = {
                pid: iPid >= 0 ? String(r[iPid]) : '',
                id,
                fecha: iCre >= 0 ? claveDeCelda(r[iCre]) : '',
                desde: iDes >= 0 ? claveDeCelda(r[iDes]) : '',
                vence: iVen >= 0 ? claveDeCelda(r[iVen]) : '',
                clases: iTur >= 0 ? numCelda(r[iTur]) : null,
                plan: iPlan >= 0 ? normTxt(r[iPlan]) : '',
                importe: [iAbo, iImp, iPre].map(i => i >= 0 ? numCelda(r[i]) : null).find(x => x) || null,
                estado: iEst >= 0 ? normTxt(r[iEst]) : '',
              };
              if(!c.fecha) c.fecha = c.desde;
              const i = compras.findIndex(x => (c.pid && x.pid === c.pid) || (!c.pid && x.id === c.id && x.fecha === c.fecha));
              if(i === -1){ compras.push(c); nuevas++; } else { compras[i] = c; actualizadas++; }
            });
            persistRegistroDatos();
            detalle = dataRows.length
              ? dataRows.length + ' paquetes · ' + nuevas + ' nuevos, ' + actualizadas + ' actualizados · sirven para el registro de pruebas (plan, ticket y fecha de inscripción)'
              : 'la exportación vino vacía: en Crossfy elegí un rango de fechas antes de exportar';
          } else if(tipo === 'formulario'){
            /* Además de contar, ahora se aplica: cada respuesta que
               matchea por email con un usuario de Crossfy completa el
               objetivo y la observación de ingreso de esa ficha. Por eso
               hay que subir primero el listado de usuarios de Crossfy
               (es lo que arma importIndex.byEmail); sin eso no hay con
               qué cruzar y no se aplica nada. */
            const idxEmail = idx('datos de contacto');
            const idxObs = idx('deberiamos saber');
            const idxExp = idx('ya entrenaste anteriormente');
            const idxCuesta = idx('te cuesta mas para empezar');
            const idxBusca = idx('mas importante a la hora de elegir');
            const idxAnteriores = idx('experiencias anteriores entrenando');
            /* "¿Qué te gustaría conseguir entrenando?" aparece dos veces
               en el formulario (quedó una versión vieja y una nueva): se
               juntan las dos y se sacan repetidos. */
            const idxsObjetivo = headersNorm.reduce((acc,h,i) => {
              if(h.includes('que te gustaria conseguir entrenando')) acc.push(i);
              return acc;
            }, []);
            /* Una persona puede haber respondido más de una vez: gana la
               fila más nueva, así que se recorre en orden y se sobreescribe. */
            const porEmail = {};
            let conObs = 0;
            dataRows.forEach(r => {
              const email = idxEmail>=0 ? normTxt(r[idxEmail]).toLowerCase() : '';
              if(!email) return;

              const partes = [];
              const agregar = (etiqueta, valor, entreComillas) => {
                const v = normTxt(valor);
                if(!v || v.toLowerCase() === 'no') return;
                partes.push(etiqueta + ': ' + (entreComillas ? '«' + v + '»' : v));
              };
              if(idxExp>=0) agregar('Experiencia previa', r[idxExp]);
              if(idxCuesta>=0) agregar('Le cuesta', r[idxCuesta]);
              if(idxAnteriores>=0) agregar('Experiencias anteriores', r[idxAnteriores], true);
              if(idxObs>=0){
                const obs = normTxt(r[idxObs]);
                if(obs && obs.toLowerCase() !== 'no'){ agregar('Dice', obs, true); conObs++; }
              }
              if(idxBusca>=0) agregar('Busca', r[idxBusca]);

              const objetivos = [];
              idxsObjetivo.forEach(i => {
                normTxt(r[i]).split(/\s*,\s*|\s*·\s*/).forEach(v => {
                  if(v && objetivos.indexOf(v) === -1) objetivos.push(v);
                });
              });

              porEmail[email] = {
                email,
                objetivo: objetivos.join(' · '),
                observacionIngreso: partes.join('\n'),
              };
            });

            pendientesFormulario = Object.values(porEmail);
            aplicarPendientesFormulario();
            detalle = textoResultadoFormulario(pendientesFormulario.length)
              + (idxsObjetivo.length ? '' : ' · no se encontró la columna de objetivo')
              + (conObs ? ' · ' + conObs + ' con algo para tener en cuenta' : '');
          }

  return {nombre: hoja.nombre, tipo, filas: dataRows.length, detalle};
}

function pintarResultadosImportacion(){
  const div = document.getElementById('import-result');
  if(div){
    const rs = state.importResults;
    div.innerHTML = !rs.length ? '' : `<div class="import-result">${rs.map(r => `
      <div class="import-file-row">
        <span class="fhead">
          <span class="ftype ${r.tipo}">${esc(etiquetaTipo(r.tipo))}</span>
          <span class="fname">${esc(r.nombre)}</span>
        </span>
        <span class="fdet">${esc(r.detalle)}</span>
      </div>`).join('')}</div>`;
  }
  const estado = document.getElementById('import-estado');
  if(estado) estado.innerHTML = estadoFuentesHtml();

  const usuarios = state.importResults.find(r => r.tipo === 'usuarios');
  const turnos = state.importResults.filter(r => r.tipo === 'turnos');
  const plan = state.importResults.filter(r => r.tipo === 'planificacion');
  const formulario = state.importResults.filter(r => r.tipo === 'formulario');
  const lineas = [];
  if(usuarios) lineas.push((usuarios.detalle.includes('activos') ? usuarios.detalle : usuarios.filas + ' alumnos') + ' detectados.');
  if(turnos.length) lineas.push(turnos.reduce((a,r)=>a+r.filas,0) + ' turnos detectados.');
  if(plan.length) lineas.push('Planificación semanal reconocida (' + plan.length + ' hoja(s), niveles 1–3 por bloque).');
  if(formulario.length) lineas.push(formulario.reduce((a,r)=>a+r.filas,0) + ' respuestas del formulario de ingreso detectadas.');

  const wrap = document.getElementById('import-summary-wrap');
  wrap.innerHTML = lineas.length ? `<div class="import-summary"><strong>Importación completada</strong><br>${lineas.map(esc).join('<br>')}</div>` : '';
}

/* ---------- Carpeta automática: NO SE PUEDE ACÁ ----------
   Estuvo implementada con la File System Access API y se sacó porque no
   funciona en la app publicada. La página corre dentro de un iframe con
   sandbox y ahí el navegador rechaza el selector de carpetas:

     SecurityError: Failed to execute 'showDirectoryPicker' on 'Window':
     Sandboxed documents aren't allowed to show a file picker.

   La trampa es que `'showDirectoryPicker' in window` da true igual, así
   que detectar la función NO alcanza para saber si se puede usar: hay
   que llamarla y ver si explota. El botón quedaba visible y no hacía
   nada.

   El <input type="file"> de arriba sí anda dentro del sandbox, así que
   la importación a mano no se toca. La carpeta automática vuelve a ser
   posible cuando la app corra desde un servidor local y no adentro de un
   artifact. */
function carpetaCardHtml(){

    </div>`;
}

}

let toastTimer = null;
function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}
