/* ---------- Banco de ejercicios ----------
   El problema que resuelve: el ejercicio medido se escribía a mano, y
   "Front Squat", "front squat" y "sentadilla frontal" quedaban como tres
   ejercicios distintos, así que el gráfico de ese movimiento se partía en
   tres. El banco es la lista de nombres oficiales con sus alias; cada
   ejercicio que entra por una rutina se cruza contra ella y se guarda
   bajo el nombre oficial, conservando siempre el texto como fue escrito.
   Sale de la hoja "Ejercicios" de la plantilla y lo corrigen los profes:
   la lista que viene es una propuesta, no una lista cerrada. */
let banco = [];                 // [{id, nombre, alias:[], notas, nuevo}]
let bancoIndice = null;         // {nombreNormalizado: id}
/* Ejercicios que aparecieron en una rutina y no matchearon con nada.
   NO traban la importación: quedan acá con un contador para resolverlos
   después — o son un movimiento nuevo, o son otro nombre de uno que ya
   está. Trabar un import a las siete de la mañana antes de una clase
   sería el peor momento posible para pedir decisiones. */
let ejPendientes = [];          // [{texto, veces}]

/* Normalización para comparar: minúsculas, sin acentos, sin plurales
   obvios y sin la cantidad que a veces viene pegada al nombre
   ("12 burpees", "3x10 sentadilla"). Lo que se compara es el movimiento;
   las repeticiones tienen su propia columna. */
function normEj(s){
  let t = String(s == null ? '' : s).toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9/\s-]/g, ' ')
    .replace(/\s+/g, ' ').trim();
  t = t.replace(/^\d+\s*[x×]\s*\d*\s*/, '').replace(/^\d+\s*[''"]?\s*/, '');
  t = t.replace(/\s+/g, ' ').trim();
  return t;
}
/* Para sugerir alias: además de normalizar, saca plurales simples, para
   que "burpees" se parezca a "burpee" sin que eso sea un match
   automático — la decisión la toma el profe. */
function raizEj(s){
  return normEj(s).split(' ').map(p => p.replace(/(es|s)$/, '')).join(' ');
}
function construirIndiceBanco(){
  bancoIndice = {};
  banco.forEach(e => {
    bancoIndice[normEj(e.nombre)] = e.id;
    (e.alias || []).forEach(a => { const k = normEj(a); if(k) bancoIndice[k] = e.id; });
  });
}
function ejercicioPorId(id){ return banco.find(e => e.id === id) || null; }
function idDesdeNombre(nombre){
  let base = normEj(nombre).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'ej';
  let id = base, n = 2;
  while(banco.some(e => e.id === id)){ id = base + '-' + (n++); }
  return id;
}
/* Busca un texto en el banco. Devuelve el id si matchea por nombre o por
   alias; null si no. Nunca inventa un match por parecido: el parecido
   sólo se usa para SUGERIR. */
function buscarEnBanco(texto){
  if(!bancoIndice) construirIndiceBanco();
  const k = normEj(texto);
  if(!k) return null;
  return bancoIndice[k] !== undefined ? bancoIndice[k] : null;
}
/* Candidatos a los que un texto desconocido podría pertenecer, ordenados
   de más a menos parecido. Es lo que convierte "resolver pendientes" en
   confirmar en vez de escribir. */
const VACIAS = ['con','sin','de','del','la','el','los','las','en','y','a','por','para','al','un','una','up','x'];
function sugerenciasBanco(texto, max){
  const r = raizEj(texto);
  if(!r) return [];
  const toks = r.split(' ').filter(Boolean);
  const puntuar = e => {
    const cands = [e.nombre].concat(e.alias || []);
    let mejor = 0;
    cands.forEach(c => {
      const rc = raizEj(c);
      if(!rc) return;
      let p = 0;
      if(rc === r) p = 100;
      else if(rc.indexOf(r) !== -1 || r.indexOf(rc) !== -1) p = 70;
      else {
        /* Palabras comunes a muchos nombres: si no se descartan, "muscle
           up" sugiere "sit up" y "sentadilla con salto" sugiere
           "spiderman con rotación", y una sugerencia mala es peor que
           ninguna — invita a confirmar algo equivocado de un toque. */
        const tc = rc.split(' ').filter(x => x && VACIAS.indexOf(x) === -1);
        const mios = toks.filter(x => VACIAS.indexOf(x) === -1);
        const comunes = mios.filter(t => tc.indexOf(t) !== -1);
        const vale = comunes.length >= 2 || comunes.some(t => t.length >= 5);
        if(vale) p = 30 + 30 * comunes.length / Math.max(mios.length, tc.length, 1);
      }
      if(p > mejor) mejor = p;
    });
    return mejor;
  };
  return banco.map(e => ({e, p: puntuar(e)})).filter(x => x.p >= 30)
    .sort((a,b) => b.p - a.p).slice(0, max || 4).map(x => x.e);
}

/* Arma el texto que se ve de una fila de la plantilla nueva. Las reps
   van con su ejercicio por POSICIÓN: la primera con el primero, la
   segunda con el segundo. Un solo valor de reps vale para todos (va
   arriba, junto al formato). Si las cantidades no coinciden, no se
   adivina: las reps se muestran juntas arriba y los ejercicios solos. */
/* Un guion en el lugar de una rep quiere decir "este ejercicio no lleva
   reps": guarda el lugar para que las demás sigan emparejadas con su
   ejercicio, y en la pared no muestra nada. */
function esSinRep(r){ return /^[-–—]+$/.test(String(r || '').trim()); }
function textoFila(f){
  let reps = f.reps || [];
  const ejs = f.ejs || [];
  if(reps.length && reps.every(esSinRep)) reps = [];
  const parejas = reps.length > 0 && reps.length === ejs.length && !(reps.length === 1 && ejs.length !== 1);
  let cab = f.formato || '';
  if(!parejas && reps.length) cab = [cab, reps.filter(r => !esSinRep(r)).join(' / ')].filter(Boolean).join(' · ');
  const lineas = ejs.map((e, i) => (parejas && !esSinRep(reps[i]) ? reps[i] + ' ' : '') + nombreEj(e));
  return [cab, lineas.join('\n')].filter(Boolean).join('\n');
}
function componerBloque(b){
  if(!b || !b.filas) return;
  Object.keys(b.filas).forEach(k => {
    const n = Number(k);
    const t = textoFila(b.filas[k]);
    if(n) b.niveles[n-1] = t; else b.todos = t;
  });
}


/* ---------- Selector predictivo sobre el banco ----------
   Uno solo para todo: resolver un ejercicio sin reconocer en el import,
   elegir el ejercicio a medir en una clase y unir dos ejercicios en el
   editor del banco. Mientras se escribe busca en nombres y alias: por
   el principio, por cualquier palabra, en cualquier orden ("row trx"
   encuentra "Remo TRX" por su alias "trx row") y, si no hay nada, por
   parecido. */
function buscarSugerencias(q, max){
  max = max || 6;
  const k = normEj(q);
  if(!k) return [];
  const palabras = raizEj(q).split(' ').filter(w => w && VACIAS.indexOf(w) === -1);
  const res = [];
  banco.forEach((e, i) => {
    let mejor = 0, via = '';
    [e.nombre].concat(e.alias || []).forEach((n, j) => {
      const nn = normEj(n), rn = raizEj(n);
      let v = 0;
      if(nn === k) v = 100;
      else if(nn.indexOf(k) === 0) v = 90;
      else if(nn.split(' ').some(w => w.indexOf(k) === 0)) v = 80;
      else if(palabras.length && palabras.every(w => rn.split(' ').some(x => x.indexOf(w) === 0))) v = 75;
      else if(nn.indexOf(k) !== -1) v = 70;
      if(v > mejor){ mejor = v; via = j ? n : ''; }
    });
    if(mejor) res.push({i, e, p: mejor, via});
  });
  if(res.length < max){
    sugerenciasBanco(q, max).forEach(e => {
      if(!res.some(x => x.e === e)) res.push({i: banco.indexOf(e), e, p: 40, via: ''});
    });
  }
  return res.sort((a, b) => b.p - a.p || a.e.nombre.localeCompare(b.e.nombre)).slice(0, max);
}
/* Lo que cada selector tiene que hacer al elegir: se guarda acá, por
   id, en vez de meter textos dentro del onclick, para que un nombre con
   comillas o acentos no pueda romper el HTML. */
const selCtx = {};
function selectorEj(id, modo, data, placeholder, inicial){
  selCtx[id] = {modo, data};
  return `<div class="sel-ej">
    <input type="text" class="medicion-input" id="${id}" autocomplete="off" placeholder="${esc(placeholder)}"
           value="${esc(inicial || '')}" oninput="selEjFiltrar('${id}')">
    <div class="sel-ej-lista" id="${id}-lista">${selEjListaHtml(id, inicial || '')}</div>
  </div>`;
}
function selEjListaHtml(id, q){
  const c = selCtx[id];
  if(!c) return '';
  let res = buscarSugerencias(q, 6);
  if(c.modo === 'unir') res = res.filter(x => x.e.id !== c.data.id);
  const exacto = res.some(x => x.p === 100);
  const nuevo = (c.modo !== 'unir' && String(q).trim() && !exacto)
    ? `<button type="button" class="pend-nuevo" onclick="selEjNuevo('${id}')">+ «${esc(String(q).trim())}» es un ejercicio nuevo</button>` : '';
  if(!res.length && !nuevo) return String(q).trim() ? '<div class="medicion-nada">Nada parecido en el banco.</div>' : '';
  return res.map(x => `<button type="button" class="pend-sug" onclick="selEjElegir('${id}', ${x.i})">${esc(x.e.nombre)}${x.via ? ` <span class="sel-via">(${esc(x.via)})</span>` : ''}</button>`).join('') + nuevo;
}
function selEjFiltrar(id){
  const el = document.getElementById(id), lista = document.getElementById(id + '-lista');
  if(el && lista) lista.innerHTML = selEjListaHtml(id, el.value);
}
function selEjElegir(id, i){
  const c = selCtx[id], e = banco[i];
  if(!c || !e) return;
  if(c.modo === 'pend') pendienteComoAlias(c.data.texto, e.id);
  else if(c.modo === 'medir') ponerMedicion(c.data.claveCl, c.data.bKey, e.nombre);
  else if(c.modo === 'unir'){ state.bancoUnir = {origen: c.data.id, destino: e.id}; render(); }
  else if(c.modo === 'cr') crAgregarEj(c.data.i, e.nombre);
  else if(c.modo === 'adaptOrig'){ state.adaptForm.orig = e.nombre; render(); }
  else if(c.modo === 'adaptNuevo'){ state.adaptForm.nuevo = e.nombre; render(); }
  else if(c.modo === 'novEj'){ state.novedadModal.ej = e.nombre; state.novedadModal.otroEj = false; novRender(); }
  else if(c.modo === 'novNuevo'){ state.novedadModal.nuevo = e.nombre; novRender(); }
}
function selEjNuevo(id){
  const c = selCtx[id], el = document.getElementById(id);
  const v = el ? el.value.trim() : '';
  if(!c || !v) return;
  if(c.modo === 'pend'){
    if(normEj(v) === normEj(c.data.texto)) pendienteComoNuevo(c.data.texto);
    else {
      banco.push({id: idDesdeNombre(v), nombre: v, alias: [String(c.data.texto).trim()], notas: '', nuevo: true});
      recruzarTodo(); render();
    }
  }else if(c.modo === 'medir'){
    banco.push({id: idDesdeNombre(v), nombre: v, alias: [], notas: '', nuevo: true});
    construirIndiceBanco(); persistBanco();
    ponerMedicion(c.data.claveCl, c.data.bKey, v);
  }else if(c.modo === 'cr'){
    crAgregarEj(c.data.i, v);
  }else if(c.modo === 'adaptOrig' || c.modo === 'adaptNuevo'){
    if(!buscarEnBanco(v)){ banco.push({id: idDesdeNombre(v), nombre: v, alias: [], notas: '', nuevo: true}); construirIndiceBanco(); persistBanco(); }
    if(c.modo === 'adaptOrig') state.adaptForm.orig = v; else state.adaptForm.nuevo = v;
    render();
  }else if(c.modo === 'novEj' || c.modo === 'novNuevo'){
    if(!buscarEnBanco(v)){ banco.push({id: idDesdeNombre(v), nombre: v, alias: [], notas: '', nuevo: true}); construirIndiceBanco(); persistBanco(); }
    if(c.modo === 'novEj'){ state.novedadModal.ej = v; state.novedadModal.otroEj = false; } else state.novedadModal.nuevo = v;
    novRender();
  }
}

/* Separa la celda "Ejercicios" en movimientos: un salto de línea o un
   punto y coma. La coma NO separa a propósito — aparece dentro de los
   nombres ("Press, inclinado") y partiría mal. */
function partirEjercicios(txt){
  return String(txt == null ? '' : txt).split(/[\n;]+/)
    .map(x => x.trim()).filter(Boolean);
}
/* Cruza una lista de textos contra el banco. Devuelve
   [{texto, ejId}] — SIEMPRE con el texto como lo escribió el profe, para
   que una decisión equivocada de alias se pueda recorregir después. Lo
   que no matchea se suma a pendientes. */
function cruzarEjercicios(textos){
  return textos.map(t => {
    const id = buscarEnBanco(t);
    if(!id) sumarPendiente(t);
    return {texto: t, ejId: id};
  });
}
function sumarPendiente(texto){
  const k = normEj(texto);
  if(!k) return;
  const ya = ejPendientes.find(p => normEj(p.texto) === k);
  if(ya){ ya.veces = (ya.veces || 1) + 1; return; }
  ejPendientes.push({texto: texto, veces: 1});
}
/* Vuelve a cruzar todo lo que hay guardado. Hay que llamarlo cada vez
   que el banco cambia: resolver un pendiente tiene que arreglar también
   las rutinas que ya estaban importadas, no sólo las próximas. */
function recruzarTodo(){
  construirIndiceBanco();
  ejPendientes = [];
  Object.keys(planificaciones).forEach(k => {
    (planificaciones[k].clases || []).forEach(c => {
      (c.bloques || []).forEach(b => {
        componerBloque(b);
        if(!b.ejercicios) return;
        b.ejercicios = b.ejercicios.map(x => {
          const id = buscarEnBanco(x.texto);
          if(!id) sumarPendiente(x.texto);
          return {texto: x.texto, ejId: id};
        });
      });
    });
  });
  persistBanco();
  persistPlanificaciones();
  recalcularRutinasDelDia();
}
function persistBanco(){
  try{
    akStore.setItem('akasha-banco', JSON.stringify(banco));
    akStore.setItem('akasha-ej-pendientes', JSON.stringify(ejPendientes));
  }catch(e){}
}
/* Resolver un pendiente: o entra al banco como movimiento nuevo, o se
   suma como alias de uno que ya está. */
function pendienteComoNuevo(texto){
  const nombre = String(texto).trim();
  if(!nombre) return;
  if(!buscarEnBanco(nombre)){
    banco.push({id: idDesdeNombre(nombre), nombre: nombre, alias: [], notas: '', nuevo: true});
  }
  recruzarTodo();
  render();
}
function pendienteComoAlias(texto, id){
  const e = ejercicioPorId(id);
  if(!e) return;
  e.alias = e.alias || [];
  if(!e.alias.some(a => normEj(a) === normEj(texto))) e.alias.push(String(texto).trim());
  recruzarTodo();
  render();
}
function resolverPendienteManual(texto, inputId){
  const el = document.getElementById(inputId);
  const v = el ? el.value.trim() : '';
  if(!v) return;
  const id = buscarEnBanco(v);
  if(id) pendienteComoAlias(texto, id);
  else {
    banco.push({id: idDesdeNombre(v), nombre: v, alias: [String(texto).trim()], notas: '', nuevo: true});
    recruzarTodo();
    render();
  }
}
/* Todos los ejercicios que ofrece una clase para medir: los de sus
   propios bloques primero (plantilla nueva) y después el banco entero,
   que es lo que hace que esto funcione también con la plantilla vieja,
   donde el bloque es un texto libre sin lista de movimientos. */
function ejerciciosDelBloque(b){
  const vistos = {};
  const out = [];
  (b && b.ejercicios || []).forEach(x => {
    const e = x.ejId ? ejercicioPorId(x.ejId) : null;
    const nombre = e ? e.nombre : x.texto;
    const k = normEj(nombre);
    if(k && !vistos[k]){ vistos[k] = 1; out.push(nombre); }
  });
  return out;
}

/* ---------- Planificaciones por semana ---------- */

/* Lunes de la semana que contiene esa fecha. Es la clave con la que se
   guarda cada planificación. */
function lunesDe(d){
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const dow = x.getDay();              // 0 = domingo
  x.setDate(x.getDate() - ((dow + 6) % 7));
  return x;
}
function sumarDias(d, n){
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() + n);
  return x;
}
/* Una celda de "Semana del" puede venir como fecha de Excel (con
   cellDates llega como Date) o escrita a mano. Si viene el año, se
   respeta; si no, se asume el año en curso. */
function parseFechaCelda(v){
  /* No se usa `instanceof Date`: la fecha puede venir de otro realm o de
     otra copia del constructor y entonces el instanceof da false aunque
     sea una fecha perfectamente válida. Se la reconoce por lo que sabe
     hacer, no por de dónde viene. */
  if(v && typeof v.getFullYear === 'function' && typeof v.getTime === 'function' && !isNaN(v.getTime()))
    return new Date(v.getFullYear(), v.getMonth(), v.getDate());
  const t = String(v == null ? '' : v).trim();
  const m = /^(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2,4}))?$/.exec(t);
  if(!m) return null;
  let anio = m[3] ? Number(m[3]) : new Date().getFullYear();
  if(anio < 100) anio += 2000;
  const d = new Date(anio, Number(m[2]) - 1, Number(m[1]));
  return isNaN(d.getTime()) ? null : d;
}
function etiquetaSemana(p){
  if(!p) return '';
  const f = k => { const x = fechaDesdeClave(k); return x ? dosDig(x.getDate()) + '/' + dosDig(x.getMonth()+1) : k; };
  return f(p.desde) + ' al ' + f(p.hasta);
}
/* La planificación vigente para una fecha: la que la tiene adentro de su
   rango. Si no hay ninguna, devuelve null y la app dice que no hay
   rutina cargada, en vez de mostrar la de otra semana. */
function planDeFecha(d){
  const clave = claveFecha(d);
  const ks = Object.keys(planificaciones);
  for(let i=0;i<ks.length;i++){
    const p = planificaciones[ks[i]];
    if(p && p.desde <= clave && clave <= p.hasta) return p;
  }
  return null;
}
function recalcularRutinasDelDia(){
  rutinasVirtuales = {};
  const p = planDeFecha(fechaActiva);
  rutinasImportadas = p ? p.clases : [];
  semanaRutinas = p ? etiquetaSemana(p) : '';
  aplicarMedicionGuardada();
}
function semanasGuardadas(){
  return Object.keys(planificaciones).sort().reverse().map(k => planificaciones[k]);
}
/* Por qué no hay rutina para este día: distinguir "no importaste nada"
   de "no importaste ESTA semana" es la diferencia entre buscar un error
   en la planilla y subir el archivo que falta. */
function motivoSinRutina(){
  if(!Object.keys(planificaciones).length)
    return 'Todavía no se importó ninguna planificación. Subí la planilla de Rutinas desde "Importar datos".';
  if(!planDeFecha(fechaActiva))
    return 'No hay planificación cargada para la semana de este día. Hay ' + semanasGuardadas().length
         + ' semana(s) guardada(s), pero ninguna lo cubre.';
  return 'No hay rutina cargada para esta clase. Revisá que el día y la disciplina de la planilla coincidan con los de la reserva.';
}

/* "hoy" en el plan completo: sólo si el plan que se está mirando es el
   de la semana de hoy. Antes bastaba con que coincidiera el nombre del
   día, y el lunes de la semana pasada aparecía como hoy. */
function esDiaDeHoyEnPlan(c){
  const hoy = claveFecha(new Date());
  const p = planDeFecha(fechaActiva);
  return !!(p && p.desde <= hoy && hoy <= p.hasta && c.dia === diaDeHoy());
}
function motivoSinRutinaClase(c){
  const e = eleccionDe(c);
  if(e && e.reuso) return 'Para esta clase se eligió la rutina de ' + textoReuso(e.reuso)
    + ', pero esa planificación no está cargada en este aparato. Importala, o elegí otra del banco.';
  return motivoSinRutina();
}

/* ---------- Ajustes a mano de la lista de una clase ----------
   La lista sale de la planilla de turnos de Crossfy y se rearma cada vez
   que se importa. Por eso lo que se cambia a mano en la clase (alguien
   que se sumó a último momento, alguien que no vino) NO se escribe sobre
   esa lista: se guarda aparte y se vuelve a aplicar encima de lo que
   traiga Crossfy. Si no, la próxima importación del día lo borraba.
   Clave: fecha|hora|disciplina — no el id de la clase (c1, c2…), que se
   renumera si Crossfy trae una clase nueva.
     agregados: sumados a mano
     ausentes:  reservaron y no vinieron (quedan en la lista, fuera del conteo)
     quitados:  sacados de la lista (no cuentan ni como presentes ni como ausentes) */
function claveAjuste(c){ return claveActiva() + '|' + (c.hora || '') + '|' + normDisc(c.disciplina); }
function ajusteDe(c, crear){
  const k = claveAjuste(c);
  if(!ajustesClase[k] && crear) ajustesClase[k] = {agregados:[], ausentes:[], quitados:[]};
  /* Hora y disciplina como vienen, y cuándo se sumó a cada uno: el
     registro de pruebas los necesita para armar la fila. */
  if(ajustesClase[k] && crear){ ajustesClase[k].hora = c.hora || ''; ajustesClase[k].disc = c.disciplina; }
  return ajustesClase[k] || null;
}
function persistAjustes(){ try{ akStore.setItem('akasha-ajustes-clase', JSON.stringify(ajustesClase)); }catch(e){} }
function sacarDe(lista, id){ const i = lista.indexOf(id); if(i !== -1) lista.splice(i, 1); }
function ponerEn(lista, id){ if(lista.indexOf(id) === -1) lista.push(id); }
function esAusente(c, id){ return (c.ausentes || []).indexOf(id) !== -1; }
function presentesDe(c){ return c.alumnosIds.filter(id => !esAusente(c, id)); }
function esAusenteGuardado(c, id){
  const aj = ajustesClase[claveAjuste(c)];
  if(aj && (aj.ausentes || []).indexOf(id) !== -1) return true;
  return estadoCrossfy(c, id) === 'AUSENTE' && !(aj && (aj.presentes || []).indexOf(id) !== -1);
}
function marcaDeApp(c, id){
  const aj = ajustesClase[claveAjuste(c)] || {};
  if((aj.ausentes || []).indexOf(id) !== -1) return 'ausente';
  if((aj.presentes || []).indexOf(id) !== -1) return 'presente';
  return '';
}
/* Estado de esa persona en esa clase según la última planilla de turnos
   de Crossfy: PRESENTE, AUSENTE, RESERVADO, o '' si no tiene reserva. */
function estadoCrossfy(c, id){
  const r = (reservasImportadas[claveActiva()] || []).find(x =>
    x.alumnoId === id && x.hora === c.hora && normDisc(x.disciplina) === normDisc(c.disciplina));
  if(!r) return '';
  const e = String(r.estado || '').toUpperCase();
  return e.indexOf('PRESENT') === 0 ? 'PRESENTE' : e.indexOf('AUSENT') === 0 ? 'AUSENTE' : 'RESERVADO';
}
/* Lo que la app tiene marcado y Crossfy no. La app manda en la app, pero
   la asistencia que cuenta para el plan es la de Crossfy: el aviso es
   para que se corrija allá, y se va solo al reimportar si coincide. */
/* Crossfy pasa las reservas a PRESENTE o AUSENTE recién después de la
   clase. Mientras todas sigan en RESERVADO no hay con qué comparar: el
   aviso saldría antes de tiempo. */
function reservasCrossfyDeClase(c){
  return (reservasImportadas[claveActiva()] || []).filter(x =>
    x.hora === c.hora && normDisc(x.disciplina) === normDisc(c.disciplina));
}
function crossfyTomoAsistencia(c){
  return reservasCrossfyDeClase(c).some(x => /^(PRESENT|AUSENT)/i.test(String(x.estado || '')));
}
function esReservaDePrueba(c, id){
  return reservasCrossfyDeClase(c).some(x => x.alumnoId === id && x.prueba);
}
function diferenciaCrossfy(c, id){
  if(!c.real || !crossfyTomoAsistencia(c)) return '';
  const cx = estadoCrossfy(c, id);
  const marca = marcaDeApp(c, id);
  if(!cx) return esAusente(c, id) ? '' : 'No tiene reserva en Crossfy: no se le descontó la clase de su plan';
  if(marca === 'ausente' && cx === 'PRESENTE') return 'En Crossfy figura presente: se le cuenta como asistencia';
  if(marca === 'ausente' && cx === 'RESERVADO') return 'En Crossfy no está marcada la falta';
  if(marca === 'presente' && cx === 'AUSENTE') return 'En Crossfy figura ausente: se le cuenta la falta';
  return '';
}
function diferenciasClase(c){
  if(!c.real || !crossfyTomoAsistencia(c)) return 0;
  let n = c.alumnosIds.filter(id => diferenciaCrossfy(c, id)).length;
  n += (c.quitadosMano || []).filter(id => estadoCrossfy(c, id)).length;
  return n;
}
/* Después de cambiar un ajuste se rehace la lista, sin perder en qué
   clase estaba parado el profe (el id puede cambiar si la clase se
   reordena; se la vuelve a encontrar por hora y disciplina). */
function rehacerClase(c){
  const hora = c.hora, disc = c.disciplina;
  persistAjustes();
  CLASES = construirClases();
  const nueva = CLASES.find(x => x.hora === hora && x.disciplina === disc);
  if(nueva && state.screen === 'clase') state.params.claseId = nueva.id;
  render();
}
function marcarNoVino(claseId, id){
  const c = getClase(claseId); if(!c) return;
  const aj = ajusteDe(c, true);
  ponerEn(aj.ausentes, id);
  if(aj.presentes) sacarDe(aj.presentes, id);
  rehacerClase(c);
}
/* "Sí vino": si la falta venía de Crossfy, queda anotado que en la app
   se dijo lo contrario (y eso es una diferencia a corregir allá). */
function marcarVino(claseId, id){
  const c = getClase(claseId); if(!c) return;
  const aj = ajusteDe(c, true);
  sacarDe(aj.ausentes, id);
  if(estadoCrossfy(c, id) === 'AUSENTE'){ aj.presentes = aj.presentes || []; ponerEn(aj.presentes, id); }
  rehacerClase(c);
}
/* Quitar: a alguien sumado a mano se lo deshace; a alguien que vino de
   Crossfy se lo marca como quitado, para que no vuelva al reimportar. */
/* Quitar saca a alguien de la lista sin borrar lo que pasó: si estaba
   marcado como que no vino, eso queda (es lo que el registro de pruebas
   cuenta como reservó y faltó). Vale igual para los de Crossfy y para los
   agregados a mano. */
function quitarDeClase(claseId, id){
  const c = getClase(claseId); if(!c) return;
  ponerEn(ajusteDe(c, true).quitados, id);
  rehacerClase(c);
}
/* Para un agregado a mano por error: lo borra del todo, sin dejar
   rastro (no reservó, fue una equivocación al cargar). */
function borrarAgregado(claseId, id){
  const c = getClase(claseId); if(!c) return;
  const aj = ajusteDe(c, true);
  sacarDe(aj.agregados, id); sacarDe(aj.ausentes, id); sacarDe(aj.quitados, id);
  if(aj.agregadosEn) delete aj.agregadosEn[id];
  rehacerClase(c);
}
function devolverAClase(claseId, id){
  const c = getClase(claseId); if(!c) return;
  sacarDe(ajusteDe(c, true).quitados, id);
  rehacerClase(c);
}
function agregarAClase(claseId, id){
  const c = getClase(claseId); if(!c) return;
  const aj = ajusteDe(c, true);
  sacarDe(aj.quitados, id); sacarDe(aj.ausentes, id);
  if(c.alumnosIds.indexOf(id) === -1 || (c.agregadosMano || []).indexOf(id) !== -1){
    ponerEn(aj.agregados, id);
    aj.agregadosEn = aj.agregadosEn || {};
    if(!aj.agregadosEn[id]) aj.agregadosEn[id] = HOY_CLAVE;
  }
  state.agregarAbierto = null; agregarQuery = '';
  rehacerClase(c);
  showToast(nombreCompleto(getAlumno(id)) + ' agregado a la clase');
}
/* Alguien que no está en la base de Crossfy (por ejemplo, viene a
   probar): queda como Prueba, igual que una reserva sin usuario. */
function agregarPruebaAClase(claseId){
  const t = agregarQuery.trim().replace(/\s+/g, ' ');
  const i = t.indexOf(' ');
  if(i < 1){ showToast('Escribí nombre y apellido'); return; }
  const id = idProvisorio(t.slice(0, i), t.slice(i + 1));
  persistReservas();
  agregarAClase(claseId, id);
}
let agregarQuery = '';
function buscarAlumnosParaAgregar(q, excluir){
  const toks = claveNombre(q, '').split(' ').filter(Boolean);
  if(!toks.length) return [];
  const res = [];
  ALUMNOS.forEach(a => {
    if(excluir.indexOf(a.id) !== -1) return;
    const k = claveNombre(a.nombre, a.apellido);
    if(!toks.every(t => k.split(' ').some(w => w.indexOf(t) === 0))) return;
    /* Primero los que tienen paquete activo: son los que más
       probablemente estén entrenando hoy. */
    const p = (String(a.paquete).toUpperCase() === 'ACTIVO' ? 2 : 0) + (String(a.estado) === 'Activo' ? 1 : 0) + (a.prueba ? 1 : 0);
    res.push({a, p});
  });
  return res.sort((x, y) => y.p - x.p || nombreCompleto(x.a).localeCompare(nombreCompleto(y.a))).slice(0, 8).map(x => x.a);
}
function agregarListaHtml(claseId){

    + (q.indexOf(' ') > 0 ? `<button type="button" class="pend-nuevo" onclick="agregarPruebaAClase('${c.id}')">+ «${esc(q)}» no está: agregar como Prueba</button>` : '')
    + (!res.length && q.indexOf(' ') < 1 ? '<div class="medicion-nada">No aparece. Si es alguien nuevo, escribí nombre y apellido para sumarlo como Prueba.</div>' : '');
}

/* Fecha de Crossfy ("2026-10-05 15:00:00", fecha de Excel o Date) a
   clave AAAA-MM-DD. */
function claveDeCelda(v){
  const f = aFechaImport(v);
  return f && !isNaN(f.getTime()) ? claveFecha(f) : '';

function numCelda(v){
  if(typeof v === 'number') return v;
  const t = String(v == null ? '' : v).replace(/[^0-9,.-]/g, '').replace(/\.(?=\d{3}(\D|$))/g, '').replace(',', '.');
  const n = parseFloat(t);
  return isNaN(n) ? null : n;
}

/* Arma las clases del día con las reservas importadas — con la
   disciplina que diga el archivo — más las creadas a mano. Sin reservas
   ni clases a mano, el día queda sin clases y Hoy avisa qué importar.
   Un alumno SÍ puede estar en más de un turno el mismo día: pasa en el
   gimnasio, y antes lo filtrábamos por una regla inventada. */
function construirClases(){
  const delDia = reservasImportadas[claveActiva()] || [];
  let clases;
  if(delDia.length){
    const grupos = {};
    delDia.forEach(r => {
      const k = r.hora + '|' + r.disciplina;
      if(!grupos[k]) grupos[k] = {hora:r.hora, disciplina:r.disciplina, alumnosIds:[]};
      if(grupos[k].alumnosIds.indexOf(r.alumnoId) === -1) grupos[k].alumnosIds.push(r.alumnoId);
    });
    clases = Object.keys(grupos).map(k => grupos[k])
      .sort((a,b) => a.hora.localeCompare(b.hora) || a.disciplina.localeCompare(b.disciplina))
      .map((g,i) => ({id:'c'+(i+1), hora:g.hora, disciplina:g.disciplina,
                      alumnosIds:g.alumnosIds, finalizada:false, obsFinal:'', real:true}));
  }else{
    clases = [];
  }
  /* Las creadas a mano se suman con su propio id (no corren los ids de
     las de Crossfy, que es con lo que se guardan las finalizadas). Si
     Crossfy ya trae esa clase, no se duplica: los alumnos agregados a
     mano quedan en la de Crossfy porque los ajustes van por hora y
     disciplina. */
  (clasesManuales[claveActiva()] || []).forEach(m => {
    if(clases.some(c => c.hora === m.hora && normDisc(c.disciplina) === normDisc(m.disciplina))) return;
    clases.push({id: m.id, hora: m.hora, disciplina: m.disciplina, alumnosIds: [],
                 finalizada:false, obsFinal:'', real:true, manual:true});
  });
  clases.sort((a,b) => a.hora.localeCompare(b.hora) || a.disciplina.localeCompare(b.disciplina));
  /* Los ajustes a mano se aplican ENCIMA de lo que trajo Crossfy. */
  const delDiaCx = reservasImportadas[claveActiva()] || [];
  clases.forEach(c => {
    c.ausentes = []; c.agregadosMano = []; c.quitadosMano = [];
    /* Si Crossfy ya lo tiene como AUSENTE y en la app nadie dijo lo
       contrario, se muestra como que no vino. Si no, cada falta cargada
       en Crossfy aparecía como una "diferencia" que nadie había marcado. */
    const ausCx = delDiaCx.filter(r => r.hora === c.hora && normDisc(r.disciplina) === normDisc(c.disciplina)
      && String(r.estado || '').toUpperCase() === 'AUSENTE').map(r => r.alumnoId);
    const aj = ajustesClase[claveAjuste(c)];
    if(!aj){ c.ausentes = ausCx.filter(id => c.alumnosIds.indexOf(id) !== -1); return; }
    (aj.agregados || []).forEach(id => {
      if(c.alumnosIds.indexOf(id) === -1){ c.alumnosIds.push(id); c.agregadosMano.push(id); }
    });
    c.quitadosMano = (aj.quitados || []).filter(id => c.alumnosIds.indexOf(id) !== -1);
    c.alumnosIds = c.alumnosIds.filter(id => c.quitadosMano.indexOf(id) === -1);
    const pres = aj.presentes || [];
    c.ausentes = (aj.ausentes || []).concat(ausCx.filter(id => pres.indexOf(id) === -1 && (aj.ausentes || []).indexOf(id) === -1))
      .filter(id => c.alumnosIds.indexOf(id) !== -1);
  });
  /* Rehacer las clases no puede borrar qué turnos ya se finalizaron —
     y los de otro dia no tienen que pisar los de este. */
  const fin = finalizadasPorFecha[claveActiva()] || [];
  clases.forEach(c => {
    c.finalizada = fin.indexOf(c.id) !== -1;
    const nt = notasClase[claveNotaClase(claveActiva(), c.hora, c.disciplina)];
    c.obsFinal = nt ? nt.texto : '';
  });
  return clases;
}

let CLASES = construirClases();

/* Crear y borrar clases a mano. */
function crearClaseManual(){
  const h = document.getElementById('nueva-clase-hora');
  const d = document.getElementById('nueva-clase-disc');
  const otra = document.getElementById('nueva-clase-otra');
  const hora = h ? aHoraImport(h.value) : '';
  const disc = (otra && otra.value.trim()) || (d ? String(d.value || '').trim() : '');
  if(!hora || !disc){ aviso('Completá la hora y la disciplina.'); return; }
  if(CLASES.some(c => c.hora === hora && normDisc(c.disciplina) === normDisc(disc))){ aviso('Esa clase ya está en la lista.'); return; }
  const k = claveActiva();
  (clasesManuales[k] = clasesManuales[k] || []).push({id: 'm' + Date.now().toString(36), hora, disciplina: disc});
  persistClasesManuales();
  state.crearClase = false;
  CLASES = construirClases();
  render();
}
/* La confirmación es un cartel de la app y no un confirm() del
   navegador: en la versión publicada los carteles del navegador están
   bloqueados, confirm() devolvía "no" sin mostrar nada y el botón
   parecía no hacer nada. */
function pedirBorrarClase(id){ state.borrarClase = id; render(); }
function borrarClaseManual(id){
  const k = claveActiva();

  clasesManuales[k] = clasesManuales[k].filter(x => x.id !== id);

  delete ajustesClase[k + '|' + m.hora + '|' + normDisc(m.disciplina)];
  persistClasesManuales(); persistAjustes();
  CLASES = construirClases();
  nav('hoy');
}

/* El ejercicio medido ya no viene de la planilla: la plantilla de

   datos sensibles (lesiones, diagnósticos, objetivos personales) y esta

/* Aplica respuestas del formulario sobre las fichas. Recibe filas
   {id, objetivo, observacionIngreso} con el Id Socio ya resuelto.
   Sólo toca esos dos campos: las alertas y adaptaciones que cargó el
   profe a mano no se pisan nunca. Devuelve cuántas fichas actualizó.
   Con persistir=true (el import de Excel, donde el profe está pidiendo
   explícitamente actualizar) queda guardado en la tablet. */
function aplicarRespuestasFormulario(filas, persistir){
  let n = 0;
  filas.forEach(f => {
    const a = getAlumno(f.id);
    if(!a) return;
    /* El formulario sólo completa lo que está vacío: no pisa lo que el
       profe o recepción cargaron a mano. */
    if(f.objetivo && !String(a.objetivo || '').trim()) a.objetivo = f.objetivo;
    if(f.observacionIngreso && !String(a.observacionIngreso || '').trim()) a.observacionIngreso = f.observacionIngreso;
    if(persistir) actualizarFichaOverride(a);
    n++;
  });
  return n;
}

/* Sin novedades de ejemplo: con alumnos reales, arranca vacío para que
   lo que se vea en la prueba sea lo que carguen Agus y Lucas en clase. */
const SEED_NOVEDADES = [];

/* La fecha DD/MM con la que se sellan y se filtran novedades, cargas y
   medicion sale ahora de fechaCorta() (ver mas arriba), que devuelve el
   dia ACTIVO. Antes era la constante TODAY_STR, calculada una sola vez
   al abrir la app, y por eso no habia forma de volver a ayer. */

/* ---------- Estado + persistencia liviana (solo en este navegador) ---------- */

let novedades = [];
let profesorActivo = PROFESORES[0];
/* Cargas: {id, alumnoId, claseId, bloque, ejercicio, kg, fecha, profesor} —
   un registro por alumno+ejercicio+día. Arranca vacío, como novedades. */
let cargas = [];
/* Qué ejercicio(s) quedaron marcados como "medidos" por bloque, editado
   desde la app (ver agregarMedicion/quitarMedicion). Clave = nombre del
   bloque ('Olímpico', 'Hipertrofia — Upper', ...) dentro de RUTINA_HOY —
   por eso alcanza con el nombre, no hace falta el día. Si hay override
   guardado pisa el valor por default que trae el bloque. */
let medicionOverrides = {};
/* Nivel asignado a cada alumno (1/2/3), editable desde la ficha. Arranca
   en 2 por default en ALUMNOS y esto lo pisa si el profe lo cambió.
   Clave = alumnoId. */
let nivelOverrides = {};
/* Filtro de nivel en la pantalla de Clase. No se persiste (es de uso
   momentáneo mientras se pasa lista) y se reinicia al cambiar de clase. */
let filtroNivelClase = 'todos';
let claseActualId = null;
/* Cargas "en curso" de la clase actual: lo que el profe ajustó a mano
   en el modal de Carga mientras la clase no se finalizó todavía. Clave
   = claseId+'|'+alumnoId+'|'+ejercicio -> kg. Si un alumno/ejercicio no
   tiene entrada acá, el valor efectivo (ver cargaEfectiva) sale del
   historial (última carga conocida) sin que el profe tenga que tocar
   nada. Recién se vuelca a `cargas` (y por lo tanto a la ficha) al
   tocar "Finalizar clase" — antes de eso no es un dato confirmado. */
let cargasPendientes = {};
function pendienteKey(claseId, alumnoId, ejercicio){ return claseId+'|'+alumnoId+'|'+ejercicio; }
/* Ediciones de ficha (alertas / objetivo / adaptaciones) hechas desde la
   app, tanto desde "Buscar alumno" como desde la ficha abierta en una
   clase. Clave = alumnoId. Si hay override guardado pisa los valores por
   default (vacíos) que trae ALUMNOS. */
let fichaOverrides = {};

/* Lectura de lo guardado en el aparato. Cada dato se lee por separado:
   antes era un solo bloque y, si fallaba la lectura de cualquier cosa
   (por ejemplo una rutina guardada con un formato viejo), se cortaba
   todo: las novedades quedaban en blanco, las fichas sin lo editado, y
   la siguiente novedad que se registraba guardaba esa lista vacía encima
   de las anteriores. Ahora un error no arrastra al resto y queda anotado
   para mostrarlo en Hoy. */
let erroresCarga = [];
let novedadesCargaFallida = false;
function leerParte(nombre, fn){
  try{ fn(); }catch(e){ erroresCarga.push(nombre + ': ' + (e && e.message ? e.message : e)); }
}
function loadState(){
  erroresCarga = [];
  leerParte('novedades', () => {
    const raw = akStore.getItem('akasha-novedades');
    try{ novedades = raw ? (JSON.parse(raw) || []) : SEED_NOVEDADES.slice(); }
    catch(e){ novedades = []; novedadesCargaFallida = true; throw e; }
    if(!Array.isArray(novedades)){ novedades = []; novedadesCargaFallida = true; throw new Error('formato inesperado'); }
  });
  leerParte('profesor', () => { profesorActivo = akStore.getItem('akasha-profesor') || PROFESORES[0]; });
  leerParte('finalizadas', () => {
    const fin = finalizadasPorFecha[claveActiva()] || [];
    CLASES.forEach(c => { c.finalizada = fin.indexOf(c.id) !== -1; });
  });
  leerParte('cargas', () => { const r = akStore.getItem('akasha-cargas'); cargas = r ? (JSON.parse(r) || []) : []; });
  leerParte('medido', () => {
    const medRaw = akStore.getItem('akasha-medicion');
    medicionOverrides = medRaw ? (JSON.parse(medRaw) || {}) : {};
    /* Las claves viejas no tenían semana: se las asigna a la semana en
       curso, que es la única en la que pudieron haberse marcado con
       sentido. Así lo ya marcado no se pierde ni se reparte a las demás. */
    const semHoy = claveFecha(lunesDe(new Date()));
    let migro = false;
    Object.keys(medicionOverrides).forEach(k => {
      if(k.indexOf('§') !== -1) return;
      medicionOverrides[semHoy + '§' + k] = medicionOverrides[k];
      delete medicionOverrides[k];
      migro = true;
    });
    if(migro){ try{ akStore.setItem('akasha-medicion', JSON.stringify(medicionOverrides)); }catch(e){} }
  });
  leerParte('banco', () => {
    const borRaw = akStore.getItem('akasha-banco-borrados');
    bancoBorrados = borRaw ? (JSON.parse(borRaw) || []) : [];
    const bancoRaw = akStore.getItem('akasha-banco');
    banco = bancoRaw ? (JSON.parse(bancoRaw) || []) : [];
    const pendRaw2 = akStore.getItem('akasha-ej-pendientes');
    ejPendientes = pendRaw2 ? (JSON.parse(pendRaw2) || []) : [];
    construirIndiceBanco();
  });
  leerParte('planificaciones', () => {
    const planRaw = akStore.getItem('akasha-planificaciones');
    planificaciones = planRaw ? (JSON.parse(planRaw) || {}) : {};
    /* Migración desde el formato viejo (un solo juego de rutinas, sin
       semana): como no hay forma de saber de qué semana eran, se las da
       por la semana en curso, una sola vez. */
    if(!planRaw){
      const rutRaw = akStore.getItem('akasha-rutinas');
      const viejas = rutRaw ? JSON.parse(rutRaw) : [];
      if(viejas && viejas.length){
        const lun = lunesDe(new Date());
        planificaciones[claveFecha(lun)] = {
          desde: claveFecha(lun), hasta: claveFecha(sumarDias(lun, 6)),
          importado: HOY_CLAVE, migrada: true, clases: viejas,
        };
        persistPlanificaciones();
      }
    }
    /* Una clase guardada sin bloques (formato viejo o planilla rota)
       hacía fallar todo lo que recorre las rutinas. */
    Object.keys(planificaciones).forEach(k => {
      const pl = planificaciones[k];
      if(!pl || !Array.isArray(pl.clases)){ delete planificaciones[k]; return; }
      pl.clases.forEach(c => { if(!Array.isArray(c.bloques)) c.bloques = []; });
    });
  });
  leerParte('rutinas del día', () => recalcularRutinasDelDia());
  leerParte('nivel', () => {
    const nivelRaw = akStore.getItem('akasha-nivel');
    nivelOverrides = nivelRaw ? (JSON.parse(nivelRaw) || {}) : {};
    ALUMNOS.forEach(a => { if(nivelOverrides[a.id]) a.nivel = nivelOverrides[a.id]; });
  });
  leerParte('cargas pendientes', () => { const r = akStore.getItem('akasha-cargas-pendientes'); cargasPendientes = r ? (JSON.parse(r) || {}) : {}; });
  leerParte('devoluciones', () => { const r = akStore.getItem('akasha-devoluciones'); devoluciones = r ? (JSON.parse(r) || []) : []; });
  leerParte('pruebas fijas', () => { const r = akStore.getItem('akasha-pruebas-fijas'); pruebasFijas = r ? (JSON.parse(r) || []) : []; });

  leerParte('fichas', () => {

        a.condiciones = o.condiciones || [];
        a.adaptaciones = o.adaptaciones || [];
      }
    });

}
/* Aviso en Hoy si algo no se pudo leer: es la pista para encontrar la
   causa. Las novedades que no se pudieron leer NO se pisan. */
function avisoErroresCarga(){

/* Nunca se guarda una lista vacía encima de novedades que existen, salvo

const state = {
  screen:'hoy', params:{}, backStack:[],
  novedadModal:null,   // {alumnoId, claseId}
  finalizarModal:null, // {claseId}
  cargaModal:null,     // {alumnoId, claseId}
  fichaModal:null,     // nivel / levantar / nuevoAlumno
  adaptForm:{orig:'', nuevo:'', nota:''},   // cambio de ejercicio en curso
  tipoSel:null,
  importResults:[],
  pantallaBloque:0,       // qué bloque se está mostrando en la pantalla
  pantallaDisciplina:'',  // disciplina elegida a mano, si a esta hora hay más de una clase
};

function nav(screen, params){
  params = params || {};
  state.backStack.push({screen: state.screen, params: state.params});
  state.screen = screen; state.params = params;
  render();
  window.scrollTo(0,0);
}
/* Dias a los que se puede ir: hoy siempre, el dia que se esta viendo
   (se puede llegar a cualquiera desde el Resumen), los que tengan
   reservas importadas y los que tengan alguna clase creada a mano. Si
   el export de Crossfy traia la semana entera, la semana entera esta
   disponible sin importar nada mas. */
function diasDisponibles(){
  const set = {};
  const valida = k => /^\d{4}-\d{2}-\d{2}$/.test(k);
  set[HOY_CLAVE] = true;
  set[claveActiva()] = true;
  Object.keys(reservasImportadas).forEach(k => { if(valida(k)) set[k] = true; });
  Object.keys(clasesManuales).forEach(k => { if(valida(k) && (clasesManuales[k] || []).length) set[k] = true; });
  return Object.keys(set).sort();
}
function fechaDesdeClave(k){
  const p = String(k).split('-').map(Number);
  if(p.length !== 3 || p.some(isNaN)) return null;
  const d = new Date(p[0], p[1]-1, p[2]);
  d.setHours(0,0,0,0);
  return d;
}
/* Cambiar de dia rehace las clases y la rutina. La eleccion manual de
   disciplina en la pantalla se olvida: era de otro dia. */
function irAFecha(clave){
  const nueva = fechaDesdeClave(clave);
  if(!nueva) return;
  fechaActiva = nueva;
  CLASES = construirClases();
  /* Cada día puede caer en otra semana, y entonces le toca OTRA
     planificación: la del viernes pasado no es la de este viernes. */
  recalcularRutinasDelDia();
  state.pantallaDisciplina = '';
  ultimaHoraPantalla = null;
  state.pantallaBloque = 0;
  recalcularRutinaHoy();
  /* El id de clase que se estaba viendo puede no existir en el dia nuevo
     (cada dia numera sus clases desde c1): en ese caso se vuelve a la
     lista en vez de dejar una pantalla vacia. */
  if((state.screen === 'clase' || state.screen === 'rutina')
     && !CLASES.some(c => c.id === state.params.claseId)){
    nav('hoy');
  }else{
    render();
  }
}
function moverDia(paso){
  const ds = diasDisponibles();
  const j = ds.indexOf(claveActiva()) + paso;
  if(j < 0 || j >= ds.length) return;
  irAFecha(ds[j]);
}
function volverAHoy(){ irAFecha(HOY_CLAVE); }
/* La pantalla del salon proyecta SIEMPRE hoy: si quedo la app en un dia
   anterior, entrar a la pantalla vuelve a hoy antes de abrirla. Si no,
   alcanzaba con olvidarse de volver para terminar proyectando en la
   pared la rutina de ayer. */
function abrirPantalla(){
  if(!esHoy()) irAFecha(HOY_CLAVE);
  nav('pantalla');
}

function goBack(){
  const prev = state.backStack.pop();
  if(prev){ state.screen = prev.screen; state.params = prev.params; }
  else { state.screen = 'hoy'; state.params = {}; }
  render();
  window.scrollTo(0,0);
}

/* ---------- Helpers de datos ---------- */

function getAlumno(id){ return ALUMNOS.find(a => a.id === id); }
/* Ficha mínima para un socio que viene en una reserva pero no está en la
   base. Pasaba con gente que se asoció después de la foto de usuarios que
   trae la app: la clase que los incluía no abría — el render se cortaba
   con un error y, desde afuera, el botón parecía no hacer nada. Ahora la
   clase abre igual y el que falta se ve, que es mejor que esconderlo. */
function alumnoFaltante(id){
  return {id, nombre:'Socio', apellido:'#' + id, estado:'', paquete:'',
          objetivo:'', nivel:2, observacionIngreso:'', faltante:true,
          condiciones:[], adaptaciones:[]};
}
/* Al socio que falta no alcanza con mostrarlo en la lista de la clase: hay
   que DARLO DE ALTA. Si no, se le puede registrar una novedad y después el
   Resumen del día revienta al no encontrarlo — que es exactamente lo que
   pasó. Entrándolo a la base una sola vez, cualquier pantalla que lo
   busque lo encuentra. Queda marcado como faltante hasta que se importe el
   listado de Crossfy actualizado, que lo completa con su nombre real. */
function alumnoDeClase(id){
  let a = getAlumno(id);
  if(a) return a;
  a = alumnoFaltante(id);
  ALUMNOS.push(a);
  if(!alumnosImportados.some(x => x.id === id)){
    alumnosImportados.push({id, nombre:a.nombre, apellido:a.apellido, estado:'', paquete:'', faltante:true});
    persistReservas();
  }
  indiceNombres = null;
  return a;
}
function getClase(id){ return CLASES.find(c => c.id === id); }
function nombreCompleto(a){ return a ? (a.nombre + ' ' + a.apellido) : 'Socio sin identificar'; }
function nowHora(){
  const d = new Date();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
/* Las alertas de un alumno son sus novedades de Molestia (amarilla) y
   Dolor (roja) que todavía no se levantaron, más las que se cargaron a
   mano antes de que existiera este vínculo. Se arma un índice por alumno
   y se descarta en cada render o cuando cambian las novedades. */
let cacheAlertas = null;
function alertasDe(a){
  if(!cacheAlertas){
    cacheAlertas = {};
    novedades.forEach(n => {
      if(n.borrada || n.levantada || (n.tipo !== 'molestia' && n.tipo !== 'dolor')) return;
      (cacheAlertas[n.alumnoId] = cacheAlertas[n.alumnoId] || []).push({
        fuente:'nov', id:n.id, nivel: n.tipo === 'dolor' ? 'rojo' : 'amarillo',
        texto: n.nota || detalleNov(n) || TIPOS[n.tipo].label, fecha:n.fecha, profesor:n.profesor, tipo:n.tipo});
    });
  }
  const viejas = (a.condiciones || []).map((c, i) => ({c, i})).filter(x => !x.c.levantada)
    .map(x => ({fuente:'cond', i:x.i, nivel:x.c.nivel, texto:x.c.texto, fecha:'', profesor:''}));
  return viejas.concat(cacheAlertas[a.id] || []).sort((x, y) => (y.nivel === 'rojo') - (x.nivel === 'rojo'));
}
function condicionMasSevera(alumno){
  const l = alertasDe(alumno);
  return l.find(c => c.nivel === 'rojo') || l[0] || null;
}
function nivelClass(n){ return 'n' + (n || 2); }
function nivelLabel(n){ return 'N' + (n || 2); }
function cambiarNivel(alumnoId, nivel){
  const a = getAlumno(alumnoId);
  if(!a) return;
  a.nivel = nivel;
  nivelOverrides[alumnoId] = nivel;
  persistNivel();
  render();
}
/* Las borradas no se eliminan: quedan marcadas, así el borrado viaja en
   el resumen del día al otro aparato igual que una novedad nueva. */
function novedadesDeAlumno(id){
  return novedades.filter(n => n.alumnoId === id && !n.borrada && !n.convertida).slice()
    .sort((a,b) => ((b.dia || '') + b.fecha + b.hora).localeCompare((a.dia || '') + a.fecha + a.hora));
}
function novedadesDeHoy(){
  return novedades.filter(n => n.fecha === fechaCorta() && !n.borrada && !n.convertida).slice().sort((a,b) => (b.hora).localeCompare(a.hora));
}
/* Una novedad es de una clase por fecha, hora y disciplina. Las viejas
   sólo tenían el id de la clase (c1, c2…), que se repite todos los días:
   esas se reconocen por id y fecha corta. */
function esNovedadDeClase(n, c){
  if(n.dia) return n.dia === claveActiva() && n.claseHora === c.hora && normDisc(n.claseDisc) === normDisc(c.disciplina);
  return n.claseId === c.id && n.fecha === fechaCorta();
}
function novedadesDeClase(claseId){
  const c = getClase(claseId);
  return c ? novedades.filter(n => !n.borrada && !n.convertida && esNovedadDeClase(n, c)) : [];
}
/* ¿Se finalizó la clase de esa novedad? Se arman las clases de ese día
   para saberlo (las finalizadas se guardan por día). */
function claseDeNovedadFinalizada(n, cache){
  const k = n.dia + '|' + n.claseHora + '|' + normDisc(n.claseDisc);
  if(cache && k in cache) return cache[k];
  const previa = fechaActiva;
  let fin = false;
  try{
    fechaActiva = fechaDesdeClave(n.dia);
    const c = construirClases().find(x => x.hora === n.claseHora && normDisc(x.disciplina) === normDisc(n.claseDisc));
    fin = !!(c && c.finalizada);
  }finally{ fechaActiva = previa; }
  if(cache) cache[k] = fin;
  return fin;
}
/* Lista plana {bloque, ejercicio} de todo lo marcado como medido hoy. */
function medicionesDeHoy(){
  return RUTINA_HOY.bloques.flatMap((b,i) => (b.medicion||[]).map(m => ({bloque:tituloBloque(b,i), ejercicio:nombreEj(m)})));
}
/* Identidad de un ejercicio: el del banco, no el texto. Las cargas se
   guardan con el nombre que tenía el ejercicio en ese momento; si después
   se lo renombra o se lo une con otro en el editor del banco, el nombre
   viejo queda como alias y sigue apuntando al mismo ejercicio. Así el
   historial de un movimiento no se parte en dos por un cambio de nombre.
   Lo que no está en el banco se identifica por su texto normalizado. */
function idEj(nombre){
  return buscarEnBanco(nombre) || ('txt:' + normEj(nombre));
}
function mismoEj(a, b){ return idEj(a) === idEj(b); }
/* El nombre con que se MUESTRA: el oficial del banco si lo hay. */
function nombreEj(nombre){
  const id = buscarEnBanco(nombre);
  const e = id ? ejercicioPorId(id) : null;
  return e ? e.nombre : nombre;
}
/* Orden de las cargas. Antes se ordenaban por la fecha "DD/MM" como
   texto, y así "30/09" quedaba después de "05/10": la "última carga"
   que se sugería podía ser una vieja. El id de cada carga lleva la hora
   en que se guardó; eso sí ordena bien. */
function momentoCarga(c){
  if(c.ts) return c.ts;
  const m = /^k(\d{10,})/.exec(String(c.id || ''));
  return m ? Number(m[1]) : 0;
}
function cargaDe(alumnoId, ejercicio){
  return cargas.find(c => c.alumnoId===alumnoId && mismoEj(c.ejercicio, ejercicio) && c.fecha===fechaCorta());
}
/* Última carga registrada de un ejercicio para un alumno, sea de hoy o de
   una clase anterior. Es la que alimenta la sugerencia en el modal de
   Carga cuando todavía no se cargó nada hoy: el profe la ve precargada
   y la deja o la ajusta, no sale de ninguna fórmula. */
function ultimaCargaConocida(alumnoId, ejercicio){
  const regs = cargas.filter(c => c.alumnoId===alumnoId && mismoEj(c.ejercicio, ejercicio));
  if(!regs.length) return null;
  return regs.slice().sort((a,b) => momentoCarga(b) - momentoCarga(a))[0];
}
/* Historial completo de cargas de un alumno, agrupado por ejercicio y
   ordenado del más reciente al más antiguo — para mostrar en la ficha. */
function historialCargasAlumno(alumnoId){
  const regs = cargas.filter(c => c.alumnoId===alumnoId);
  const grupos = {};
  /* Agrupado por ejercicio DEL BANCO y con su nombre oficial: dos
     nombres del mismo movimiento son un solo historial. */
  regs.forEach(c => { const n = nombreEj(c.ejercicio); (grupos[n] = grupos[n] || []).push(c); });
  Object.values(grupos).forEach(list => list.sort((a,b) => momentoCarga(b) - momentoCarga(a)));
  return grupos;
}
/* Valor "en curso" para un alumno/ejercicio dentro de una clase: si el
   profe ya lo ajustó a mano en esta clase, ese; si no, el de la clase
   ya finalizada hoy (cargaDe); si tampoco, el último conocido de una
   clase anterior (ultimaCargaConocida), como sugerencia automática. Es
   lo que se ve en la fila y se precarga en el modal — todavía no es lo
   que hay en la ficha, eso se vuelca recién al finalizar la clase. */
function cargaEfectiva(claseId, alumnoId, ejercicio){
  const key = pendienteKey(claseId, alumnoId, ejercicio);
  if(cargasPendientes[key] !== undefined) return cargasPendientes[key];
  const hoy = cargaDe(alumnoId, ejercicio);
  if(hoy) return hoy.kg;
  const ultima = ultimaCargaConocida(alumnoId, ejercicio);
  return ultima ? ultima.kg : null;
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
/* Etiquetas de estado del alumno. En la lista de una clase alcanza con
   "Prueba" (lo demás es ruido mientras se pasa lista); en "Buscar alumno"
   sí sirve ver estado y paquete. */
function badgesAlumno(a, opts){
  opts = opts || {};
  let b = '';
  if(a.prueba) b += '<span class="tag-prueba">🧪 Prueba</span>';
  if(opts.soloPrueba) return b;
  if(a.estado === 'Suspendido') b += '<span class="tag-prueba badge-suspendido">Suspendido</span>';
  if(a.paquete === 'ACTIVO') b += '<span class="tag-prueba badge-paquete-ok">Paquete activo</span>';
  return b;
}
/* Ids de todos los alumnos con reserva en alguna clase de hoy. */
function idsDeHoy(){
  const set = new Set();
  CLASES.forEach(c => c.alumnosIds.forEach(id => set.add(id)));
  return set;
}

/* ---------- Screen: HOY ---------- */

/* Diferencias con Crossfy de los últimos 14 días. Como Crossfy marca
   presentes y ausentes después de la clase, casi siempre aparecen al
   importar el listado de turnos del día siguiente: por eso se juntan
   acá, en Hoy, y no sólo dentro de cada clase. */
const DIAS_DIFERENCIAS = 14;
function diferenciasPasadas(){
  const desde = new Date(fechaDesdeClave(HOY_CLAVE).getTime() - DIAS_DIFERENCIAS * 86400000);
  const kDesde = claveFecha(desde);
  const fechas = Object.keys(reservasImportadas).filter(k => k >= kDesde && k < HOY_CLAVE).sort().reverse();
  const out = [];
  const previa = fechaActiva;
  try{
    fechas.forEach(k => {
      fechaActiva = fechaDesdeClave(k);
      construirClases().forEach(c => {
        const n = diferenciasClase(c);
        if(n) out.push({fecha: k, hora: c.hora, disc: c.disciplina, n});
      });
    });
  }finally{ fechaActiva = previa; }
  return out;
}
function recuadroDiferenciasPasadas(){
  const difs = diferenciasPasadas();
  if(!difs.length) return '';
  const total = difs.reduce((a, d) => a + d.n, 0);
  return `<div class="aviso-pasado aviso-difs">
    <div><strong>${total} diferencia${total > 1 ? 's' : ''} con Crossfy en días anteriores.</strong> Corregilas en Crossfy y volvé a importar el listado de turnos: las que coincidan desaparecen solas.</div>
    <div class="difs-lista">${difs.map(d => `<button type="button" class="linkrow" onclick="abrirClaseDeDia('${d.fecha}', '${esc(d.hora)}', ${esc(JSON.stringify(d.disc))})">
      <span>${esc(fechaLegible(d.fecha))} · ${esc(d.hora)} · ${esc(d.disc)}</span><span style="color:var(--amber)">⚠ ${d.n} ›</span></button>`).join('')}</div>
  </div>`;
}
function abrirClaseDeDia(clave, hora, disc){
  irAFecha(clave);
  const c = CLASES.find(x => x.hora === hora && x.disciplina === disc);
  if(c) nav('clase', {claseId: c.id});
}

/* ---------- Clase por bloques ----------
   La rutina se ve de a un bloque, con flechas. Abajo, cada alumno con una
   línea de avisos (sólo si hay), sus últimas cargas de ESE bloque y los
   botones Carga, Novedad y No vino. */
function refFilaBloque(b){
  if(!b || !b.filas) return null;
  return b.filas[2] || b.filas[0] || b.filas[1] || b.filas[3] || null;
}
function formatoBloque(b){
  const f = refFilaBloque(b);
  if(f && f.formato) return String(f.formato);
  return b && !b.filas ? refBloqueTexto(b) : '';
}
function bloqueIdxClase(c, rut){
  const n = rut && rut.bloques ? rut.bloques.length : 0;
  const k = claveActiva() + '|' + c.id;
  let i = (state.bloqueIdx && state.bloqueIdx[k]) || 0;
  if(i >= n) i = Math.max(0, n - 1);
  return i;
}
function moverBloqueClase(claseId, paso){
  const c = getClase(claseId); if(!c) return;
  const rut = rutinaDeClase(c); if(!rut || !rut.bloques.length) return;
  const k = claveActiva() + '|' + c.id;
  state.bloqueIdx = state.bloqueIdx || {};
  const i = Math.max(0, Math.min(rut.bloques.length - 1, bloqueIdxClase(c, rut) + paso));
  state.bloqueIdx[k] = i;
  state.bloqueNov = claveBloque(rut.bloques[i], i);
  render();
}
function bloqueCardHtml(c, rut){
  const reuso = rut && rut.reusada ? `<div class="aviso-reuso-mini">♻ Reusada: ${esc(textoReuso(rut.reusada))}</div>` : '';
  const version = rut && rut.esVersion ? `<div class="aviso-reuso-mini">Versión anterior${rut.importado ? ' (importada el ' + esc(fechaCortaClave(rut.importado)) + ')' : ''}</div>` : '';
  if(!rut || !rut.bloques.length){
    return `<div class="card rutina-preview">
      <div class="head"><h3>Rutina de ${esc(c.disciplina)}</h3></div>
      <p class="empty-hist" style="margin:0 0 10px;">${esc(eleccionDe(c) && eleccionDe(c).reuso ? motivoSinRutinaClase(c) : 'No hay rutina cargada para esta clase.')}</p>
      <button type="button" class="btn btn-ghost btn-sm" style="margin-bottom:10px;" onclick="abrirBancoRutinas('${c.id}')">Elegir una del banco</button>
      <button type="button" class="btn btn-ghost btn-sm" style="margin-bottom:10px;" onclick="crearRutinaParaClase('${c.id}')">Crear rutina</button>
      <button class="verplan" onclick="nav('rutina',{claseId:'${c.id}'})">Ver plan completo →</button>
    </div>`;
  }
  const i = bloqueIdxClase(c, rut), n = rut.bloques.length, b = rut.bloques[i];
  const f = refFilaBloque(b);
  const niveles = Object.keys(b.filas || {}).filter(k => ((b.filas[k] || {}).ejs || []).length);
  const refK = f ? Object.keys(b.filas).find(k => b.filas[k] === f) : null;
  const otros = niveles.filter(k => k !== refK && Number(k) > 0).map(k => 'N' + k);
  const fmt = formatoBloque(b);
  const ejs = f ? (f.ejs || []).map(nombreEj) : [];
  return `<div class="card rutina-preview bloque-card">
    <div class="head"><h3>Rutina de ${esc(c.disciplina)}</h3>${claseConNiveles(rut) || otros.length ? '' : '<span class="tag">Igual para todos</span>'}</div>
    ${reuso}${version}
    <div class="bloque-nav">
      <button type="button" class="bloque-flecha" onclick="moverBloqueClase('${c.id}', -1)" ${i === 0 ? 'disabled' : ''} aria-label="Bloque anterior">‹</button>
      <div class="bloque-centro">
        <div class="bloque-num">Bloque ${i + 1} de ${n}</div>
        <div class="bloque-titulo">${esc(tituloBloque(b, i))}</div>
        ${fmt ? `<span class="bloque-fmt">${esc(fmt)}</span>` : ''}
        ${pruebaRefBloque(b) ? `<span class="pr-badge" style="margin:6px 0 0;">Prueba · ${esc(pruebaRefBloque(b).nombre)}</span>` : ''}
      </div>
      <button type="button" class="bloque-flecha" onclick="moverBloqueClase('${c.id}', 1)" ${i >= n - 1 ? 'disabled' : ''} aria-label="Bloque siguiente">›</button>
    </div>

      : (!b.filas ? `<div class="bloque-texto">${esc(String(b.todos || (b.niveles || [])[1] || (b.niveles || [])[0] || '').split('\n').slice(1).join('\n'))}</div>` : '')}

/* Qué le avisa la lista a cada alumno: sólo el aviso, sin detalle. */
function novedadesRecientesDe(alumnoId){
  const lim = Date.now() - 14 * 86400000;
  return novedadesDeAlumno(alumnoId).filter(n => {
    if(['molestia','dolor','cambio_nivel','alerta_levantada','adaptacion_levantada'].indexOf(n.tipo) !== -1) return false;
    const ts = Number(String(n.id || '').replace(/\D/g, '').slice(0, 13));
    return ts && ts >= lim;
  });
}
function avisosAlumnoHtml(a){
  const al = alertasDe(a), ad = adaptacionesActivas(a), nv = novedadesRecientesDe(a.id);
  const p = [];
  if(al.length) p.push(`<span class="av-${al.some(x => x.nivel === 'rojo') ? 'rojo' : 'amarillo'}">⚠ Alertas</span>`);

}
function ejsDeBloqueIdx(c, a, i){
  const b = bloquesNov(c, a)[i];
  return b ? b.ejs : [];
}
/* Últimas cargas de los ejercicios del bloque que se está viendo. */
function cargasLineaHtml(c, a, i){
  const items = ejsDeBloqueIdx(c, a, i)

    .filter(x => x.kg !== null && x.kg !== undefined);

/* Ejercicios marcados como medidos en la rutina de ESA clase. */
function medicionesDeClase(c){
  const r = rutinaDeClase(c);
  return ((r && r.bloques) || []).flatMap((b, i) => (b.medicion || []).map(m => ({bloque: tituloBloque(b, i), ejercicio: nombreEj(m)})));
}
/* Qué ejercicios ofrece el botón Carga: los del bloque que se está viendo. */
function itemsCargaModal(m){
  const c = m.claseId ? getClase(m.claseId) : null;
  if(!c) return [];
  const rut = rutinaDeClase(c);
  if(!rut || !rut.bloques.length) return [];
  const a = getAlumno(m.alumnoId);
  const i = m.bloqueIdx !== undefined ? m.bloqueIdx : bloqueIdxClase(c, rut);
  const b = rut.bloques[i]; if(!b) return [];
  const t = tituloBloque(b, i);
  const l = ejsDeBloqueIdx(c, a, i).map(e => ({bloque: t, ejercicio: e}));
  (b.medicion || []).forEach(x => { const n = nombreEj(x); if(!l.some(y => normEj(y.ejercicio) === normEj(n))) l.push({bloque: t, ejercicio: n}); });
  return l;
}
/* Qué cargas se vuelcan a la ficha al finalizar: las que el profe tocó en
   esta clase y las de los ejercicios marcados como medidos (con la última
   conocida si no se tocaron). Sólo para quien vino. */
function cargasAVolcar(c){
  const out = [];
  const med = medicionesDeClase(c);
  const prefijo = c.id + '|';
  presentesDe(c).forEach(alumnoId => {
    const mapa = {};
    med.forEach(it => { mapa[it.ejercicio] = it.bloque; });
    Object.keys(cargasPendientes).forEach(k => {
      if(k.indexOf(prefijo) !== 0) return;
      const p = k.split('|');
      if(Number(p[1]) !== alumnoId) return;
      const ej = p.slice(2).join('|');
      if(!(ej in mapa)){
        const a = getAlumno(alumnoId), bs = bloquesNov(c, a);
        const hit = bs.find(b => b.ejs.some(x => normEj(x) === normEj(ej)));
        mapa[ej] = hit ? (hit.titulo || hit.nombre) : '';
      }
    });
    Object.keys(mapa).forEach(ej => {
      const val = cargaEfectiva(c.id, alumnoId, ej);
      if(val !== null && val !== undefined) out.push({alumnoId, ejercicio: ej, bloque: mapa[ej], val});
    });
  });
  return out;
}
