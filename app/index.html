<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<title>Akasha Seguimiento</title>
<meta name="description" content="Prototipo navegable de bitácora de entrenamiento para el equipo de Akasha Fitness Club.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,600;0,700;1,700;1,800&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  /* Colores de Akasha: negro, gris y el verde de la marca (#C6FC00,
     sacado de las piezas de horarios y del logo). La app es SIEMPRE
     oscura: ese verde sobre fondo claro no se lee, y todas las piezas de
     la marca son oscuras. El verde se usa para lo que se toca y para lo
     positivo; el rojo y el ámbar quedan para las alertas (dolor,
     molestia), que tienen que saltar a la vista aunque no sean de marca. */
  :root{
    --bg:#0C0C0C; --surface:#161616; --surface-alt:#1F1F1F; --border:#2B2B2B;
    --text:#F2F2F2; --text-soft:#A6A6A6; --text-faint:#6F6F6F;
    --accent:#C6FC00; --accent-hover:#D6FF3D; --accent-soft:#1F2608; --accent-contrast:#0C0C0C;
    --green:#C6FC00; --green-soft:#1F2608;
    --amber:#F5B83D; --amber-soft:#2B2210;
    --red:#FF6B5E; --red-soft:#311614;
    /* Niveles como intensidades del verde: N1 contorno, N2 oliva, N3 pleno. */
    --n1:#C6FC00; --n1-soft:transparent;
    --n2:#0C0C0C; --n2-soft:#8FB800;
    --n3:#0C0C0C; --n3-soft:#C6FC00;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    --radius: 14px;
    --radius-sm: 9px;
    --font-display:'Barlow',system-ui,sans-serif;
    --font-body:'Source Sans 3',system-ui,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,monospace;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text); font-family:var(--font-body);
    font-size:17px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:var(--font-display); font-weight:700; margin:0; text-wrap:balance;}
  button{font-family:var(--font-body); cursor:pointer;}
  ::selection{background:var(--accent-soft);}
  :focus-visible{outline:2.5px solid var(--accent); outline-offset:2px; border-radius:6px;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

  #app{max-width:960px; margin:0 auto; padding:0 20px 96px; min-height:100vh;}
  .topbar{
    position:sticky; top:0; z-index:20; background:var(--bg);
    padding:16px 0 12px; display:flex; align-items:center; gap:12px;
    border-bottom:1px solid transparent;
  }
  .topbar.has-back{border-bottom:1px solid var(--border);}
  .backbtn{
    display:flex; align-items:center; justify-content:center;
    width:44px; height:44px; border-radius:50%; border:1px solid var(--border);
    background:var(--surface); color:var(--text); font-size:20px; flex:none;
  }
  .backbtn:active{background:var(--surface-alt);}
  .topbar-title{flex:1; min-width:0;}
  .topbar-title h1{font-size:22px; line-height:1.2;}
  .topbar-title .sub{color:var(--text-soft); font-size:14.5px; margin-top:2px;}
  .wordmark{display:flex; align-items:center;}
  .wordmark img{height:34px; width:auto; display:block;}
  .nivel-badge.n1{box-shadow:inset 0 0 0 1.5px var(--n1);}
  /* Títulos con la letra de la marca: recta, gruesa, tipo DIN. La fecha
     de arriba y el nombre del bloque en la pared van en itálica, como la
     palabra AKASHA del logo. */
  h1,h2,h3{letter-spacing:.005em;}
  .hero-date h1{font-style:italic; font-weight:800;}

  .profesor-pill{
    display:flex; align-items:center; gap:6px; border:1px solid var(--border);
    background:var(--surface); border-radius:999px; padding:8px 14px 8px 10px;
    font-size:14.5px; font-weight:600; color:var(--text); flex:none;
  }
  .profesor-pill .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);}

  .hero-date{margin:2px 0 22px;}
  .hero-date .eyebrow{font-size:13.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-faint); font-weight:600;}
  .hero-date h1{font-size:30px; margin-top:4px;}

  .section-label{
    font-size:13.5px; text-transform:uppercase; letter-spacing:.07em; font-weight:600;
    color:var(--text-faint); margin:28px 0 12px;
  }
  .section-label:first-child{margin-top:0;}

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow);
  }

  .clase-card{
    display:flex; align-items:center; gap:16px; padding:18px 20px; margin-bottom:12px;
  }
  .clase-card .hora{
    font-family:var(--font-mono); font-size:20px; font-weight:500; color:var(--text);
    font-variant-numeric:tabular-nums; flex:none; min-width:64px;
  }
  .clase-card .info{flex:1; min-width:0;}
  .clase-card .info .disc{font-family:var(--font-display); font-weight:600; font-size:17px;}
  .clase-card .info .count{color:var(--text-soft); font-size:14.5px; margin-top:2px;}
  .clase-card .estado-fin{
    font-size:13px; color:var(--green); font-weight:600; display:flex; align-items:center; gap:4px;
  }

  .btn{
    border:none; border-radius:999px; font-weight:600; font-size:16px; padding:13px 22px;
    display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:48px;
    transition:background .12s ease, transform .05s ease;
  }
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--accent); color:var(--accent-contrast);}
  .btn-primary:hover{background:var(--accent-hover);}
  .btn-primary:disabled{background:var(--text-faint); color:var(--surface); cursor:not-allowed;}
  .btn-ghost{background:transparent; color:var(--text); border:1px solid var(--border);}
  .btn-ghost:hover{background:var(--surface-alt);}
  .btn-sm{padding:9px 16px; min-height:40px; font-size:14.5px;}
  .btn-block{width:100%;}

  .linklist{display:flex; flex-direction:column; gap:2px; margin-top:34px;}
  .linkrow{
    display:flex; align-items:center; justify-content:space-between; padding:16px 4px;
    border-top:1px solid var(--border); color:var(--text); font-weight:600; font-size:15.5px;
    background:none; border-left:none; border-right:none; border-bottom:none; width:100%; text-align:left;
  }
  .linkrow .arrow{color:var(--text-faint);}
  .linkrow:active{background:var(--surface-alt);}

  .rutina-preview{padding:18px 20px; margin-bottom:22px;}
  .rutina-preview .head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px;}
  .rutina-preview h3{font-size:16.5px;}
  .rutina-preview .tag{font-size:13px; color:var(--text-soft); font-weight:600;}
  .mini-table{width:100%; border-collapse:collapse; font-size:14px;}
  .mini-table th{text-align:left; font-weight:600; color:var(--text-faint); font-size:12.5px; text-transform:uppercase; letter-spacing:.04em; padding:0 8px 8px 0;}
  .mini-table td{padding:8px 8px 8px 0; border-top:1px solid var(--border); vertical-align:top;}
  .mini-table td:first-child{font-weight:600; white-space:nowrap;}
  .verplan{display:block; margin-top:14px; text-align:right; color:var(--accent); font-weight:600; font-size:14.5px; background:none; border:none; padding:6px;}

  .alumno-row{
    display:flex; align-items:center; gap:14px; padding:16px 4px; border-top:1px solid var(--border);
  }
  .alumno-row:last-child{padding-bottom:4px;}
  .alumno-main{flex:1; min-width:0; background:none; border:none; text-align:left; padding:2px 0; display:flex; flex-direction:column; gap:5px;}
  .alumno-main .nombre{font-family:var(--font-display); font-weight:600; font-size:16.5px; color:var(--text);}
  .tag-prueba{
    display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; text-transform:uppercase;
    letter-spacing:.04em; color:var(--text-soft); background:var(--surface-alt); border:1px solid var(--border);
    border-radius:999px; padding:2px 8px; margin-left:8px; vertical-align:middle;
  }
  .cond-line{display:flex; align-items:center; gap:6px; font-size:14px;}
  .cond-line.rojo{color:var(--red);}
  .cond-line.amarillo{color:var(--amber);}
  .cond-line.ok{color:var(--text-faint);}
  .cond-line.carga-line{color:var(--accent);}
  .alumno-actions{display:flex; flex-direction:column; gap:8px; flex-shrink:0;}
  .badge-count{
    display:inline-flex; align-items:center; justify-content:center; min-width:20px; height:20px;
    border-radius:999px; background:var(--accent-soft); color:var(--accent); font-size:12px; font-weight:700; padding:0 6px;
  }

  .nivel-badge{
    display:inline-flex; align-items:center; font-size:11px; font-weight:700; padding:2px 8px;
    border-radius:999px; margin-left:8px; vertical-align:middle;
  }
  .nivel-badge.n1{background:var(--n1-soft); color:var(--n1);}
  .nivel-badge.n2{background:var(--n2-soft); color:var(--n2);}
  .nivel-badge.n3{background:var(--n3-soft); color:var(--n3);}

  .nivel-selector{display:flex; gap:8px;}
  .nivel-chip{
    flex:1; text-align:center; padding:10px 0; border:1.5px solid var(--border); border-radius:var(--radius-sm);
    background:var(--surface); font-weight:600; font-size:14px; color:var(--text);
  }
  .nivel-chip.selected{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-hover);}

  .finalizar-bar{
    position:sticky; bottom:0; padding:16px 0; background:linear-gradient(to top, var(--bg) 60%, transparent);
    margin-top:8px;
  }

  .ficha-block{padding:20px; margin-bottom:16px;}
  .ficha-block h3{font-size:14px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); margin-bottom:10px;}
  .ficha-block p{margin:0; font-size:16px;}
  .condicion-item{display:flex; gap:10px; align-items:flex-start; font-size:15.5px; padding:8px 12px; border-radius:var(--radius-sm); margin-bottom:8px;}
  .condicion-item:last-child{margin-bottom:0;}
  .condicion-item.rojo{background:var(--red-soft); color:var(--red);}
  .condicion-item.amarillo{background:var(--amber-soft); color:var(--amber);}
  .adapt-list{margin:0; padding-left:20px; font-size:15.5px;}
  .adapt-list li{margin-bottom:4px;}
  .historial-item{padding:12px 0; border-top:1px solid var(--border);}
  .historial-item:first-child{border-top:none; padding-top:0;}
  .historial-item .meta{display:flex; gap:8px; align-items:center; font-size:13px; color:var(--text-soft); margin-bottom:4px; font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
  .historial-item .tipo-emoji{font-size:14px;}
  .historial-item .nota{font-size:15.5px;}
  .empty-hist{color:var(--text-faint); font-size:15px;}

  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.65); display:flex; align-items:flex-end;
    justify-content:center; z-index:100; padding:0;
  }
  @media (min-width:640px){ .modal-overlay{align-items:center; padding:20px;} }
  .modal-sheet{
    background:var(--surface); width:100%; max-width:560px; border-radius:20px 20px 0 0;
    padding:24px 22px calc(22px + env(safe-area-inset-bottom)); box-shadow:var(--shadow); max-height:90vh; overflow-y:auto;
  }
  @media (min-width:640px){ .modal-sheet{border-radius:20px;} }
  .modal-sheet h2{font-size:20px; margin-bottom:2px;}
  .modal-sub{color:var(--text-soft); font-size:14.5px; margin-bottom:20px;}
  .tipo-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:18px;}
  @media (min-width:480px){ .tipo-grid{grid-template-columns:repeat(3,1fr);} }
  .tipo-chip{
    display:flex; flex-direction:column; align-items:center; gap:6px; padding:14px 8px;
    border:1.5px solid var(--border); border-radius:var(--radius-sm); background:var(--surface);
    font-size:13.5px; font-weight:600; color:var(--text); text-align:center; min-height:76px; justify-content:center;
  }
  .tipo-chip .emoji{font-size:22px;}
  .tipo-chip.selected{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-hover);}
  textarea{
    width:100%; border:1.5px solid var(--border); border-radius:var(--radius-sm); background:var(--bg);
    color:var(--text); font-family:var(--font-body); font-size:16px; padding:12px 14px; resize:vertical; min-height:88px;
  }
  .modal-actions{display:flex; gap:10px; margin-top:20px;}
  .modal-actions .btn{flex:1;}

  .filter-row{display:flex; gap:8px; overflow-x:auto; padding:2px 0 18px; -ms-overflow-style:none; scrollbar-width:none;}
  .filter-row::-webkit-scrollbar{display:none;}
  .chip{
    flex:none; border:1.5px solid var(--border); background:var(--surface); color:var(--text-soft);
    padding:9px 16px; border-radius:999px; font-size:14px; font-weight:600; white-space:nowrap;
  }
  .chip.active{border-color:var(--accent); background:var(--accent); color:var(--accent-contrast);}

  .resumen-group{margin-bottom:22px;}
  .resumen-group h3{font-family:var(--font-display); font-size:17px; margin-bottom:8px;}
  .resumen-item{padding:14px 16px; margin-bottom:8px;}
  .resumen-item .top{display:flex; justify-content:space-between; gap:10px; margin-bottom:4px;}
  .resumen-item .tipo-tag{font-size:13px; font-weight:600;}
  .resumen-item .tipo-tag.amber{color:var(--amber);}
  .resumen-item .tipo-tag.red{color:var(--red);}
  .resumen-item .tipo-tag.neutral{color:var(--text-soft);}
  .resumen-item .nota{font-size:15.5px; margin-bottom:6px;}
  .resumen-item .who{font-size:13px; color:var(--text-faint); font-family:var(--font-mono);}
  .empty-state{padding:40px 20px; text-align:center; color:var(--text-faint); font-size:15.5px;}

  .import-card{padding:22px; margin-bottom:18px;}
  .import-card h3{font-size:18px; margin-bottom:4px;}
  .import-card .desc{color:var(--text-soft); font-size:14.5px; margin-bottom:16px;}
  .file-input-wrap{display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
  .file-label{
    display:inline-flex; align-items:center; gap:8px; border:1.5px dashed var(--border); border-radius:var(--radius-sm);
    padding:12px 18px; font-weight:600; font-size:14.5px; color:var(--accent); background:var(--accent-soft);
  }
  .file-label input{display:none;}
  .import-result{margin-top:14px; border-top:1px solid var(--border); padding-top:14px;}
  /* Nombre del archivo y etiqueta arriba, el detalle largo abajo: en una
     sola línea el detalle le comía el ancho al nombre y lo cortaba. */
  .import-file-row{display:flex; flex-direction:column; gap:5px; font-size:14.5px; padding:10px 0; border-top:1px solid var(--border);}
  .import-file-row:first-child{border-top:none; padding-top:0;}
  .import-file-row .fname{font-family:var(--font-mono); font-size:13px; color:var(--text-soft); word-break:break-all;}
  .import-file-row .fhead{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .import-file-row .fdet{color:var(--text-soft); font-size:14px; line-height:1.45;}
  .import-file-row .ftype{font-weight:700; font-size:12.5px; padding:3px 9px; border-radius:999px;}
  .ftype.usuarios{background:var(--green-soft); color:var(--green);}
  .ftype.paquetes{background:var(--accent-soft); color:var(--accent);}
  .ftype.turnos{background:var(--amber-soft); color:var(--amber);}
  .ftype.planificacion{background:var(--surface-alt); color:var(--text-faint);}
  .ftype.rutinas{background:var(--accent-soft); color:var(--accent);}
  .ftype.formulario{background:var(--n2-soft); color:var(--n2);}
  .ftype.respaldo{background:var(--n1-soft); color:var(--n1);}
  .ftype.desconocido{background:var(--surface-alt); color:var(--text-faint);}
  .ftype.semana{background:var(--amber-soft); color:var(--amber);}
  .ftype.ejercicios{background:var(--n3-soft); color:var(--n3);}
  .import-summary{
    background:var(--green-soft); color:var(--green); border-radius:var(--radius-sm); padding:16px 18px;
    font-size:15px; margin-top:14px; line-height:1.6;
  }
  .respaldo-estado{font-size:13.5px; line-height:1.5; margin-top:10px; min-height:1px;}
  .respaldo-estado.ok{color:var(--green);}
  .respaldo-estado.aviso{color:var(--amber);}
  .respaldo-det{margin-top:12px;}
  .respaldo-det > summary{cursor:pointer; font-size:13.5px; color:var(--text-soft);}
  .respaldo-area{
    width:100%; margin-top:10px; min-height:110px; font-family:var(--font-mono); font-size:12px;
    border:1.5px solid var(--border); border-radius:var(--radius-sm); background:var(--bg);
    color:var(--text); padding:10px 12px; resize:vertical;
  }
  .import-note{font-size:13px; color:var(--text-faint); margin-top:16px; line-height:1.5;}
  .import-card .btn{margin-top:4px; margin-right:8px;}

  /* "Qué tenés al día": una fila por fuente, con un punto de color que
     se lee de un vistazo sin tener que interpretar fechas. */
  .fuente-row{display:flex; align-items:center; gap:12px; padding:11px 0; border-top:1px solid var(--border);}
  .fuente-row:first-child{border-top:none; padding-top:2px;}
  .fuente-punto{width:9px; height:9px; border-radius:50%; flex:none;}
  .fuente-punto.ok{background:var(--green);}
  .fuente-punto.viejo{background:var(--amber);}
  .fuente-punto.falta{background:var(--red);}
  .fuente-nombre{flex:1; min-width:0; font-weight:600; font-size:15px; display:flex; flex-direction:column; gap:1px;}
  .fuente-origen{font-weight:400; font-size:12.5px; color:var(--text-faint);}
  .fuente-cuando{font-size:13px; color:var(--text-soft); text-align:right; flex:none;}
  /* En el celular no entra todo en una línea: el "importado hoy" baja
     debajo del nombre en vez de pisarse con la frecuencia. */
  @media (max-width:520px){
    .fuente-row{flex-wrap:wrap;}
    .fuente-nombre{flex-basis:calc(100% - 21px);}
    .fuente-cuando{width:100%; padding-left:21px; text-align:left;}
  }
  .reset-link{background:none; border:none; color:var(--text-faint); font-size:13.5px; margin-top:30px; text-decoration:underline; padding:8px 0;}

  .toast{
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%); background:var(--text); color:var(--bg);
    padding:13px 22px; border-radius:999px; font-size:14.5px; font-weight:600; z-index:200; box-shadow:var(--shadow);
    opacity:0; transition:opacity .2s ease;
    /* El toast queda siempre en el DOM: sin esto, aunque esté invisible
       se sigue comiendo los toques sobre "Finalizar clase", que cae
       justo abajo al centro. */
    pointer-events:none;
  }
  .toast.show{opacity:1;}

  /* Acordeón de días (Plan completo de la semana) */
  .dia-acc{margin-top:2px;}
  /* Días dentro de una disciplina: sangrados para que se vea que cuelgan. */
  .dia-acc-anidado{margin-left:14px; border-left:2px solid var(--border); padding-left:10px;}
  .dia-acc-anidado > details.dia-item > summary{font-size:14.5px; padding:11px 4px;}
  details.dia-item{border-top:1px solid var(--border);}
  details.dia-item:last-child{border-bottom:1px solid var(--border);}
  details.dia-item > summary{list-style:none; cursor:pointer; padding:14px 4px; display:flex; align-items:center; gap:10px; font-family:var(--font-display); font-weight:600; font-size:15.5px;}
  details.dia-item > summary::-webkit-details-marker{display:none;}
  details.dia-item > summary .d-total{font-family:var(--font-body); font-weight:400; color:var(--text-faint); font-size:13px; margin-left:auto;}
  details.dia-item > summary .chev{color:var(--text-faint); font-size:12px; transition:transform .15s; flex-shrink:0;}
  details.dia-item[open] > summary .chev{transform:rotate(90deg);}
  details.dia-item > .dia-body{padding:0 0 14px;}

  /* Acordeón de bloques (dentro de un día) */
  .bloque-acc{border-top:1px solid var(--border);}
  details.bloque-item{border-bottom:1px solid var(--border);}
  details.bloque-item > summary{list-style:none; cursor:pointer; padding:12px 4px; display:flex; align-items:center; gap:10px;}
  details.bloque-item > summary::-webkit-details-marker{display:none;}
  details.bloque-item > summary .b-nombre{font-weight:600; min-width:0; flex-shrink:0;}
  details.bloque-item > summary .b-min{color:var(--text-faint); font-size:13px; white-space:nowrap; flex-shrink:0;}
  details.bloque-item > summary .b-ref{color:var(--text-faint); font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:0;}
  details.bloque-item > summary .chev{color:var(--text-faint); font-size:12px; transition:transform .15s; flex-shrink:0;}
  details.bloque-item[open] > summary .chev{transform:rotate(90deg);}
  .bloque-detalle{padding:4px 4px 18px; display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
  @media (max-width:640px){ .bloque-detalle{grid-template-columns:1fr; gap:12px;} }
  .nivel-block h4{font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-faint); margin:0 0 6px; font-weight:600;}
  .nivel-block .nivel-text{white-space:pre-line; font-size:13.5px; line-height:1.5;}
  .nivel-notas{margin-top:8px; padding-top:6px; border-top:1px dashed var(--border); font-size:12.5px; color:var(--text-soft); line-height:1.45;}
  .nivel-notas b{color:var(--text-faint); font-weight:600;}
  .cr-trio{display:flex; gap:6px; margin-top:10px; flex-wrap:nowrap;}
  .cr-trio .cr-campo{min-width:0;}
  .cr-trio .cr-campo select, .cr-trio .cr-campo input{padding:9px 7px; font-size:13.5px;}
  .cr-params{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .cr-campo{display:flex; flex-direction:column; gap:4px; flex:1; min-width:96px;}
  .cr-campo.cr-ancho{flex:1.4;}
  .cr-campo span{font-size:11.5px; color:var(--text-faint);}
  .cr-campo input, .cr-campo select, .cr-ej2 input[type=text], .cr-ej2 input[type=number], .cr-ej2 select{
    width:100%; min-width:0; background:var(--surface-alt); color:var(--text); border:1.5px solid var(--border);
    border-radius:var(--radius-sm); padding:9px 10px; font:inherit; font-size:14px;}
  .cr-campo input:focus, .cr-campo select:focus, .cr-ej2 input:focus, .cr-ej2 select:focus{outline:none; border-color:var(--accent);}
  .cr-vista{margin-top:8px; font-size:12.5px; color:var(--accent);}
  .cr-ej2{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:10px; padding-bottom:10px; border-bottom:1px solid var(--border);}
  .cr-ej2 .cr-q{flex:0 0 64px; width:64px;}
  .cr-ej2 .cr-u{flex:0 0 84px; width:84px;}
  .cr-ej2 .cr-n{flex:1 1 140px; width:auto;}
  .cr-ej2 .cr-q:disabled{opacity:.4;}
  .cr-lado{display:flex; align-items:center; gap:5px; font-size:13px; white-space:nowrap; background:var(--surface-alt); border:1.5px solid var(--border); border-radius:var(--radius-sm); padding:8px 10px; cursor:pointer;}
  .cr-lado input{width:auto; margin:0;}
  .cr-nuevo{flex:1 1 100%; font-size:11.5px; color:var(--amber);}
  .cr-nota{flex:1 1 100%;}
  .cr-nota{font-size:13px !important; padding:7px 10px !important;}
  @media (max-width:560px){
    .cr-ej2 .cr-n{flex:1 1 90px;}
    .cr-ej2 .cr-lado{order:1;}
    .cr-ej2 .cr-nota{order:2; flex:1 1 90px; min-width:0;}
    .cr-ej2 .chip-remove{order:3;}
    .cr-ej2 .cr-nuevo{order:4;}
  }
  .bloque-notas{grid-column:1/-1; font-size:13px; color:var(--text-faint); border-top:1px dashed var(--border); padding-top:10px; white-space:pre-line;}
  .bloque-total{padding:14px 4px 0; font-weight:600; text-align:right; font-size:14px;}
  details.bloque-item > summary .b-medida{flex-shrink:0; font-size:14px;}

  /* Ejercicio medido: editor (Rutina de hoy) y badge de solo lectura (semana) */
  .medicion-box{grid-column:1/-1; border-top:1px dashed var(--border); padding-top:12px; margin-top:2px;}
  .medicion-label{font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-faint); font-weight:600; margin-bottom:8px;}
  .medicion-tags{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px;}
  .medicion-tag{
    display:inline-flex; align-items:center; gap:6px; background:var(--accent-soft); color:var(--accent-hover);
    border-radius:999px; padding:5px 6px 5px 12px; font-size:13px; font-weight:600;
  }
  .medicion-tag button{
    background:none; border:none; color:inherit; font-size:15px; line-height:1; cursor:pointer;
    width:20px; height:20px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center;
  }
  .medicion-tag button:hover{background:rgba(255,255,255,.1);}
  .medicion-empty{color:var(--text-faint); font-size:13px;}
  .medicion-add{display:flex; gap:8px;}
  .medicion-input{
    flex:1; min-width:0; border:1.5px solid var(--border); border-radius:var(--radius-sm); background:var(--bg);
    color:var(--text); font-family:var(--font-body); font-size:14.5px; padding:9px 12px;
  }
  .medicion-readonly{color:var(--accent-hover);}
  /* Elegir el ejercicio medido tocando, en vez de escribirlo. Escribirlo
     a mano era lo que hacía que el mismo movimiento quedara registrado
     con tres nombres distintos. */
  .medicion-sub{font-size:12px; color:var(--text-faint); margin:10px 0 6px;}
  .medicion-opts{display:flex; flex-wrap:wrap; gap:7px;}
  .medicion-opt{
    border:1.5px solid var(--border); background:var(--surface); color:var(--text);
    border-radius:999px; padding:7px 13px; font-size:13.5px; font-weight:600;
  }
  .medicion-opt:hover{border-color:var(--accent); color:var(--accent-hover);}
  .medicion-mas{margin-top:12px;}
  .medicion-mas > summary{cursor:pointer; font-size:13px; color:var(--text-soft);}
  .medicion-banco{max-height:190px; overflow-y:auto; margin-top:8px; display:flex; flex-wrap:wrap; gap:7px;}
  .medicion-nada{font-size:13px; color:var(--text-faint); padding:6px 0;}
  .sel-ej .medicion-input{width:100%;}
  .sel-ej-lista{display:flex; flex-wrap:wrap; gap:7px; margin-top:8px;}
  .sel-via{font-weight:400; opacity:.75; font-size:12px;}
  .linkbtn{background:none; border:none; padding:0; color:var(--accent); font-weight:600; font-size:inherit; cursor:pointer;}
  /* Lista de la clase: ausentes, agregados a mano, quitados. */
  .alumno-row.ausente .alumno-main{opacity:.45;}
  .tag-ausente, .tag-mano{
    display:inline-block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
    border-radius:999px; padding:2px 8px; margin-left:8px; vertical-align:middle;
  }
  .tag-ausente{background:var(--surface-alt); color:var(--text-soft); border:1px solid var(--border);}
  .tag-mano{background:var(--accent-soft); color:var(--accent);}
  .btn-mini{font-size:13px; color:var(--text-faint); font-weight:600; text-align:center; padding:4px 0;}
  .agregar-wrap{border-top:1px solid var(--border); padding-top:14px; margin-top:4px;}
  /* Registro de pruebas */
  .met-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:10px;}
  .met{background:var(--surface-alt); border-radius:var(--radius-sm); padding:12px;}
  .met-v{font-family:var(--font-display); font-weight:700; font-size:26px; color:var(--text);}
  .met-t{font-size:12.5px; color:var(--text-soft);}
  .reg-fila{padding:14px 16px; margin-bottom:10px;}
  .reg-top{display:flex; align-items:center; gap:10px;}
  .reg-nom{flex:1; min-width:0; font-family:var(--font-display); font-weight:700; font-size:17px;}
  .reg-meta{font-size:13.5px; color:var(--text-soft); margin-top:2px;}
  .reg-badges{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:8px;}
  .reg-badge{font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; border-radius:999px; padding:3px 9px;
    background:var(--surface-alt); color:var(--text-soft); border:1px solid var(--border);}
  .reg-badge.asisti, .reg-badge.cerrado{background:var(--accent-soft); color:var(--accent); border-color:transparent;}
  .reg-badge.ausente, .reg-badge.perdido{background:var(--red-soft); color:var(--red); border-color:transparent;}
  .reg-badge.pendiente{background:var(--amber-soft); color:var(--amber); border-color:transparent;}
  .reg-plan{font-size:13px; color:var(--text-soft);}
  .reg-edit{display:flex; gap:8px; margin-top:10px;}
  .reg-edit input{flex:1; min-width:0; border:1.5px solid var(--border); border-radius:var(--radius-sm); background:var(--bg);
    color:var(--text); font-size:14.5px; padding:8px 11px;}
  .reg-dias{width:56px; border:1.5px solid var(--border); border-radius:6px; background:var(--bg); color:var(--text); padding:3px 6px; font-size:14px;}
  @media (max-width:520px){ .met-grid{grid-template-columns:repeat(2, 1fr);} }
  .quitados{font-size:13px; color:var(--text-faint); margin-top:12px;}

  /* Progreso (ficha) y zonas del banco */
  .prog-per{display:flex; gap:6px; margin:0 0 14px;}
  .prog-per button, .prog-mini button{flex:1; border:1.5px solid var(--border); background:var(--surface); color:var(--text-soft); border-radius:999px; padding:9px 12px; font-size:14.5px; font-weight:600;}
  .prog-per button.on, .prog-mini button.on{background:var(--accent-soft); color:var(--accent); border-color:var(--accent);}
  .prog-mini{display:flex; gap:4px;} .prog-mini button{flex:none; padding:5px 12px; font-size:13px;}
  .prog-tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:6px;}
  .prog-tile{background:var(--surface-alt); border-radius:var(--radius-sm); padding:12px;}
  .prog-tile .v{font-family:var(--font-display); font-weight:800; font-size:26px; line-height:1.1;}
  .prog-tile .k{font-size:12.5px; color:var(--text-soft); margin-top:3px;}
  .prog-secc{margin-top:18px;}
  .prog-cab{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:6px;}
  .prog-eti{font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); font-weight:700;}
  .prog-dato{display:flex; justify-content:space-between; gap:12px; padding:7px 0; border-top:1px solid var(--border); font-size:15px;}
  .prog-dato:first-of-type{border-top:none;}
  .prog-dato b{font-weight:600; text-align:right;}
  .prog-up{color:var(--accent); margin-left:8px; font-weight:700;} .prog-down{color:var(--text-faint); margin-left:8px;}
  .prog-nota{font-size:13px; color:var(--text-faint); margin-top:8px;}
  .prog-svg{width:100%; height:auto; display:block; margin:6px 0;}
  .prog-svg text{font-family:var(--font-body);}
  .prog-grupo{margin-top:10px;} .prog-grupo .gt{font-weight:700; font-size:14.5px;}
  .prog-grupo ul{margin:4px 0 0; padding-left:18px; font-size:14.5px; color:var(--text-soft);}
  .prog-grupo li{margin-bottom:3px;} .prog-grupo li b{color:var(--text);}
  .zona-chips{display:flex; flex-wrap:wrap; gap:7px;}

  /* Pruebas fijas / resultado / cronómetro */
  .pr-badge{display:inline-block; font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; background:var(--accent-soft); color:var(--accent); border-radius:999px; padding:2px 8px; margin-right:6px;}
  .prueba-line{display:block; font-size:13.5px; color:var(--text-soft); margin-top:3px;}
  .prueba-line b{color:var(--text);}
  .pr-sel{display:flex; align-items:center; justify-content:center; gap:18px; margin:14px 0 6px;}
  .pr-sel button{width:64px; height:64px; border-radius:50%; border:1.5px solid var(--border); background:var(--surface); color:var(--text); font-size:30px; font-weight:700;}
  .pr-sel .num{min-width:110px; text-align:center;} .pr-sel .num b{display:block; font-family:var(--font-display); font-size:44px; line-height:1;} .pr-sel .num span{font-size:13px; color:var(--text-soft);}
  .pr-fijas .fila{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 0; border-top:1px solid var(--border); font-size:15px;}
  .pr-fijas .fila:first-child{border-top:none;}
  .crono-t{font-family:var(--font-mono); font-size:56px; font-weight:600; text-align:center; font-variant-numeric:tabular-nums; margin:6px 0;}
  .crono-est{text-align:center; color:var(--text-soft); font-size:14.5px; margin-bottom:12px;}
  .crono-grilla{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; margin-top:14px;}
  .crono-nom{position:relative; text-align:left; border:1.5px solid var(--border); background:var(--surface); color:var(--text); border-radius:var(--radius-sm); padding:12px; min-height:68px; font-size:15px;}
  .crono-nom b{display:block; font-weight:700;} .crono-nom span{display:block; font-size:12.5px; color:var(--text-soft); margin-top:2px;}
  .crono-nom.llego{border-color:var(--accent); background:var(--accent-soft);} .crono-nom .tt{color:var(--accent); font-weight:700; font-size:15px;}
  .crono-nom .x{position:absolute; top:4px; right:6px; border:none; background:none; color:var(--text-soft); font-size:20px; padding:4px 8px;}
  .crono-pend{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:8px;}
  /* Devoluciones y tarjeta */
  .dv-campo{display:block; font-size:13px; color:var(--text-soft); font-weight:600; margin:14px 0 5px;}
  .dv-chips{display:flex; flex-wrap:wrap; gap:6px;}
  .dv-incl{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text-soft); white-space:nowrap; margin-left:8px; font-weight:400;}
  .dv-incl input{width:18px; height:18px; accent-color:var(--accent);}
  .dv-check{display:flex; gap:10px; align-items:flex-start; margin-top:14px; font-size:14.5px;}
  .dv-check input{width:20px; height:20px; accent-color:var(--accent); margin-top:1px; flex:none;}
  .tarjeta-img{display:block; width:100%; max-width:540px; margin:0 auto; border-radius:12px; border:1px solid var(--border); background:var(--surface); aspect-ratio:4/5;}
  /* Editor del banco */
  .banco-row{display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:none;
    border:none; border-top:1px solid var(--border); padding:13px 2px; color:var(--text); cursor:pointer;}
  .banco-row:first-child{border-top:none;}
  .banco-nom{flex:1; min-width:0; font-weight:600; font-size:15.5px;}
  .banco-meta{font-size:12.5px; color:var(--text-faint); white-space:nowrap;}
  .banco-alias-linea{display:block; font-weight:400; font-size:12.5px; color:var(--text-faint); margin-top:2px;}
  .banco-edit{border-top:1px solid var(--border); padding:6px 2px 18px;}
  .banco-edit h4{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); margin:16px 0 7px;}
  .banco-fila{display:flex; gap:8px;}
  .banco-fila input, .banco-edit textarea{flex:1; min-width:0; border:1.5px solid var(--border); border-radius:var(--radius-sm);
    background:var(--bg); color:var(--text); font-size:14.5px; padding:8px 11px; font-family:var(--font-body);}
  .banco-edit textarea{width:100%; min-height:60px;}
  .banco-peligro{font-size:13.5px; color:var(--text-soft); margin-top:6px;}
  /* Versiones anteriores de una clase: de solo lectura, apagadas, para
     que no se confundan con la rutina vigente. */
  .versiones{margin-top:16px; border-top:1px dashed var(--border); padding-top:12px;}
  .versiones > summary{cursor:pointer; font-size:13.5px; color:var(--text-soft);}
  .aviso-dia-nuevo{position:fixed; left:12px; right:12px; bottom:14px; z-index:999; background:var(--accent); color:var(--accent-contrast); border:none; border-radius:var(--radius-sm); padding:14px 16px; font-weight:700; font-size:15px; box-shadow:0 6px 24px rgba(0,0,0,.5);}
  textarea.nov-fin{min-height:52px; margin-top:6px;}
  .res-clase{padding:14px 18px; margin-bottom:12px;}
  .res-clase-cab{display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .res-clase-cab h3{font-family:var(--font-display); font-size:17px; margin:0;}
  .res-notas{margin:8px 0 4px;}
  .res-notas > summary{cursor:pointer; color:var(--accent); font-weight:600; font-size:14px;}
  .res-notas .nota{white-space:pre-wrap; margin-top:6px;}
  .res-alumno{margin-top:10px;}
  .res-alumno .nombre{font-weight:700;}
  .res-alumno .linea{color:var(--text-soft); font-size:14.5px; margin-top:2px;}
  .cr-lab{font-size:13px; color:var(--text-soft); display:flex; gap:8px; align-items:center;}
  .cr-ej{margin-top:6px; align-items:center;}
  .cr-bloque textarea{width:100%;}
  .cr-bloque h3{margin:0 0 10px;}
  .guardado-ok{color:var(--accent); font-size:14px; font-weight:600;}
  .nov-pendiente{display:inline-block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; background:var(--amber-soft); color:var(--amber); border-radius:999px; padding:2px 8px; margin-left:6px;}
  .nov-acciones{display:flex; gap:14px; margin-top:6px; flex-wrap:wrap;}
  .aviso-reuso{background:var(--amber-soft); color:var(--amber); border-radius:var(--radius-sm); padding:10px 12px; font-size:13.5px; margin:12px 0 4px;}
  .aviso-reuso .linkbtn{display:inline-block; margin:6px 12px 0 0;}
  .aviso-reuso-mini{font-size:12.5px; color:var(--amber); margin:-4px 0 10px;}
  .selector-rutinas{margin:12px 0 4px;}
  .selector-rutinas .filter-row{padding-bottom:8px; flex-wrap:wrap;}
  .rut-dia-cab{font-size:12.5px; color:var(--text-faint); margin:6px 0 2px;}
  .elegir-para{background:var(--surface-alt); border:1.5px solid var(--accent); border-radius:var(--radius-sm); padding:12px 14px; margin-bottom:14px; font-size:14px;}
  .version-item{margin-top:12px; padding:10px 12px; background:var(--surface-alt); border-radius:var(--radius-sm);}
  .version-cab{font-size:12.5px; color:var(--text-faint); margin-bottom:6px;}
  .version-bloque{font-size:13.5px; color:var(--text-soft); margin-top:6px;}
  .version-txt{white-space:pre-line;}

  /* Ejercicios sin reconocer: lo que entró por una rutina y no matcheó
     con el banco. No traban la importación; se resuelven acá. */
  .pend-item{border-top:1px solid var(--border); padding:14px 0;}
  .pend-item:first-of-type{border-top:none;}
  .pend-txt{font-family:var(--font-display); font-weight:600; font-size:16px;}
  .pend-veces{color:var(--text-faint); font-size:12.5px; font-weight:400; margin-left:8px;}
  .pend-acciones{display:flex; flex-wrap:wrap; gap:7px; margin-top:9px;}
  .pend-sug{
    border:1.5px solid var(--border); background:var(--accent-soft); color:var(--accent-hover);
    border-radius:999px; padding:7px 13px; font-size:13.5px; font-weight:600;
  }
  .pend-nuevo{
    border:1.5px solid var(--border); background:var(--surface); color:var(--text);
    border-radius:999px; padding:7px 13px; font-size:13.5px; font-weight:600;
  }
  .pend-manual{display:flex; gap:8px; margin-top:9px;}
  .pend-manual input{
    flex:1; min-width:0; border:1.5px solid var(--border); border-radius:var(--radius-sm);
    background:var(--bg); color:var(--text); font-size:14.5px; padding:8px 11px;
  }

  /* Modal de Cargas */
  .carga-list{margin-bottom:4px;}
  .carga-row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 0; border-top:1px solid var(--border);}
  .carga-row:first-child{border-top:none;}
  .carga-label{font-weight:600; font-size:15px; display:flex; flex-direction:column; gap:2px;}
  .carga-bloque{font-weight:400; color:var(--text-faint); font-size:12.5px;}
  .carga-input-wrap{display:flex; align-items:center; gap:6px; flex-shrink:0;}
  .carga-input-wrap input{
    width:76px; border:1.5px solid var(--border); border-radius:var(--radius-sm); background:var(--bg);
    color:var(--text); font-family:var(--font-body); font-size:16px; padding:9px 10px; text-align:right;
  }
  .carga-unit{color:var(--text-faint); font-size:13.5px;}
  .carga-sugerida{font-weight:400; color:var(--text-faint); font-size:12px;}

  /* Historial de cargas (ficha de alumno) */
  .carga-hist-group{margin-bottom:14px;}
  .carga-hist-group:last-child{margin-bottom:0;}
  .carga-hist-nombre{font-family:var(--font-display); font-weight:600; font-size:15px; margin-bottom:2px;}

  /* Pantalla Buscar alumno */
  .search-input{
    width:100%; border:1.5px solid var(--border); border-radius:var(--radius-sm); background:var(--surface);
    color:var(--text); font-family:var(--font-body); font-size:16px; padding:12px 14px;
  }

  .pantalla{

  /* Reloj: lo primero de la pantalla, arriba del nombre del bloque.

  /* El reloj va DENTRO de la fila de arriba, en el medio, entre el nombre

     pantalla: hay TV box que corre Android de celular y ahí la ventana

  .pantalla-reloj{

   profes habían planificado de verdad.

   Forma de cada clase:
     {dia, hora, disciplina, bloques:[{bloque, duracion, todos, niveles, notas, medicion}]}
   - `todos` con texto    -> la clase no se divide por nivel: una columna
   - `niveles` con texto  -> se divide en tres
   `hora` vacía significa que esa rutina vale para TODAS las clases de esa
   disciplina ese día, que es como se carga el Método (la misma rutina en
   las tres clases del día). Con hora, vale sólo para esa clase. */
/* Planificaciones guardadas, UNA POR SEMANA:
     { '2026-10-05': {desde:'2026-10-05', hasta:'2026-10-11',
                      importado:'2026-10-07', clases:[...] } }
   La clave es el lunes de la semana. Antes había un solo juego de
   rutinas y cada importación pisaba la anterior: al abrir un viernes de
   hace dos semanas se veía la rutina del viernes de ESTA semana, que es
   justo el dato que la planificación tiene que registrar. Ahora cada
   semana se guarda aparte y el día que no está cubierto no muestra
   ninguna. */
let planificaciones = {};
/* Las clases de la semana que contiene el día activo. Es una vista de
   planificaciones, no un dato propio: la recalcula recalcularRutinasDelDia().
   Se mantiene el nombre para no reescribir las pantallas. */
let rutinasImportadas = [];
/* De qué semana es la planificación cargada, tal como la escribieron en la
   celda "Semana del" de la planilla. Sirve para que nadie proyecte sin
   darse cuenta la rutina de hace tres semanas. */
let semanaRutinas = '';

const DIAS_SEMANA = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
/* --- Fecha activa ----------------------------------------------------
   La app ya no esta clavada en hoy: se puede retroceder a un dia
   anterior para finalizar una clase que quedo abierta o agregar una
   nota que falto. fechaActiva arranca SIEMPRE en hoy, y es lo unico que
   hay que mirar para saber que dia se esta editando.
   diaDeHoy() sigue siendo el dia real del calendario (lo usa el "· hoy"
   del plan completo); diaActivo() es el dia que se esta viendo. */
let fechaActiva = new Date();
fechaActiva.setHours(0,0,0,0);
function diaDeHoy(){ return DIAS_SEMANA[new Date().getDay()]; }
function diaActivo(){ return DIAS_SEMANA[fechaActiva.getDay()]; }

/* Clave de una clase. Lleva disciplina y hora porque un mismo día puede
   tener varias clases distintas — antes no hacía falta, porque había una
   sola rutina por día. */
function claveClase(c){ return c.claveVirtual || (c.dia + '|' + c.disciplina + '|' + (c.hora || '')); }
function claseConNiveles(c){
  return (c.bloques||[]).some(b => (b.niveles||[]).some(n => n && n.trim()));
}
function normDisc(s){ return String(s==null?'':s).toLowerCase().replace(/\s+/g,' ').trim(); }

/* Minutos desde medianoche, para poder comparar horarios 'HH:MM'. */
function enMinutos(hhmm){
  const m = /^(\d{1,2}):(\d{2})/.exec(String(hhmm==null?'':hhmm));
  return m ? Number(m[1]) * 60 + Number(m[2]) : null;
}

/* Qué clase está pasando ahora: la última cuyo horario ya arrancó. Si
   todavía no arrancó ninguna, la primera del día. De acá sale qué rutina
   va a la pared, sin que el profe tenga que elegir nada. */
function claseEnCurso(){
  const cs = clasesEnCurso();
  return cs.length ? cs[0] : null;
}

/* TODAS las clases de ese horario, no una sola: a la misma hora puede
   haber Método y Funcional, y cuál de las dos va a la pared no lo decide
   el reloj sino qué disciplina se está dando. */
function clasesEnCurso(){
  if(!CLASES.length) return [];
  const ahora = new Date();
  const min = ahora.getHours() * 60 + ahora.getMinutes();
  let horaElegida = null;
  CLASES.forEach(c => {
    const h = enMinutos(c.hora);
    if(h !== null && h <= min) horaElegida = c.hora;
  });
  if(horaElegida === null) horaElegida = CLASES[0].hora;
  return CLASES.filter(c => c.hora === horaElegida);
}

/* La rutina de una clase: primero una cargada para ese horario exacto;
   si no hay, una sin hora, que vale todo el día. */
/* Una rutina puede valer para más de una disciplina: GAP y GAP FEM
   comparten la misma y en la planilla se escriben separadas por coma en la
   misma celda, para no cargarla dos veces. */
function disciplinasDe(r){
  return String(r.disciplina || '').split(/\s*[,/+]\s*/).map(normDisc).filter(Boolean);
}
/* ---------- Qué rutina usa cada clase ----------
   Candidatas de una clase, en orden: las rutinas con hora propia que la
   incluyen (principales), las sin hora de esa disciplina ese día
   (secundarias), y después las versiones anteriores de cada una. Si
   nadie eligió nada, va la primera. Lo que se elige desde el plan
   completo queda guardado para ESA clase (fecha, hora y disciplina) y
   vale también para la pantalla del día. */
function candidatosDeClase(clase){
  if(!clase) return [];
  const dia = diaActivo(), d = normDisc(clase.disciplina);
  const deDisc = rutinasImportadas.filter(r => r.dia === dia && disciplinasDe(r).indexOf(d) !== -1);
  const propias = deDisc.filter(r => horasDe(r).indexOf(clase.hora) !== -1);
  const generales = deDisc.filter(r => !horasDe(r).length);
  const out = [];
  propias.forEach(r => out.push({r, v: -1, tipo: 'propia'}));
  generales.forEach(r => out.push({r, v: -1, tipo: 'general'}));
  propias.concat(generales).forEach(r => {
    for(let i = (r.versiones || []).length - 1; i >= 0; i--) out.push({r, v: i, tipo: 'version'});
  });
  return out;
}
let eleccionRutinas = {};
try{ eleccionRutinas = JSON.parse(akStore.getItem('akasha-eleccion-rutinas') || '{}') || {}; }catch(e){ eleccionRutinas = {}; }
function persistEleccionRutinas(){ try{ akStore.setItem('akasha-eleccion-rutinas', JSON.stringify(eleccionRutinas)); }catch(e){} }
function claveEleccion(clase){ return claveActiva() + '|' + (clase.hora || '') + '|' + normDisc(clase.disciplina); }
/* Fecha real de una rutina guardada: el lunes de su semana más el día. */
function fechaDeRutina(sem, dia){
  const l = fechaDesdeClave(sem);
  const i = DIAS_SEMANA.indexOf(dia);
  if(!l || i === -1) return '';
  return claveFecha(sumarDias(l, (i + 6) % 7));
}
function fechaCortaClave(k){ const p = String(k).split('-'); return p.length === 3 ? p[2] + '/' + p[1] : k; }
/* Una versión anterior o una rutina reusada no son la rutina guardada
   tal cual: se arma una copia con su propia clave, para que el ejercicio
   medido que se marque en ESA clase quede atado a ella y no a la rutina
   original. Las copias se guardan acá mientras se usan. */
let rutinasVirtuales = {};
function rutinaVirtual(clave, base, bloques, extra){
  if(rutinasVirtuales[clave]) return rutinasVirtuales[clave];
  const v = Object.assign({}, base, {claveVirtual: clave, versiones: [],
    bloques: JSON.parse(JSON.stringify(bloques || []))}, extra || {});
  v.bloques.forEach((b, i) => {
    const g = medicionOverrides[claveMedicion(clave, claveBloque(b, i))];
    b.medicion = g ? g.slice() : ((b.medicionPlanilla || []).slice());
  });
  rutinasVirtuales[clave] = v;
  return v;
}
function rutinaDeCandidato(clase, c){
  if(!c) return null;
  if(c.v < 0) return c.r;
  const ver = (c.r.versiones || [])[c.v];
  if(!ver) return null;
  return rutinaVirtual('ver|' + claveEleccion(clase) + '|' + claveClase(c.r) + '|' + c.v, c.r, ver.bloques,
    {esVersion: true, importado: ver.importado || ''});
}
function rutinaReusada(clase, e){
  const p = planificaciones[e.sem];
  const r = p && (p.clases || []).find(x => claveClase(x) === e.k);
  if(!r) return null;
  const bloques = e.v >= 0 ? ((r.versiones || [])[e.v] || {}).bloques : r.bloques;
  if(!bloques) return null;
  return rutinaVirtual('reuso|' + claveEleccion(clase) + '|' + e.sem + '|' + e.k + '|' + e.v, r, bloques,
    {reusada: e, hora: clase.hora || ''});
}
function eleccionDe(clase){ return clase ? eleccionRutinas[claveEleccion(clase)] || null : null; }
function rutinaDeClase(clase){
  if(!clase) return null;
  const e = eleccionDe(clase);
  if(e && e.reuso) return rutinaReusada(clase, e.reuso);
  const cands = candidatosDeClase(clase);
  let c = null;
  if(e) c = cands.find(x => claveClase(x.r) === e.k && x.v === e.v);
  return rutinaDeCandidato(clase, c || cands[0]);
}
/* Texto del aviso de una rutina reusada: "Funcional del 05/10 · 19:00". */
function textoReuso(e){
  return (e.disc || '') + ' del ' + fechaCortaClave(e.fecha || '') + (e.hora ? ' · ' + e.hora : '');
}
function elegirRutinaClase(claseId, i){
  const clase = getClase(claseId); if(!clase) return;
  const c = candidatosDeClase(clase)[i]; if(!c) return;
  eleccionRutinas[claveEleccion(clase)] = {k: claveClase(c.r), v: c.v, ts: Date.now(), disc: clase.disciplina, et: etiquetaCandidato(c)};
  persistEleccionRutinas();
  recalcularRutinaHoy();
  render();
}
function quitarReuso(claseId){
  const clase = getClase(claseId); if(!clase) return;
  delete eleccionRutinas[claveEleccion(clase)];
  persistEleccionRutinas();
  recalcularRutinaHoy();
  render();
}
/* Reusar: toma una rutina de cualquier semana y disciplina del banco de
   rutinas y la deja SÓLO para esta clase. La original no cambia. */
function usarRutinaEnClase(sem, k, v){
  const pp = state.params && state.params.elegirPara;
  if(!pp) return;
  const p = planificaciones[sem];
  const r = p && (p.clases || []).find(x => claveClase(x) === k);
  if(!r) return;
  const clave = pp.fecha + '|' + (pp.hora || '') + '|' + normDisc(pp.disc);
  eleccionRutinas[clave] = {ts: Date.now(), disc: pp.disc, reuso: {sem, k, v: Number(v), disc: r.disciplina,
    fecha: fechaDeRutina(sem, r.dia), hora: r.hora || ''}};
  persistEleccionRutinas();
  rutinasVirtuales = {};
  recalcularRutinaHoy();
  goBack();
}

/* RUTINA_HOY conserva la forma que tenía para no reescribir todas las
   pantallas, pero ya no es fija: se recalcula al importar una planilla y
   cuando avanza la hora y entra otra clase. */
let RUTINA_HOY = {dia: diaActivo(), disciplina:'', hora:'', bloques:[], conNiveles:false};
let ultimaHoraPantalla = null;
function recalcularRutinaHoy(){
  const candidatas = clasesEnCurso();
  /* Si cambió el horario, la elección manual de disciplina se olvida:
     era para la clase anterior. */
  const horaAhora = candidatas.length ? candidatas[0].hora : null;
  if(horaAhora !== ultimaHoraPantalla){ state.pantallaDisciplina = ''; ultimaHoraPantalla = horaAhora; }
  /* De las clases de este horario, se muestra la que el profe haya
     elegido; si no eligió ninguna, la primera que tenga rutina cargada.
     Antes se tomaba una sola clase por horario y, con dos disciplinas
     juntas, podía terminar en la pared la que no era. */
  let clase = candidatas.find(c => normDisc(c.disciplina) === normDisc(state.pantallaDisciplina || ''));
  if(!clase) clase = candidatas.find(c => rutinaDeClase(c));
  if(!clase) clase = candidatas[0] || null;
  const r = rutinaDeClase(clase);
  RUTINA_HOY = r
    ? {dia:r.dia, disciplina:(clase && clase.disciplina) || r.disciplina, hora:(clase && clase.hora) || r.hora || '',
       bloques:r.bloques, conNiveles:claseConNiveles(r), clave:claveClase(r)}
    : {dia:diaActivo(), disciplina:(clase && clase.disciplina) || '',
       hora:(clase && clase.hora) || '', bloques:[], conNiveles:false, clave:''};
}

/* Las clases de hoy salen del horario del día, no de una lista fija.
   Un día sin horarios cargados (ej. domingo, si se lo deja en []) queda
   sin clases y la pantalla de Hoy lo dice. */
/* ---------- Reservas importadas del listado de turnos de Crossfy ----------
   Forma: { 'AAAA-MM-DD': [ {hora, disciplina, alumnoId, estado} ] }.

let reservasImportadas = {};
/* Alumnos que aparecieron en el listado de turnos pero no tienen cuenta
   en Crossfy: se les arma una ficha provisoria con id negativo y quedan

let alumnosProvisorios = [];
/* Alumnos que entraron por el listado de usuarios de Crossfy y no estaban
   en la base que viene con la app (que es una foto de cuando se armó).
   Sin esto, cualquiera que se asocie después queda sin ficha y las clases
   donde aparece no se podían abrir. */
let alumnosImportados = [];
/* Ajustes a mano de la lista de cada clase (ver claveAjuste). Se declara
   acá arriba porque se carga junto con las reservas, antes de armar las clases. */
let ajustesClase = {};
/* Datos de Crossfy que hacen falta para el registro de pruebas, por Id
   Socio: fecha de alta en Crossfy, si tiene la nota "Clase de prueba",
   y el último paquete (cantidad de clases, estado, vencimiento). NO se
   guardan teléfono, email, DNI ni dirección. Viven sólo en este aparato. */
let crossfyInfo = {};
/* Paquetes comprados, de la exportación de paquetes de Crossfy:
   {pid, id, fecha, desde, vence, clases, plan, importe, estado}. */
let compras = [];
/* Lo que Agu completa a mano en cada fila del registro: canal y notas. */
let registroExtra = {};
let diasPerdido = 14;
/* Nombres de las disciplinas tal como los escribe Crossfy en el listado
   de turnos. Alimentan el desplegable de la plantilla de rutinas (botón
   "Copiar disciplinas" en el banco), así la planilla usa exactamente el
   mismo nombre que la clase y la rutina siempre encuentra su clase. */
let disciplinasCrossfy = [];
function sumarDisciplinas(nombres){
  let n = 0;
  nombres.forEach(d => {
    const t = String(d || '').trim();
    if(t && !disciplinasCrossfy.some(x => normDisc(x) === normDisc(t))){ disciplinasCrossfy.push(t); n++; }
  });
  if(n){ try{ akStore.setItem('akasha-disciplinas', JSON.stringify(disciplinasCrossfy)); }catch(e){} }
  return n;
}

function dosDig(n){ return String(n).padStart(2,'0'); }
function claveFecha(d){ return d.getFullYear() + '-' + dosDig(d.getMonth()+1) + '-' + dosDig(d.getDate()); }
/* HOY_CLAVE es el dia REAL y no cambia nunca: lo usan los avisos que
   hablan de hoy ("faltan las reservas de hoy"). Para lo que depende del
   dia que se esta viendo va claveActiva(). */
const HOY_CLAVE = claveFecha(new Date());
function claveActiva(){ return claveFecha(fechaActiva); }
function esHoy(){ return claveActiva() === HOY_CLAVE; }
/* Fecha corta DD/MM del dia activo: es el sello con el que se guardan y
   se filtran novedades, cargas y medicion. Antes era la constante
   TODAY_STR, calculada una sola vez al abrir la app. */
function fechaCorta(d){ d = d || fechaActiva; return dosDig(d.getDate()) + '/' + dosDig(d.getMonth()+1); }
