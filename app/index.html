/* ---------- Screen: RUTINA ---------- */

/* Qué acordeones (días y bloques) están abiertos. Hace falta guardarlo
   afuera del DOM porque cada render() rehace la pantalla entera: sin
   esto, marcar un ejercicio medido colapsaba todo y te devolvía arriba. */
/* Qué acordeones están abiertos. Las claves son jerárquicas y separadas
   por '/' — por ejemplo 'd:FUNCIONAL/c:Lunes|FUNCIONAL|/b:Abs' — para
   poder saber quién es hermano de quién y quién cuelga de quién.

   Abrir uno CIERRA a sus hermanos y a todo lo que colgaba de ellos: si
   estabas en funcional-lunes-abs y abrís funcional-martes, lo de lunes se
   repliega solo. Sin esto, abrir varios días dejaba la pantalla larguísima
   y había que ir cerrando a mano. */
const accAbiertos = new Set();
let ajustandoAcc = false;   // evita que cerrar hermanos dispare más toggles

function padreDe(k){ const i = k.lastIndexOf('/'); return i === -1 ? '' : k.slice(0, i + 1); }

/* "toggle" no burbujea, por eso se escucha en fase de captura. */
document.addEventListener('toggle', e => {
  const el = e.target;
  if(ajustandoAcc || !el || !el.dataset || !el.dataset.acc) return;
  const k = el.dataset.acc;

  if(el.open){
    const padre = padreDe(k);
    [...accAbiertos].forEach(otro => {
      if(otro === k || otro.indexOf(padre) !== 0) return;
      /* hermano = comparte padre y su primer tramo no es el de k */
      const primerTramo = otro.slice(padre.length).split('/')[0];
      if(padre + primerTramo !== k) accAbiertos.delete(otro);
    });
    accAbiertos.add(k);
    ajustandoAcc = true;
    document.querySelectorAll('details[data-acc]').forEach(d => {
      if(d !== el && d.open && !accAbiertos.has(d.dataset.acc)) d.open = false;
    });
    ajustandoAcc = false;
  }else{
    accAbiertos.delete(k);
    /* al cerrar algo, se olvida lo que tenía abierto adentro */
    [...accAbiertos].forEach(o => { if(o.indexOf(k + '/') === 0) accAbiertos.delete(o); });
  }
}, true);


/* Primera línea de un bloque para mostrarlo resumido. Con niveles toma el
   Nivel 2, que es el de referencia; sin niveles, el único texto que hay. */
/* Cómo se titula un bloque sin nombre. Se saca del formato, que es la
   primera línea de lo que escribió el profe: "EMOM (10'):" -> "EMOM",
   "4 series: 10 hip thrust + ..." -> "4 series". Se corta en el primer
   ':' que vaya seguido de espacio o de fin de línea, para no partir
   "cada 2:00"; si aun así queda largo, se dejan las tres primeras
   palabras. En la pared "AMRAP 12'" dice más que "Bloque 4". */
function tituloBloque(b, i){
  if(b.bloque) return b.bloque;
  const primera = String(b.todos || (b.niveles||[])[0] || '').split('\n')[0].trim();
  if(!primera) return 'Bloque ' + ((i||0) + 1);
  let t = primera;
  const corte = t.search(/:(\s|$)/);
  if(corte > 0) t = t.slice(0, corte);
  const par = t.indexOf('(');
  if(par > 0) t = t.slice(0, par);
  t = t.trim().replace(/[,;.\-]+$/, '');
  if(t.length > 28) t = t.split(/\s+/).slice(0, 3).join(' ').replace(/[,;.\-]+$/, '');
  return t || ('Bloque ' + ((i||0) + 1));
}
/* Clave estable del bloque (las rutinas guardadas de antes no la traen). */
function claveBloque(b, i){ return b.clave || b.bloque || ('#' + ((i||0) + 1)); }

function refBloque(b){
  /* Plantilla nueva: el primer movimiento (con su nombre oficial), no el
     formato. Antes la columna "Ejercicio" mostraba "4 vueltas". */
  if(b && b.filas){
    const f = b.filas[2] || b.filas[0] || b.filas[1] || b.filas[3];
    if(f && f.ejs && f.ejs.length){
      const n = nombreEj(f.ejs[0]);
      return f.ejs.length > 1 ? n + ' y ' + (f.ejs.length - 1) + ' más' : n;
    }
  }
  return refBloqueTexto(b);
}
function refBloqueTexto(b){
  const t = b.todos || (b.niveles||[])[1] || (b.niveles||[])[0] || '';
  return String(t).split('\n')[0];
}
/* Notas por ejercicio: sólo para los profes, no van a la pared. */
function notasEjHtml(b, n){
  const f = b && b.filas && b.filas[n];
  if(!f || !f.notasEj) return '';
  const l = f.notasEj.map((t, i) => t ? `<div><b>${esc(nombreEj((f.ejs || [])[i] || ''))}:</b> ${esc(t)}</div>` : '').join('');
  return l ? `<div class="nivel-notas">${l}</div>` : '';
}
function tieneNiveles(b){ return (b.niveles||[]).some(n => n && n.trim()); }

function bloquesAcordeon(bloques, opts){
  opts = opts || {};
  /* Prefijo para que los ids de input sean únicos: el día de hoy se
     dibuja dos veces en la misma pantalla (arriba en "Rutina de hoy" y
     abajo en el plan de la semana). Sin prefijo los dos bloques del
     mismo día generaban el mismo id, getElementById devolvía siempre el
     de arriba y agregar el ejercicio desde abajo no hacía nada. */
  const pref = opts.prefijo || 'x';
  const claveCl = opts.clase ? claveClase(opts.clase) : (opts.clave || '');
  /* La rama del acordeón donde cuelgan estos bloques, para que abrir uno
     cierre a sus hermanos y no a los de otra clase. */
  const rama = opts.rama || ('x:' + pref);
  return `<div class="bloque-acc">
    ${bloques.map((b,i) => {
      const bKey = claveBloque(b,i);
      const accKey = rama + '/b:' + bKey;
      return `
      <details class="bloque-item" data-acc="${esc(accKey)}" ${accAbiertos.has(accKey) ? 'open' : ''}>
        <summary>
          <span class="b-nombre">${esc(tituloBloque(b,i))}</span>
          <span class="b-min">${b.duracion ? b.duracion + ' min' : ''}</span>
          <span class="b-ref">${esc(refBloque(b))}</span>
          ${b.medicion && b.medicion.length ? `<span class="b-medida" title="Ejercicio medido: ${esc(b.medicion.join(', '))}">📏</span>` : ''}
          <span class="chev">▸</span>
        </summary>
        <div class="bloque-detalle">
          ${tieneNiveles(b)
            ? [0,1,2].map(n => `<div class="nivel-block"><h4>Nivel ${n+1}</h4><div class="nivel-text">${esc((b.niveles||[])[n] || '')}</div>${notasEjHtml(b, n + 1)}</div>`).join('')
            : `<div class="nivel-block" style="grid-column:1/-1;"><h4>Para todos</h4><div class="nivel-text">${esc(b.todos || '')}</div>${notasEjHtml(b, 0)}</div>`}
          ${b.notas ? `<div class="bloque-notas">Notas: ${esc(b.notas)}</div>` : ''}
          ${opts.editable ? medicionEditor(b, claveCl, pref, bKey) : (b.medicion && b.medicion.length ? `<div class="bloque-notas medicion-readonly">📏 Medido: ${esc(b.medicion.join(', '))}</div>` : '')}
        </div>
      </details>
    `;
    }).join('')}
    ${bloques.some(b=>b.duracion) ? `<div class="bloque-total">${bloques.every(b=>b.duracion) ? 'Total' : 'Total cargado'}: ${bloques.reduce((a,b)=>a+(Number(b.duracion)||0),0)} min</div>` : ''}
  </div>`;
}

function medicionEditor(b, claveCl, prefijo, bKey){
  bKey = bKey || claveBloque(b, 0);
  const inputId = 'med-input-' + (prefijo||'x') + '-' + String(claveCl).replace(/[^a-zA-Z0-9]+/g,'-') + '-' + String(bKey).replace(/[^a-zA-Z0-9]+/g,'-');
  return `
    <div class="medicion-box">
      <div class="medicion-label">📏 Ejercicio(s) medido(s)</div>
      <div class="medicion-tags">
        ${(b.medicion && b.medicion.length)
          ? b.medicion.map((m,i) => `<span class="medicion-tag">${esc(m)} <button type="button" onclick="quitarMedicion('${esc(claveCl)}', '${esc(bKey)}', ${i})" aria-label="Quitar">×</button></span>`).join('')
          : `<span class="medicion-empty">Ninguno todavía</span>`}
      </div>
      ${(() => {
        const propios = ejerciciosDelBloque(b).filter(n => !(b.medicion||[]).some(m => normEj(m) === normEj(n)));
        const listaId = inputId + '-banco';
        return `
        ${propios.length ? `
          <div class="medicion-sub">De este bloque — tocá el que querés medir</div>
          <div class="medicion-opts">${propios.map((n, k) =>
            `<button type="button" class="medicion-opt" onclick="medirDeBloque('${esc(claveCl)}', '${esc(bKey)}', ${k})">+ ${esc(n)}</button>`
          ).join('')}</div>` : ''}
        <div class="medicion-sub">${propios.length ? 'Otro ejercicio' : 'Elegí del banco'} — escribí y te sugiere</div>
        ${selectorEj(inputId, 'medir', {claveCl: claveCl, bKey: bKey}, 'Buscar en el banco…', '')}`;
      })()}
    </div>`;
}

/* Los ejercicios se eligen por posición, no pasando el nombre por el
   onclick: así ningún nombre con comillas o acentos puede romper el
   HTML ni colarse como código. */
function medirDeBloque(claveCl, bloqueName, k){
  const b = bloqueDe(claveCl, bloqueName);
  if(!b) return;
  const disponibles = ejerciciosDelBloque(b).filter(n => !(b.medicion||[]).some(m => normEj(m) === normEj(n)));
  ponerMedicion(claveCl, bloqueName, disponibles[k]);
}
function medirDelBanco(claveCl, bloqueName, k){
  const e = banco[k];
  if(e) ponerMedicion(claveCl, bloqueName, e.nombre);
}
/* Escribir a mano sigue siendo posible, pero ya no crea un nombre suelto:
   si coincide con algo del banco usa ESE nombre, y si no, lo agrega al
   banco. Todo lo que se mide queda con un nombre del banco, que es lo que
   hace que las cargas de un mismo movimiento se crucen entre sí. */
function medirTextoLibre(claveCl, bloqueName, inputId){
  const el = document.getElementById(inputId);
  const v = el ? el.value.trim() : '';
  if(!v) return;
  const id = buscarEnBanco(v);
  let nombre;
  if(id){ nombre = ejercicioPorId(id).nombre; }
  else{
    nombre = v;
    banco.push({id: idDesdeNombre(v), nombre: v, alias: [], notas: '', nuevo: true});
    construirIndiceBanco();
    persistBanco();
  }
  ponerMedicion(claveCl, bloqueName, nombre);
}
function ponerMedicion(claveCl, bloqueName, nombre){
  if(!nombre) return;
  const b = bloqueDe(claveCl, bloqueName);
  if(!b) return;
  b.medicion = b.medicion || [];
  if(!b.medicion.some(m => normEj(m) === normEj(nombre))) b.medicion.push(nombre);
  medicionOverrides[claveMedicion(claveCl, bloqueName)] = b.medicion;
  persistMedicion();
  persistPlanificaciones();
  render();
}
/* Filtro del banco: se esconden los que no coinciden en vez de volver a
   dibujar la lista, para que el teclado no se cierre en la tablet. */
function filtrarBanco(input, listaId){
  const q = normEj(input.value);
  const cont = document.getElementById(listaId);
  if(!cont) return;
  [...cont.querySelectorAll('[data-nom]')].forEach(el => {
    el.style.display = (!q || el.getAttribute('data-nom').indexOf(q) !== -1) ? '' : 'none';
  });
}

/* Etiqueta de cada opción del selector de rutinas de una clase. */
function etiquetaCandidato(c){
  if(c.tipo === 'propia') return 'De las ' + c.r.hora;
  if(c.tipo === 'general') return 'General del día';
  const v = (c.r.versiones || [])[c.v] || {};
  const f = v.importado ? fechaCortaClave(v.importado) : '';
  return 'Versión anterior' + (f ? ' (importada el ' + f + ')' : '') + (c.r.hora ? ' · ' + c.r.hora : '');
}
/* Arriba del plan: entre qué rutinas se puede elegir para esta clase, y
   cuál está en uso. Si hay una sola y no se reusó nada, no se muestra. */
function selectorRutinasHtml(clase){
  const cands = candidatosDeClase(clase);
  const e = eleccionDe(clase);
  if(e && e.reuso) return `<div class="aviso-reuso">♻ Rutina reusada: ${esc(textoReuso(e.reuso))}
      <button type="button" class="linkbtn" onclick="quitarReuso('${clase.id}')">Volver a la de la planilla</button>
      <button type="button" class="linkbtn" onclick="abrirBancoRutinas('${clase.id}')">Elegir otra del banco</button></div>`;
  if(cands.length < 2) return '';
  const rut = rutinaDeClase(clase);
  return `<div class="selector-rutinas">
    <div class="medicion-sub">Rutinas de ${esc(clase.disciplina)} para esta clase — tocá la que vas a usar (vale también para la pantalla del día)</div>
    <div class="filter-row">${cands.map((c, i) => {
      const activa = rutinaDeCandidato(clase, c) === rut;
      return `<button class="chip ${activa ? 'active' : ''}" onclick="elegirRutinaClase('${clase.id}', ${i})">${esc(etiquetaCandidato(c))}</button>`;
    }).join('')}</div>
  </div>`;
}
function abrirBancoRutinas(claseId){
  const c = getClase(claseId); if(!c) return;
  nav('banco', {vista: 'rutinas', elegirPara: {fecha: claveActiva(), hora: c.hora, disc: c.disciplina, claseId}});
}
function screenRutina(claseId){
  /* Esta pantalla es la de la clase desde la que se entró, no la de la
     clase en curso: arriba va su rutina y abajo el plan completo. */
  const c = getClase(claseId);
  const rut = c ? rutinaDeClase(c) : null;
  const titulo = c ? c.hora + ' · ' + c.disciplina : 'Rutina';
  const ramaClase = 'clase:' + (c ? c.id : 'x');

  return `
    ${header(titulo,
       rut ? rut.bloques.length + ' bloques' + (claseConNiveles(rut) ? ' · tres niveles' : ' · igual para todos')
           : 'Sin rutina cargada para esta clase', true)}
    <div class="card" style="padding:8px 20px 20px;">
      ${c ? selectorRutinasHtml(c) : ''}
      ${rut
        ? bloquesAcordeon(rut.bloques, {editable:true, clave: claveClase(rut), rama: ramaClase, prefijo:'hoy'})
        : `<p class="empty-hist">${esc(motivoSinRutinaClase(c))}</p>
           ${c ? `<button type="button" class="btn btn-primary btn-sm" onclick="abrirBancoRutinas('${c.id}')">Elegir una rutina del banco</button>
                  <button type="button" class="btn btn-ghost btn-sm" onclick="crearRutinaParaClase('${c.id}')">Crear rutina</button>` : ''}`}
    </div>

    <div class="section-label">Plan completo de la semana${esHoy() ? '' : ' (del día que estás viendo)'}</div>
    <p style="color:var(--text-soft); font-size:13.5px; margin:-6px 4px 10px;">${semanaRutinas ? '<strong>Semana del ' + esc(semanaRutinas) + '.</strong> ' : ''}Todas las disciplinas que trajo la planilla. El ejercicio medido se puede dejar definido con anticipación, sin esperar al día de la clase.</p>
    <div class="card" style="padding:8px 20px 20px;">
      ${rutinasImportadas.length ? `<div class="dia-acc">${planPorDisciplina()}</div>`
        : `<p class="empty-hist">${esc(motivoSinRutina())}</p>`}
    </div>
  `;
}

/* Plan completo en tres niveles: disciplina, después día, después bloques.
   Antes era una lista plana de clases y con varias disciplinas se hacía
   larga de recorrer. */
function planPorDisciplina(){
  const porDisc = {};
  rutinasOrdenadas().forEach(c => { (porDisc[c.disciplina] = porDisc[c.disciplina] || []).push(c); });

  return Object.keys(porDisc).sort().map(disc => {
    const clases = porDisc[disc];
    const kDisc = 'd:' + disc;
    return `
      <details class="dia-item" data-acc="${esc(kDisc)}" ${accAbiertos.has(kDisc) ? 'open' : ''}>
        <summary>
          <span>${esc(disc)}</span>
          <span class="d-total">${clases.length} ${clases.length === 1 ? 'día' : 'días'}</span>
          <span class="chev">▸</span>
        </summary>
        <div class="dia-body">
          <div class="dia-acc dia-acc-anidado">
            ${clases.map(c => {
              const kDia = kDisc + '/c:' + claveClase(c);
              const mins = c.bloques.reduce((a,b)=>a+(Number(b.duracion)||0),0);
              return `
              <details class="dia-item" data-acc="${esc(kDia)}" ${accAbiertos.has(kDia) ? 'open' : ''}>
                <summary>
                  <span>${esc(c.dia)}${c.hora ? ' · ' + esc(c.hora) : ''}${esDiaDeHoyEnPlan(c) ? ' · hoy' : ''}</span>
                  <span class="d-total">${c.bloques.length} bloques${mins ? ' · ' + mins + ' min' : ''}</span>
                  <span class="chev">▸</span>
                </summary>
                <div class="dia-body">${bloquesAcordeon(c.bloques, {editable:true, clase:c, rama:kDia, prefijo:'sem'})}</div>
              </details>`;
            }).join('')}
          </div>
        </div>
      </details>`;
  }).join('');
}

/* ---------- Screen: PANTALLA DEL DÍA (TV / proyector) ----------
   Pensada para el aparato que queda conectado al TV: se abre una vez y
   queda ahí. No muestra ningún dato de alumnos — sólo la rutina del día
   y la carga de referencia por nivel — así se puede dejar proyectada
   toda la clase sin exponer a nadie. Como ese aparato tiene su propio
   almacenamiento (no ve lo que se carga en la tablet), trae su propio
   modo de edición para definir ahí mismo el ejercicio medido y las
   cargas por nivel. */

/* 0.9 por defecto: es el tamaño con el que el bloque más largo entra
   completo en una pantalla de 720p sin cortarse. En un TV más grande
   conviene subirlo con A+, y queda guardado en ese dispositivo. */
let escalaPantalla = 0.9;
function cambiarEscalaPantalla(delta){
  escalaPantalla = Math.min(2.2, Math.max(0.7, Math.round((escalaPantalla + delta) * 10) / 10));
  persistEscalaPantalla();
  render();
}
/* Las cargas por nivel se sacaron de la pantalla del salón. La idea era
   mostrar en la pared una carga de referencia por nivel, pero los profes
   ya anotan la carga de cada alumno en la app, ejercicio por ejercicio:
   en la pared era el mismo dato dicho peor y ocupando lugar. El ejercicio
   medido se sigue eligiendo desde "Rutina de hoy". */

/* Un bloque por pantalla: el día entero no entra en un TV ni achicando la
   letra, y nadie va a scrollear una pared. Mostrando de a uno, el texto
   entra grande y se lee desde el otro lado del salón. Rota solo cada 25
   segundos, y con las flechas se puede fijar en el bloque que están
   haciendo. */
let pantallaAuto = true;
function avanzarBloquePantalla(delta){
  const n = RUTINA_HOY.bloques.length;
  if(!n) return;
  state.pantallaBloque = ((state.pantallaBloque + delta) % n + n) % n;
  render();
}
function irABloquePantalla(i){ state.pantallaBloque = i; render(); }
function elegirDisciplinaPantalla(disc){
  state.pantallaDisciplina = disc;
  state.pantallaBloque = 0;
  recalcularRutinaHoy();
  render();
}
function toggleAutoPantalla(){ pantallaAuto = !pantallaAuto; render(); }
/* Un solo intervalo para toda la app: chequea si corresponde rotar en vez
   de crear y destruir timers al entrar y salir de la pantalla. Se frena
   solo mientras alguien está editando, para no borrarle lo que escribe. */
setInterval(() => {
  /* Al pasar de una clase a la siguiente, la pared tiene que cambiar de
     rutina sola: nadie va a ir a tocar la tablet entre turno y turno. */
  const antes = RUTINA_HOY.clave;
  recalcularRutinaHoy();
  if(RUTINA_HOY.clave !== antes){
    state.pantallaBloque = 0;
    if(state.screen === 'pantalla') render();
    return;
  }
  if(state.screen === 'pantalla' && pantallaAuto) avanzarBloquePantalla(1);
}, 25000);

/* Reloj de la pantalla del día. Va aparte del render: si cada segundo
   se volviera a dibujar la pantalla entera, se perdería el foco de los
   inputs del modo edición y parpadearía todo. Acá sólo se reescribe el
   texto del reloj, que es un nodo suelto, y si la pantalla no está
   abierta no hace nada. */
function horaDigital(){
  const d = new Date();
  return dosDig(d.getHours()) + ':' + dosDig(d.getMinutes()) + ':' + dosDig(d.getSeconds());
}
function actualizarReloj(){
  const el = document.getElementById('pantalla-reloj');
  if(el) el.textContent = horaDigital();
}
setInterval(actualizarReloj, 1000);

/* ---------- Cambio de día ----------
   En Android, al volver a Chrome la pestaña no se recarga: la app que
   quedó abierta el domingo seguía parada en el domingo el lunes, con la
   planificación de la semana anterior. Ahora, al volver a la app y una
   vez por minuto, si cambió la fecha se recarga sola en el día nuevo
   (todo está guardado, no se pierde nada). Si alguien está escribiendo
   o tiene un cartel abierto, no lo interrumpe: muestra un aviso. */
function hayAlgoAMedias(){
  if(state.novedadModal || state.fichaModal || state.cargaModal || state.finalizarModal || state.semanaModal) return true;
  const el = document.activeElement;
  return !!(el && (el.tagName === 'TEXTAREA' || el.tagName === 'INPUT') && String(el.value || '').trim());
}
function chequearCambioDeDia(){
  if(claveFecha(new Date()) === HOY_CLAVE) return;
  if(!hayAlgoAMedias()){ location.reload(); return; }
  if(document.getElementById('aviso-dia-nuevo')) return;
  const d = document.createElement('button');
  d.id = 'aviso-dia-nuevo'; d.type = 'button'; d.className = 'aviso-dia-nuevo';
  d.textContent = 'Cambió el día. Guardá lo que estás escribiendo y tocá acá para actualizar.';
  d.onclick = () => location.reload();
  document.body.appendChild(d);
}
document.addEventListener('visibilitychange', () => { if(!document.hidden) chequearCambioDeDia(); });
window.addEventListener('focus', chequearCambioDeDia);
setInterval(chequearCambioDeDia, 60000);
function relojHtml(){
  return `<div class="pantalla-reloj" id="pantalla-reloj">${horaDigital()}</div>`;
}

/* A esta hora puede haber más de una clase (ej. GAP y Cross Trainning a
   las 10): la app no puede adivinar cuál se está dando, así que arriba
   quedan todas a la vista y quien dicta toca la suya. Cada una muestra
   la rutina que se eligió para ella en el plan completo. */
function selectorClasesPantalla(){
  const cs = clasesEnCurso();
  if(cs.length < 2) return '';
  return `<div class="pantalla-clases">${cs.map(c => {
    const tiene = !!rutinaDeClase(c);
    const activa = normDisc(c.disciplina) === normDisc(RUTINA_HOY.disciplina);
    return `<button class="btn pantalla-btn ${activa ? 'activa' : ''}" ${tiene ? '' : 'disabled'}
      onclick="elegirDisciplinaPantalla(${esc(JSON.stringify(c.disciplina))})">${esc(c.hora)} · ${esc(c.disciplina)}${tiene ? '' : ' · sin rutina'}</button>`;
  }).join('')}</div>`;
}
function screenPantalla(){
  const dia = RUTINA_HOY.dia;
  const bloques = RUTINA_HOY.bloques;
  if(!bloques.length){
    return `
      <div class="pantalla" style="--esc:${escalaPantalla}">
        <div class="pantalla-top">
          <div class="pantalla-titulo"><div class="pantalla-dia">${esc(dia)}</div></div>
          ${relojHtml()}
          <div class="pantalla-acciones">
            <button class="btn pantalla-btn" onclick="salirPantalla()">Salir</button>
          </div>
        </div>
        ${selectorClasesPantalla()}
        <div class="pantalla-vacio">${esc(motivoSinRutina())}</div>
      </div>`;
  }

  const i = Math.min(state.pantallaBloque, bloques.length - 1);
  const b = bloques[i];
  /* Una columna o tres según lo que haya cargado la planilla: si la clase
     vino con "Para todos", el texto es uno solo y ocupa toda la pared. */
  const conNiveles = RUTINA_HOY.conNiveles;
  const columnas = conNiveles
    ? [0,1,2].map(n => ({titulo:'Nivel ' + (n+1), txt:(b.niveles||[])[n] || ''}))
    : [{titulo:'', txt: b.todos || ''}];

  return `
    <div class="pantalla pantalla-uno" style="--esc:${escalaPantalla}">
      <div class="pantalla-top">
        <div class="pantalla-titulo">
          <div class="pantalla-dia">${esc(tituloBloque(b, i))}</div>
          <div class="pantalla-sub">${esc(dia)}${RUTINA_HOY.disciplina ? ' · ' + esc(RUTINA_HOY.disciplina) : ''}${RUTINA_HOY.hora ? ' · ' + esc(RUTINA_HOY.hora) : ''}${b.duracion ? ' · ' + b.duracion + ' min' : ''}</div>
        </div>
        ${relojHtml()}
        <div class="pantalla-acciones">
          <button class="btn pantalla-btn" onclick="cambiarEscalaPantalla(-0.1)" aria-label="Achicar texto">A−</button>
          <button class="btn pantalla-btn" onclick="cambiarEscalaPantalla(0.1)" aria-label="Agrandar texto">A+</button>
          <button class="btn pantalla-btn" onclick="salirPantalla()">Salir</button>
        </div>
      </div>
      ${selectorClasesPantalla()}

      <div class="pantalla-niveles ${conNiveles ? '' : 'pantalla-una'}">
        ${columnas.map(col => `
          <div class="pantalla-nivel">

/* Achica el texto de los ejercicios hasta que el bloque entre completo.
   Hace falta porque el alto disponible cambia muchísimo según dónde se
   esté mostrando: un TV de 1080p, uno de 720p o un celular en
   horizontal espejando al TV (ahí sobran apenas 300px de alto). En vez
   de fijar tamaños a mano para cada caso, se mide y se ajusta. Los tres
   niveles terminan con el mismo tamaño —el que necesita el más largo—
   para que el cartel se vea parejo. */
function ajustarTextoPantalla(){
  const txts = [...document.querySelectorAll('.pantalla-uno .pantalla-nivel .txt')];
  if(!txts.length) return;
  txts.forEach(t => { t.style.fontSize = ''; });
  let size = parseFloat(getComputedStyle(txts[0]).fontSize);
  let guard = 0;
  /* El piso es bajo a propósito: al espejar un celular, su pantalla se
     estira al tamaño del TV, así que 10px en el celular se ven grandes
     en la pared. Lo que importa es que el bloque entre entero. */
  while(txts.some(t => t.scrollHeight > t.clientHeight + 1) && size > 9 && guard++ < 40){
    size -= 1;
    txts.forEach(t => { t.style.fontSize = size + 'px'; });
  }
}

/* ---------- Formatos de rutina: tipo + parámetros ----------
   Un formato no es un texto: es un TIPO (EMOM, AMRAP, vueltas…) con sus
   parámetros (minutos, vueltas, trabajo/pausa…). De ahí sale siempre el
   mismo encabezado para la pared y, cuando se puede, la duración. Lo
   usan Crear rutina (arma el formato desde los campos) y el import de la
   planilla (interpreta lo que escribieron y lo deja igual de prolijo). */
const FORMATOS_RUT = {
  libre:    {nombre:'Sin formato / libre', campos:[{k:'txt', l:'Título (opcional)', d:'', t:'text'}], hint:'Para entrada en calor, movilidad o técnica.'},
  series:   {nombre:'Series × reps', campos:[{k:'series', l:'Series', d:'4'}, {k:'desc', l:'Descanso (seg)', d:'60'}], hint:'Las reps van en cada ejercicio.'},
  vueltas:  {nombre:'Vueltas', campos:[{k:'vueltas', l:'Vueltas', d:'3'}, {k:'cap', l:'Tope (min, opcional)', d:''}], hint:'Se repite la lista completa, una vuelta tras otra.'},
  amrap:    {nombre:'AMRAP', campos:[{k:'min', l:'Minutos', d:'12'}], hint:'Todas las vueltas posibles en el tiempo.'},
  emom:     {nombre:'EMOM', campos:[{k:'min', l:'Minutos totales', d:'12'}, {k:'cada', l:'Cada (min)', d:'1'}], hint:'Si hay más de un ejercicio, se alternan por intervalo.'},
  tabata:   {nombre:'Intervalos / Tabata', campos:[{k:'w', l:'Trabajo (seg)', d:'20'}, {k:'r', l:'Pausa (seg)', d:'10'}, {k:'n', l:'Vueltas', d:'8'}], hint:'Duración = (trabajo + pausa) × vueltas.'},
  fortime:  {nombre:'For time', campos:[{k:'cap', l:'Tope (min)', d:'12'}], hint:'Se completa todo lo más rápido posible.'},
  escalera: {nombre:'Escalera / esquema', campos:[{k:'esq', l:'Esquema de reps', d:'21-15-9', t:'text'}], hint:'Los ejercicios no llevan cantidad propia: la da el esquema.'},
};
function paramsPorDefecto(tipo){
  const p = {};
  ((FORMATOS_RUT[tipo] || {}).campos || []).forEach(c => { p[c.k] = c.d; });
  return p;
}
function numFmt(v){
  const n = parseFloat(String(v == null ? '' : v).replace(',', '.'));
  return isNaN(n) || n <= 0 ? null : n;
}
/* El encabezado que se ve en la pared y en el detalle. */
function componerFormato(tipo, p){
  p = p || {};
  const n = k => numFmt(p[k]);
  switch(tipo){
    case 'series':  return n('series') ? n('series') + ' series' + (n('desc') ? ' · descanso ' + n('desc') + '"' : '') : '';
    case 'vueltas': return n('vueltas') ? n('vueltas') + ' vueltas' + (n('cap') ? " · tope " + n('cap') + "'" : '') : '';
    case 'amrap':   return 'AMRAP' + (n('min') ? ' ' + n('min') + "'" : '');
    case 'emom':    return 'EMOM' + (n('min') ? ' ' + n('min') + "'" : '') + (n('cada') > 1 ? " · cada " + n('cada') + "'" : '');
    case 'tabata':  return 'Tabata' + (n('w') && n('r') ? ' ' + n('w') + '"/' + n('r') + '"' : '') + (n('n') ? ' × ' + n('n') : '');
    case 'fortime': return 'For time' + (n('cap') ? " · tope " + n('cap') + "'" : '');
    case 'escalera':return String(p.esq || '').trim() || 'Escalera';
    default:        return String(p.txt || '').trim();
  }
}
/* Minutos que dura, cuando el formato lo dice solo. */
function duracionFormato(tipo, p){
  p = p || {};
  const n = k => numFmt(p[k]);
  let d = null;
  if(tipo === 'amrap' || tipo === 'emom') d = n('min');
  else if(tipo === 'tabata') d = n('w') && n('r') && n('n') ? (n('w') + n('r')) * n('n') / 60 : null;
  else if(tipo === 'vueltas' || tipo === 'fortime') d = n('cap');
  return d ? Math.max(1, Math.round(d)) : null;
}
/* Lee lo que escribió alguien ("EMOM 12", "tabata 20/10", "4 vueltas") y
   lo convierte a {tipo, p}. Si algo del texto no se entiende devuelve
   null: preferible dejar el texto tal cual que tirar información. */
function interpretarFormato(txt){
  const t0 = String(txt == null ? '' : txt).toLowerCase().replace(/[’´`‘]/g, "'").replace(/[”“]/g, '"').replace(/\s+/g, ' ').trim();
  if(!t0) return null;
  const MIN = "\\s*(?:'|min\\b\\.?|minutos?)?";
  const sacar = (rest, re, f) => { const m = rest.match(re); if(!m) return rest; f(m); return rest.replace(m[0], ' '); };
  const tope = (rest, p) => sacar(rest, new RegExp('(?:tope|time ?cap|cap)\\s*(\\d+)' + MIN), m => { p.cap = m[1]; });
  let m, rest, p = {}, tipo = null;
  if((m = t0.match(new RegExp('^e(\\d+)?mom\\s*(\\d+)' + MIN)))){
    tipo = 'emom'; p = {min: m[2], cada: m[1] || '1'}; rest = t0.slice(m[0].length);
    rest = sacar(rest, new RegExp('(?:cada|c/)\\s*(\\d+)' + MIN), mm => { p.cada = mm[1]; });
  }else if((m = t0.match(new RegExp('^amrap\\s*(\\d+)' + MIN)))){
    tipo = 'amrap'; p = {min: m[1]}; rest = t0.slice(m[0].length);
  }else if((m = t0.match(/^tabata\s*(\d+)\s*(?:"|seg\w*|s\b)?\s*[\/-]\s*(\d+)\s*(?:"|seg\w*|s\b)?/))
        || (m = t0.match(/^(\d+)\s*"\s*[\/-]\s*(\d+)\s*"?/))
        || (m = t0.match(/^(\d+)\s*[\/-]\s*(\d+)\s*"?(?=\s*[x×]\s*\d)/))){
    tipo = 'tabata'; p = {w: m[1], r: m[2], n: '8'}; rest = t0.slice(m[0].length);
    rest = sacar(rest, /\s*[x×]\s*(\d+)/, mm => { p.n = mm[1]; });
  }else if((m = t0.match(/^(\d+)\s*(?:vueltas?|rounds?|rondas?|rds?)\b/))){
    tipo = 'vueltas'; p = {vueltas: m[1], cap: ''}; rest = tope(t0.slice(m[0].length), p);
  }else if((m = t0.match(/^(\d+)\s*series\b/))){
    tipo = 'series'; p = {series: m[1], desc: ''}; rest = t0.slice(m[0].length);
    rest = sacar(rest, /(?:descanso|desc\.?|rest)\s*(\d+)\s*(?:"|seg\w*|s\b)?/, mm => { p.desc = mm[1]; });
  }else if((m = t0.match(/^for\s*time\b/))){
    tipo = 'fortime'; p = {cap: ''}; rest = tope(t0.slice(m[0].length), p);
    if(!p.cap) rest = sacar(rest, new RegExp('^\\s*(\\d+)' + MIN), mm => { p.cap = mm[1]; });
  }else if((m = t0.match(/^(\d+(?:\s*-\s*\d+){2,})\s*$/))){
    tipo = 'escalera'; p = {esq: m[1].replace(/\s+/g, '')}; rest = '';
  }else if(/^escalera\s*$/.test(t0)){
    tipo = 'escalera'; p = {esq: ''}; rest = '';
  }
  if(!tipo) return null;
  if(!/^[\s·,;:.\-–—()+]*$/.test(rest)) return null;
  return {tipo, p};
}
/* Formato normalizado de un texto. reconocido=false → se deja el texto
   original y se avisa; vacío cuenta como reconocido (no hay nada que leer). */
function normalizarFormato(txt){
  const orig = String(txt == null ? '' : txt).trim();
  if(!orig) return {texto: '', tipo: null, dur: null, reconocido: true};
  const r = interpretarFormato(orig);
  if(!r) return {texto: orig, tipo: null, dur: null, reconocido: false};
  return {texto: componerFormato(r.tipo, r.p), tipo: r.tipo, dur: duracionFormato(r.tipo, r.p), reconocido: true};
}
/* La cantidad de un ejercicio como se anota en la columna de reps. */
function textoCantidadEj(e, tipoBloque){
  if(tipoBloque === 'escalera') return '';
  if(e.u === 'max') return 'Máx';
  const q = String(e.q == null ? '' : e.q).trim();
  if(!q) return '';
  const base = e.u === 'seg' ? q + '"' : e.u === 'm' ? q + ' m' : e.u === 'cal' ? q + ' cal' : q;
  return e.lado ? base + ' c/lado' : base;
}
/* Notas por ejercicio: viajan en una celda, una por línea y en el mismo
   orden que los ejercicios; "-" es "sin nota" (igual que en las reps). */
function partirNotasEj(txt){
  return String(txt == null ? '' : txt).split('\n').map(x => { x = x.trim(); return esSinRep(x) ? '' : x; });
}

let cr = null;   // borrador de la rutina que se está creando

/* ---------- Pruebas de referencia ----------
   Una prueba fija es un bloque de medición guardado desde el creador de
   rutinas: nombre, qué se mide y el bloque tal como se armó. Al crear la
   rutina de una clase se tilda el bloque como prueba y se elige de esa
   lista. En la clase, el bloque queda marcado y cada alumno tiene su
   Resultado (o el cronómetro, si se mide por tiempo). */
const MEDIDAS = {rondas:'Rondas completas', min:'Minutos completos', tiempo:'Tiempo (cronómetro)', rm:'RM (kilos)'};
function medidaSugerida(tipo){ return tipo === 'emom' ? 'min' : (tipo === 'fortime' ? 'tiempo' : 'rondas'); }
function topeSugerido(b){
  if(b.tipo === 'tabata') return Number(b.p.n) || null;
  if(b.tipo === 'emom' || b.tipo === 'amrap') return Number(b.p.min) || null;
  return null;
}
function mmssP(s){ s = Math.round(s); return Math.floor(s / 60) + "'" + String(s % 60).padStart(2, '0') + '"'; }
function valTxtP(medida, v){
  return medida === 'tiempo' ? mmssP(v) : medida === 'rondas' ? v + (v === 1 ? ' ronda' : ' rondas') : medida === 'min' ? v + ' min' : numKg(v) + ' kg';
}
function mejoraP(medida, antes, ahora){ return medida === 'tiempo' ? antes - ahora : ahora - antes; }
function difTxtP(medida, antes, ahora){
  if(medida === 'tiempo') return (ahora <= antes ? '−' : '+') + mmssP(Math.abs(antes - ahora));
  const m = ahora - antes, a = Math.abs(m);
  return (m > 0 ? '+' : m < 0 ? '−' : '') + (medida === 'rondas' ? a + (a === 1 ? ' ronda' : ' rondas') : medida === 'min' ? a + ' min' : numKg(a) + ' kg');
}
function ordenReg(a, b){ return (a.ts || 0) - (b.ts || 0); }
function regsPrueba(alumnoId, pruebaId, ej, adaptada){
  return pruebasReg.filter(r => r.alumnoId === alumnoId && r.pruebaId === pruebaId && (r.ej || '') === (ej || '') && !!r.adaptada === !!adaptada).sort(ordenReg);
}
function filaDeNivel(b, nivel){
  if(!b || !b.filas) return null;
  return b.filas[nivel] || b.filas[0] || refFilaBloque(b);
}
function pruebaDeFila(f){ return f && f.prueba && f.prueba.id ? f.prueba : null; }
function pruebaAlumnoBloque(b, a){ return pruebaDeFila(filaDeNivel(b, a.nivel || 2)); }
function pruebaRefBloque(b){
  return pruebaDeFila(refFilaBloque(b)) || Object.keys((b && b.filas) || {}).map(k => pruebaDeFila(b.filas[k])).find(Boolean) || null;
}
/* Lo último que se midió de esa prueba, para mostrar en la fila. */
function pruebaLineaHtml(c, a, b){
  const pr = pruebaAlumnoBloque(b, a);
  if(!pr) return '';
  const f = filaDeNivel(b, a.nivel || 2);
  const ejs = pr.medida === 'rm' ? (f.ejs || []).map(nombreEj) : [''];
  const partes = [];
  ejs.forEach(e => {
    const l = pruebasReg.filter(r => r.alumnoId === a.id && r.pruebaId === pr.id && (r.ej || '') === e).sort(ordenReg);
    if(!l.length) return;
    const ult = l[l.length - 1];
    const hoy = ult.dia === claveActiva();
    const prev = hoy ? l[l.length - 2] : null;
    const txt = hoy ? `hoy <b>${valTxtP(pr.medida, ult.valor)}</b>${prev ? ' · antes ' + valTxtP(pr.medida, prev.valor) : ''}` : `anterior ${valTxtP(pr.medida, ult.valor)}`;
    partes.push((e ? esc(e) + ' ' : '') + txt);
  });
  return partes.length ? `<span class="cond-line prueba-line"><span class="pr-badge">${pr.medida === 'rm' ? (pr.reps || '') + 'RM' : 'Prueba'}</span>${partes.join(' · ')}</span>` : '';
}
function abrirResultado(alumnoId, claseId){

  state.cargaModal = {modo:'prueba', alumnoId, claseId, bloqueIdx: rut ? bloqueIdxClase(c, rut) : 0, valor: null, adaptada: null, ini: false};

function datosResultado(m){

function renderResultadoModal(m){

      (f.ejs || []).forEach(e => { const l = pruebasReg.filter(r => r.alumnoId === a.id && r.pruebaId === pr.id && r.ej === nombreEj(e)).sort(ordenReg); m.vals[nombreEj(e)] = l.length ? l[l.length - 1].valor : ''; });
    }else{
      const l = regsPrueba(a.id, pr.id, '', !!(hoy[0] && hoy[0].adaptada));
      const ult = hoy[0] ? hoy[0].valor : (l.length ? l[l.length - 1].valor : (pr.tope || (pr.medida === 'tiempo' ? 600 : 5)));
      m.valor = ult;
      m.adaptada = hoy[0] ? !!hoy[0].adaptada : false;
    }
  }
  const prev = pr.medida === 'rm' ? null : (() => { const l = pruebasReg.filter(r => r.alumnoId === a.id && r.pruebaId === pr.id && r.dia !== claveActiva() && !!r.adaptada === !!m.adaptada).sort(ordenReg); return l.length ? l[l.length - 1] : null; })();
  let cuerpo = '';
  if(pr.medida === 'rm'){
    cuerpo = `<div class="carga-list">${Object.keys(m.vals).map((e, i) => `<div class="carga-row">
      <div class="carga-label">${esc(e)}<span class="carga-bloque">${pr.reps || ''}RM</span></div>
      <div class="carga-input-wrap"><input type="number" min="0" step="0.5" inputmode="decimal" id="rm-input-${i}" value="${m.vals[e] === '' ? '' : m.vals[e]}" placeholder="—"><span class="carga-unit">kg</span></div></div>`).join('')}</div>
      <p class="prog-nota">Viene el último RM. Dejá vacío el que no se midió hoy.</p>`;
  }else if(pr.medida === 'tiempo'){
    const mm = Math.floor((m.valor || 0) / 60), ss = Math.round((m.valor || 0) % 60);
    cuerpo = `<div class="pr-sel"><div class="carga-input-wrap"><input type="number" min="0" inputmode="numeric" id="pr-mm" value="${mm}"><span class="carga-unit">min</span></div>
      <div class="carga-input-wrap"><input type="number" min="0" max="59" inputmode="numeric" id="pr-ss" value="${ss}"><span class="carga-unit">seg</span></div></div>
      <p class="prog-nota" style="text-align:center;">Para tomar el tiempo de varios a la vez usá el cronómetro del bloque.</p>`;
  }else{
    cuerpo = `<div class="pr-sel"><button type="button" onclick="resultadoPaso(-1)" aria-label="Menos">−</button>
      <div class="num"><b>${m.valor}</b><span>${pr.tope ? 'de ' + pr.tope + ' ' : ''}${pr.medida === 'min' ? 'minutos' : 'rondas'}</span></div>
      <button type="button" onclick="resultadoPaso(1)" aria-label="Más">+</button></div>`;
  }
  return `<div class="modal-overlay" onclick="if(event.target===this) cerrarCarga()"><div class="modal-sheet">
    <h2>Resultado · ${esc(pr.nombre)}</h2>
    <div class="modal-sub">${esc(nombreCompleto(a))} · ${esc(c.hora)} ${esc(c.disciplina)} · ${esc(MEDIDAS[pr.medida].toLowerCase())}</div>
    ${cuerpo}
    ${pr.medida !== 'rm' ? `<div style="text-align:center;" class="prog-nota">${prev ? 'Anterior: ' + valTxtP(pr.medida, prev.valor) + (m.adaptada ? ' (adaptada)' : '') : 'Primera vez que hace esta prueba'}</div>
    <label class="check-linea" style="display:flex; gap:8px; align-items:center; justify-content:center; margin:10px 0;"><input type="checkbox" ${m.adaptada ? 'checked' : ''} onchange="state.cargaModal.adaptada=this.checked; render()"> La hace adaptada</label>` : ''}
    <div class="modal-actions"><button class="btn btn-ghost" onclick="cerrarCarga()">Cancelar</button><button class="btn btn-primary" onclick="guardarResultado()">Guardar</button></div>
  </div></div>`;
}
function resultadoPaso(d){
  const m = state.cargaModal, {pr} = datosResultado(m);
  const max = pr && pr.tope ? pr.tope : 999;
  m.valor = Math.max(0, Math.min(max, (m.valor || 0) + d)); render();
}
function upsertReg(r){
  const i = pruebasReg.findIndex(x => x.alumnoId === r.alumnoId && x.pruebaId === r.pruebaId && (x.ej || '') === (r.ej || '') && x.dia === r.dia);
  if(i === -1) pruebasReg.push(r); else pruebasReg[i] = Object.assign({}, pruebasReg[i], r, {id: pruebasReg[i].id});
}
function guardarResultado(){
  const m = state.cargaModal; if(!m) return;
  const {c, b, a, pr} = datosResultado(m);
  if(!pr) return;
  const base = {alumnoId: a.id, pruebaId: pr.id, nombre: pr.nombre, medida: pr.medida, dia: claveActiva(), claseId: c ? c.id : '', profesor: profesorActivo};
  let n = 0;
  if(pr.medida === 'rm'){
    Object.keys(m.vals).forEach((e, i) => {
      const el = document.getElementById('rm-input-' + i), v = el ? parseFloat(el.value) : NaN;
      if(!(v > 0)) return;
      const ts = Date.now() + i;
      upsertReg(Object.assign({}, base, {id: 'p' + ts + a.id, ts, ej: e, reps: pr.reps || null, valor: v, adaptada: false})); n++;
    });
  }else{
    let v = m.valor;
    if(pr.medida === 'tiempo'){
      const mm = parseInt((document.getElementById('pr-mm') || {}).value, 10) || 0, ss = parseInt((document.getElementById('pr-ss') || {}).value, 10) || 0;
      v = mm * 60 + ss;
    }
    if(v > 0 || pr.medida !== 'tiempo'){ const ts = Date.now(); upsertReg(Object.assign({}, base, {id: 'p' + ts + a.id, ts, valor: v, adaptada: !!m.adaptada})); n++; }
  }
  persistPruebasReg();
  cerrarCarga();
  showToast(n ? 'Resultado guardado en la ficha' : 'Sin cambios');
}

/* ----- Cronómetro (pruebas por tiempo) ----- */
function abrirCrono(claseId){
  const c = getClase(claseId), rut = c ? rutinaDeClase(c) : null;
  if(!c || !rut) return;
  const bi = bloqueIdxClase(c, rut), b = rut.bloques[bi], pr = pruebaRefBloque(b);
  if(!pr || pr.medida !== 'tiempo') return;
  const igual = cronoEstado && cronoEstado.claseId === claseId && cronoEstado.dia === claveActiva() && cronoEstado.pruebaId === pr.id && !cronoEstado.fin;
  if(!igual){ cronoEstado = {claseId, dia: claveActiva(), bloqueIdx: bi, pruebaId: pr.id, nombre: pr.nombre, inicio: null, fin: null, marcas: [], adaptados: {}, sel: null}; persistCrono(); }
  nav('crono', {claseId});
}
function tiempoCrono(){ const k = cronoEstado; if(!k || !k.inicio) return 0; return ((k.fin || Date.now()) - k.inicio) / 1000; }
function tTxtCrono(s){ const m = Math.floor(s / 60), r = s - m * 60; return m + ':' + (r < 10 ? '0' : '') + r.toFixed(1); }
let wakeCrono = null;
function iniciarCrono(){
  cronoEstado.inicio = Date.now(); persistCrono();
  try{ if(navigator.wakeLock) navigator.wakeLock.request('screen').then(w => { wakeCrono = w; }).catch(() => {}); }catch(e){}
  render();
}
function cronoAdaptado(id){ cronoEstado.adaptados[id] = !cronoEstado.adaptados[id]; persistCrono(); render(); }
function cronoTocar(id){
  const k = cronoEstado; if(!k.inicio || k.fin) return;
  if(k.marcas.some(m => m.alumnoId === id)) return;
  if(k.sel){ const m = k.marcas.find(x => x.id === k.sel); if(m) m.alumnoId = id; k.sel = null; }
  else k.marcas.push({id: 'm' + Date.now() + id, t: tiempoCrono(), alumnoId: id});
  persistCrono(); render();
}
function cronoSinNombre(){ const k = cronoEstado; if(!k.inicio || k.fin) return; k.marcas.push({id: 'm' + Date.now(), t: tiempoCrono(), alumnoId: null}); persistCrono(); render(); }
function cronoElegirMarca(id){ cronoEstado.sel = cronoEstado.sel === id ? null : id; persistCrono(); render(); }
function cronoQuitar(id){ cronoEstado.marcas = cronoEstado.marcas.filter(m => m.alumnoId !== id); persistCrono(); render(); }
function cronoTerminar(){
  const k = cronoEstado; if(!k) return;
  const asign = k.marcas.filter(m => m.alumnoId);
  asign.forEach((m, i) => {
    const ts = Date.now() + i;
    upsertReg({id: 'p' + ts + m.alumnoId, ts, alumnoId: m.alumnoId, pruebaId: k.pruebaId, nombre: k.nombre, medida: 'tiempo', dia: k.dia, claseId: k.claseId, profesor: profesorActivo, valor: Math.round(m.t), adaptada: !!k.adaptados[m.alumnoId]});
  });
  persistPruebasReg();
  cronoEstado = null; persistCrono();
  try{ if(wakeCrono) wakeCrono.release(); }catch(e){}
  showToast(asign.length + ' tiempo' + (asign.length === 1 ? '' : 's') + ' guardado' + (asign.length === 1 ? '' : 's') + ' en la ficha');
  goBack();
}
function cronoDescartar(){
  if(!state.cronoConfirma){ state.cronoConfirma = true; render(); setTimeout(() => { state.cronoConfirma = false; if(state.screen === 'crono') render(); }, 4000); return; }
  state.cronoConfirma = false; cronoEstado = null; persistCrono(); goBack();
}
function screenCrono(claseId){
  const c = getClase(claseId), k = cronoEstado;
  if(!c || !k) return `${header('Cronómetro', null, true)}<p class="empty-hist">No hay ninguna prueba abierta.</p>`;
  const alumnos = presentesDe(c).map(alumnoDeClase);
  const sinNombre = k.marcas.filter(m => !m.alumnoId);
  const corriendo = k.inicio && !k.fin;
  return `
    ${header(k.nombre, 'Prueba por tiempo · ' + c.hora + ' ' + c.disciplina, true)}
    <div class="card">
      <div class="crono-t" id="crono-t">${tTxtCrono(tiempoCrono())}</div>
      <div class="crono-est">${!k.inicio ? 'Marcá antes quién la hace adaptada y tocá Iniciar.' : k.sel ? 'Elegí a quién corresponde la marca seleccionada.' : 'Tocá el nombre de cada alumno cuando termina.'}</div>
      ${!k.inicio ? `<button type="button" class="btn btn-primary btn-block" style="font-size:18px; padding:16px;" onclick="iniciarCrono()">Iniciar</button>`
        : `<button type="button" class="btn btn-ghost btn-block" onclick="cronoSinNombre()">Marcar sin nombre</button>`}
      ${sinNombre.length ? `<div class="crono-pend">${sinNombre.map((m, i) => `<button type="button" class="nchip ${k.sel === m.id ? 'on' : ''}" onclick="cronoElegirMarca('${m.id}')">Marca ${i + 1} · ${mmssP(m.t)}</button>`).join('')}</div>` : ''}
    </div>
    <div class="crono-grilla">
      ${alumnos.map(a => {
        const m = k.marcas.find(x => x.alumnoId === a.id), ad = !!k.adaptados[a.id];
        if(!k.inicio) return `<button type="button" class="crono-nom ${ad ? 'llego' : ''}" onclick="cronoAdaptado(${a.id})"><b>${esc(nombreCompleto(a))}</b><span>${ad ? '✓ La hace adaptada' : 'Tocar si la hace adaptada'}</span></button>`;
        if(m) return `<div class="crono-nom llego"><b>${esc(nombreCompleto(a))}</b><span class="tt">${mmssP(m.t)}${ad ? ' · adaptada' : ''}</span><button type="button" class="x" onclick="cronoQuitar(${a.id})" aria-label="Quitar el tiempo">×</button></div>`;
        return `<button type="button" class="crono-nom" onclick="cronoTocar(${a.id})" ${corriendo ? '' : 'disabled'}><b>${esc(nombreCompleto(a))}</b><span>${ad ? 'adaptada · ' : ''}en carrera</span></button>`;
      }).join('')}
    </div>
    <div style="display:flex; gap:8px; margin-top:14px;">
      <button type="button" class="btn btn-ghost" onclick="cronoDescartar()">${state.cronoConfirma ? 'Tocá otra vez para descartar' : 'Descartar'}</button>
      <button type="button" class="btn btn-primary" style="flex:1;" onclick="cronoTerminar()" ${k.marcas.some(m => m.alumnoId) ? '' : 'disabled'}>Terminar y guardar tiempos</button>
    </div>
    <p class="prog-nota">El tiempo se calcula con la hora de inicio: si la tablet se apaga o cambiás de pantalla, al volver sigue bien.</p>`;
}
setInterval(() => { const el = document.getElementById('crono-t'); if(el && cronoEstado && cronoEstado.inicio && !cronoEstado.fin) el.textContent = tTxtCrono(tiempoCrono()); }, 100);

/* ----- Creador de rutinas: marcar el bloque como prueba y guardar pruebas fijas ----- */
function crSnapshotBloque(b){
  return {bloque: b.bloque, nivel: b.nivel, tipo: b.tipo, p: Object.assign({}, b.p), tiempo: b.tiempo, notas: b.notas || '',
          ejs: b.ejs.filter(e => String(e.t).trim()).map(e => Object.assign({}, e))};
}
function crTogglePrueba(i, on){
  const b = cr.bloques[i];
  b.esPrueba = !!on; if(!on){ b.pruebaId = ''; b.pruebaMeta = null; }
  render();
}
function crElegirPrueba(i, id){
  const b = cr.bloques[i], pr = pruebasFijas.find(x => x.id === id);
  if(!pr){ return; }
  const sn = pr.bloque;
  b.bloque = sn.bloque; b.nivel = sn.nivel; b.tipo = sn.tipo; b.p = Object.assign({}, sn.p); b.tiempo = sn.tiempo; b.notas = sn.notas || '';
  b.ejs = sn.ejs.map(e => Object.assign({}, e));
  b.esPrueba = true; b.pruebaId = pr.id; b.pruebaMeta = {id: pr.id, nombre: pr.nombre, medida: pr.medida, tope: pr.tope || null, reps: pr.reps || null};
  render();
}
function crPedirGuardarPrueba(i){
  const b = cr.bloques[i];
  if(!b.ejs.some(e => String(e.t).trim())){ aviso('Agregale al menos un ejercicio al bloque'); return; }
  cr.guardarPrueba = {i, nombre: (b.bloque || '').trim(), medida: medidaSugerida(b.tipo), reps: 5};
  render();
}
function crGuardarPrueba(){
  const g = cr.guardarPrueba; if(!g) return;
  const b = cr.bloques[g.i];
  const nombre = (document.getElementById('gp-nombre') || {}).value.trim();
  if(!nombre){ aviso('Ponele un nombre a la prueba'); return; }
  if(pruebasFijas.some(x => normEj(x.nombre) === normEj(nombre))){ aviso('Ya hay una prueba con ese nombre'); return; }
  const medida = g.medida;
  const reps = medida === 'rm' ? (parseInt((document.getElementById('gp-reps') || {}).value, 10) || 5) : null;
  const pr = {id: 'pf' + Date.now(), nombre, medida, tope: medida === 'tiempo' || medida === 'rm' ? null : topeSugerido(b), reps, bloque: crSnapshotBloque(b)};
  pruebasFijas.push(pr); persistPruebasFijas();
  b.esPrueba = true; b.pruebaId = pr.id; b.pruebaMeta = {id: pr.id, nombre: pr.nombre, medida: pr.medida, tope: pr.tope, reps: pr.reps};
  cr.guardarPrueba = null;
  showToast('Prueba guardada: ya está en la lista');

}

}

function filasDeRutinaCreada(disc, horaTxt){
  const filas = [];
  cr.bloques.forEach(b => {
    const ejs = b.ejs.filter(e => String(e.t).trim());
    const formato = componerFormato(b.tipo, b.p);
    if(!ejs.length && !formato) return;
    const cants = ejs.map(e => textoCantidadEj(e, b.tipo));
    const conReps = cants.some(Boolean);
    const conNotas = ejs.some(e => String(e.nota || '').trim());
    const dur = crDuracionBloque(b);
    filas.push([disc, horaTxt, String(b.bloque).trim(), b.nivel ? String(b.nivel) : '', formato,
      dur ? String(dur) : '', conReps ? cants.map(c => c || '-').join('\n') : '',
      ejs.map(e => String(e.t).trim()).join('\n'), String(b.notas || '').trim(),
      conNotas ? ejs.map(e => String(e.nota || '').trim() || '-').join('\n') : '']);
  });
  return filas;
}
function guardarRutinaCreada(){
  const est = document.getElementById('cr-estado');
  const decir = m => { if(est){ est.textContent = m; est.className = 'respaldo-estado aviso'; } };
  const disc = (cr.otraDisc.trim() || cr.disc).trim();
  const f = fechaDesdeClave(cr.fecha);
  if(!f){ decir('Elegí la fecha.'); return; }
  if(!disc){ decir('Elegí la disciplina.'); return; }
  const horas = cr.horas.slice();
  String(cr.otraHora || '').split(/\s*[;,]\s*/).map(aHoraImport).filter(Boolean).forEach(h => { if(horas.indexOf(h) === -1) horas.push(h); });
  const filas = filasDeRutinaCreada(disc, horas.sort().join('; '));
  if(!filas.length){ decir('Cargá al menos un bloque con ejercicios o formato.'); return; }
  /* Lo que se escribió a mano y no está en el banco entra al banco: lo
     eligió el profe a propósito, no es un nombre a revisar. */
  cr.bloques.forEach(b => b.ejs.forEach(e => {
    const t = String(e.t).trim();
    if(t && !buscarEnBanco(t)){ banco.push({id: idDesdeNombre(t), nombre: t, alias: [], notas: '', nuevo: true}); construirIndiceBanco(); }
  }));
  persistBanco();
  const lunes = lunesDe(f), domingo = sumarDias(lunes, 6);
  const HEAD = ['Disciplina','Hora','Bloque','Nivel','Formato','Tiempo','Reps/Series','Ejercicios','Notas','Notas ej.'];
  const hoja = {tipo: 'rutinas', nombre: 'Creada en la app', archivo: '__app__', diaHoja: DIAS_SEMANA[f.getDay()],
                headersNorm: HEAD.map(normHeader), dataRows: filas, previas: [['Semana del:', lunes, domingo]]};
  const antes = esperaRutinas.length;
  aplicarHoja(hoja);
  const e = esperaRutinas.length > antes ? esperaRutinas.pop() : null;
  if(!e || !e.clases.length){ decir('No se pudo armar la rutina: revisá los bloques.'); return; }
  e.clases.forEach(nc => { nc.origen = 'app'; nc.creadaPor = profesorActivo; nc.creadaEn = Date.now(); nc.archivo = 'Creada en la app'; });
  /* Los bloques tildados como prueba llevan la prueba en la fila de su nivel. */
  const clavesEj = ejsLista => ejsLista.map(x => normEj(x)).join('¦');
  e.clases.forEach(nc => (nc.bloques || []).forEach(bl => Object.keys(bl.filas || {}).forEach(k => {
    const fil = bl.filas[k];
    const orig = cr.bloques.find(b => b.pruebaMeta && (b.nivel || 0) === Number(k) && clavesEj(b.ejs.filter(x => String(x.t).trim()).map(x => String(x.t).trim())) === clavesEj(fil.ejs || []));
    if(orig) fil.prueba = Object.assign({}, orig.pruebaMeta);
  })));
  const cuenta = guardarClasesEnSemana(e.clases, lunes, domingo, false, false);
  rutinasVirtuales = {};
  recalcularRutinasDelDia(); recalcularRutinaHoy();
  showToast(cuenta.iguales ? 'Era igual a la que ya estaba: no se guardó de nuevo' : 'Rutina guardada en la semana del ' + etiquetaSemana(planificaciones[cuenta.claveSem]));
  cr = null;
  goBack();
}

  /* Si hay cargas o medidos guardados con ese nombre, sacarlo los dejaría
     sin ejercicio: el historial se partiría. */
  const enUso = cargas.some(c => normEj(c.ejercicio) === normEj(a))
    || Object.keys(medicionOverrides).some(x => (medicionOverrides[x] || []).some(m => normEj(m) === normEj(a)));
  if(enUso){ aviso('Hay cargas guardadas como «' + a + '»: si lo sacás, se separan de este ejercicio.'); return; }
  e.alias.splice(k, 1);
  despuesDeEditarBanco();
}
function guardarNotasEj(i, v){
  const e = banco[i];
  if(!e) return;
  e.notas = String(v || '').trim();
  persistBanco();
}
function unirEjercicios(origenId, destinoId){
  const o = ejercicioPorId(origenId), d = ejercicioPorId(destinoId);
  if(!o || !d || o === d) return;
  [o.nombre].concat(o.alias || []).forEach(n => {
    if(normEj(n) !== normEj(d.nombre) && !(d.alias || []).some(a => normEj(a) === normEj(n))) d.alias = (d.alias || []).concat([n]);
  });
  if(!d.notas && o.notas) d.notas = o.notas;
  if(!(d.zonas || []).length && (o.zonas || []).length) d.zonas = o.zonas.slice();
  banco = banco.filter(e => e !== o);
  cargas.forEach(c => { if(c.ejId === o.id) c.ejId = d.id; });
  persistCargas();
  state.bancoUnir = null;
  state.bancoAbierto = d.id;
  despuesDeEditarBanco();
  aviso('Unidos: todo quedó en «' + d.nombre + '».');
}
function borrarEj(i){
  const e = banco[i];
  if(!e) return;
  const u = usosEj(e.id);
  if(u.cargas + u.medidos) return;
  [e.nombre].concat(e.alias || []).forEach(n => { const k = normEj(n); if(k && bancoBorrados.indexOf(k) === -1) bancoBorrados.push(k); });
  persistBancoBorrados();
  banco = banco.filter(x => x !== e);
  state.bancoBorrar = null; state.bancoAbierto = null;
  despuesDeEditarBanco();
  aviso('Borrado. Si aparece en una rutina, va a quedar entre los sin reconocer.');
}
/* Copia el banco con las mismas columnas de la hoja "Ejercicios", para
   pegarlo en la plantilla y que el Excel no quede desactualizado. */
/* ---------- Listas de los desplegables ----------
   Una base fija más todo lo que ya apareció en las rutinas guardadas
   (importadas o creadas en la app). Alimentan los desplegables de la
   plantilla (hoja "Listas") y los de "Crear rutina". */
const BASE_BLOQUES = ['Movilidad','Activación','Entrada en calor','Fuerza','Fuerza y resistencia','Hipertrofia','Hipertrofia Upper','Hipertrofia Lower','Olímpico','Cardio','Wod','Wod pesado','Abs','Core','Vuelta a la calma','Stretching'];
const BASE_FORMATOS = ['3 vueltas','4 vueltas','5 vueltas','3 series','4 series','5 series','EMOM 10','EMOM 12','EMOM 16','AMRAP 10','AMRAP 12','AMRAP 15','Tabata 20/10','Tabata 30/10','Tabata 40/10','For time','21-15-9','Escalera'];
const BASE_TIEMPOS = ['5','8','10','12','15','16','18','20','25','30'];
const BASE_REPS = ['6','8','10','12','15','20','25','30','8/8','10/10','12/12','4x8','4x10','4x12','3x15','30"','40"','45"','1\'','200 m','400 m','-'];
function unicosOrden(base, extra, orden){
  const out = [];
  base.concat(extra).forEach(x => { const t = String(x == null ? '' : x).trim(); if(t && !out.some(y => y.toLowerCase() === t.toLowerCase())) out.push(t); });
  return orden ? out.sort(orden) : out;
}
function listasRutinas(){
  const bloques = [], formatos = [], tiempos = [], reps = [];
  Object.keys(planificaciones).forEach(k => ((planificaciones[k] || {}).clases || []).forEach(c => (c.bloques || []).forEach(b => {
    if(b.bloque) bloques.push(b.bloque);
    if(b.formato) formatos.push(b.formato);
    if(b.duracion) tiempos.push(String(b.duracion));
    Object.keys(b.filas || {}).forEach(n => ((b.filas[n] || {}).reps || []).forEach(r => reps.push(r)));
  })));
  const horas = [];
  Object.keys(reservasImportadas).forEach(f => (reservasImportadas[f] || []).forEach(r => { if(r.hora) horas.push(r.hora); }));
  Object.keys(clasesManuales).forEach(f => (clasesManuales[f] || []).forEach(m => horas.push(m.hora)));
  return {
    disciplinas: unicosOrden([], disciplinasCrossfy, (a, b) => a.localeCompare(b)),
    horas: unicosOrden([], horas, (a, b) => a.localeCompare(b)),
    bloques: unicosOrden(BASE_BLOQUES, bloques),
    niveles: ['1', '2', '3'],
    formatos: unicosOrden(BASE_FORMATOS, formatos),
    tiempos: unicosOrden(BASE_TIEMPOS, tiempos, (a, b) => (parseInt(a, 10) || 0) - (parseInt(b, 10) || 0)),
    reps: unicosOrden(BASE_REPS, reps),
  };
}
async function copiarListasPlanilla(){
  const L = listasRutinas();
  const cols = [L.disciplinas, L.horas, L.bloques, L.niveles, L.formatos, L.tiempos];
  const n = Math.max.apply(null, cols.map(c => c.length));
  const filas = ['Disciplina\tHora\tBloque\tNivel\tFormato\tTiempo'];
  for(let i = 0; i < n; i++) filas.push(cols.map(c => c[i] || '').join('\t'));
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(filas.join('\n'));
      aviso('Copiado: pegalo en la hoja "Listas" de la plantilla, en la celda A5.');
      return;

}

/* ---------- Screen: REGISTRO DE PRUEBAS Y MÉTRICAS ----------
   Arma, mes por mes, las filas de la planilla "Akasha registro de
   alumnos" (la del embudo de pruebas) y los números del resumen, a
   partir de lo que ya entra a la app: turnos y usuarios de Crossfy, la
   exportación de paquetes y lo que se marca en clase. Lo único que no
   está en ningún lado (canal y notas) se completa acá, fila por fila. */
const CANALES = ['Instagram', 'WhatsApp', 'Facebook', 'Google', 'Referido', 'Visita'];
const COLS_REGISTRO = ['Fecha de agenda','Nombre y apellido','WhatsApp','Canal de origen','Actividad','Fecha clase','Horario','Asistencia','Notas','Estado','Fecha de inscripción','Plan contratado','Ticket pagado'];

function diasEntre(a, b){
  const fa = fechaDesdeClave(a), fb = fechaDesdeClave(b);
  if(!fa || !fb) return null;
  return Math.round((Date.UTC(fb.getFullYear(), fb.getMonth(), fb.getDate()) - Date.UTC(fa.getFullYear(), fa.getMonth(), fa.getDate())) / 86400000);
}
function fechaPlanilla(k){
  const f = k ? fechaDesdeClave(k) : null;
  return f ? dosDig(f.getDate()) + '/' + dosDig(f.getMonth()+1) + '/' + f.getFullYear() : '';
}
/* Los nombres de Crossfy pasados a los de la lista desplegable de la
   planilla de Iván, para que al pegar no salten como inválidos. */
function actividadRegistro(d){
  const n = normDisc(d).replace(/\s+/g, '');
  if(/crosstra|crossfit/.test(n)) return 'CrossFit';
  if(n === 'gapfem') return 'GAP FEM';
  if(n === 'gap') return 'gap';
  if(/funcional/.test(n)) return 'Funcional';
  if(/stretch/.test(n)) return 'stretching';
  if(/personaliz/.test(n)) return 'personalizado';
  if(/metodo|método/.test(n)) return 'Metodo Akasha';
  if(/powerstep/.test(n)) return 'Power Step';
  return d || '';
}
/* Todas las reservas que conoce la app: las de Crossfy y las agregadas
   a mano en clase. */
function todasLasReservas(){
  const out = [];
  Object.keys(reservasImportadas).forEach(f => (reservasImportadas[f] || []).forEach(r =>
    out.push({fecha: f, hora: r.hora || '', disc: r.disciplina, id: r.alumnoId,
              estado: String(r.estado || '').toUpperCase(), reserva: r.reserva || '', cx: true, prueba: !!r.prueba})));
  Object.keys(ajustesClase).forEach(k => {
    const aj = ajustesClase[k], p = k.split('|');
    (aj.agregados || []).forEach(id => {
      const hora = aj.hora != null ? aj.hora : (p[1] || '');
      if(out.some(x => x.cx && x.fecha === p[0] && x.id === id && x.hora === hora && normDisc(x.disc) === p[2])) return;
      out.push({fecha: p[0], hora, disc: aj.disc || p[2], id, estado: '', reserva: (aj.agregadosEn || {})[id] || p[0], cx: false});
    });
  });
  return out;
}
function ajusteDeReserva(x){ return ajustesClase[x.fecha + '|' + (x.hora || '') + '|' + normDisc(x.disc)] || null; }
/* Una prueba es la reserva que Crossfy marca "(prueba)". Si no hay
   marca (reservas viejas), es la PRIMERA reserva conocida de alguien que recién se dio
   de alta: sin usuario en Crossfy (Prueba), con la nota "Clase de
   prueba", o registrado en Crossfy hasta 30 días antes. Si compró un
   paquete antes de esa clase, no fue prueba: compró directo. */
function clasesDePrueba(){
  const porId = {}, marcada = {};
  const antes = (x, y) => !y || x.fecha < y.fecha || (x.fecha === y.fecha && x.hora < y.hora);
  todasLasReservas().forEach(x => {
    if(antes(x, porId[x.id])) porId[x.id] = x;
    if(x.prueba && antes(x, marcada[x.id])) marcada[x.id] = x;
  });
  /* La marca "(prueba)" de Crossfy es la señal más segura: si la
     reserva la tiene, esa es la clase de prueba. */
  const conMarca = Object.keys(marcada).map(k => marcada[k]);
  return conMarca.concat(Object.keys(porId).filter(k => !marcada[k]).map(k => porId[k]).filter(x => {
    if(x.id < 0) return true;
    const inf = crossfyInfo[x.id];
    if(!inf) return false;
    const d = inf.reg ? diasEntre(inf.reg, x.fecha) : null;
    const reciente = d !== null && d >= -3 && d <= 30;
    if(!reciente && !(inf.prueba && d !== null && d >= -3 && d <= 60)) return false;
    return !compras.some(c => c.id === x.id && (c.clases || 0) > 1 && c.fecha && c.fecha < x.fecha);
  }));
}
function compraDespuesDe(id, fecha){
  return compras.filter(c => c.id === id && (c.clases || 0) > 1 && c.fecha && diasEntre(fecha, c.fecha) >= -1)
    .sort((a, b) => a.fecha.localeCompare(b.fecha))[0] || null;
}
function filaDePrueba(x){
  const a = getAlumno(x.id);
  const aj = ajusteDeReserva(x);
  const aus = !!(aj && (aj.ausentes || []).indexOf(x.id) !== -1);
  const pres = !!(aj && (aj.presentes || []).indexOf(x.id) !== -1);
  const quit = !!(aj && (aj.quitados || []).indexOf(x.id) !== -1);
  /* Sacado de la lista sin haber faltado = fue un error de carga, no una
     prueba. */
  if(quit && !aus && !(x.estado === 'AUSENTE' && !pres)) return null;
  let asis;
  if(pres) asis = 'Asistió';
  else if(aus) asis = 'Ausente';
  else if(x.estado === 'PRESENTE') asis = 'Asistió';
  else if(x.estado === 'AUSENTE') asis = 'Ausente';
  else if(!x.cx) asis = x.fecha <= HOY_CLAVE ? 'Asistió' : 'Pendiente';
  else asis = 'Pendiente';
  const compra = compraDespuesDe(x.id, x.fecha);
  const inf = crossfyInfo[x.id] || {};
  let estado, insc = '', plan = '', ticket = '', sinDetalle = false;
  if(compra){
    estado = 'Cerrado'; insc = compra.fecha; plan = compra.clases + ' clases'; ticket = compra.importe || '';
  }else if(inf.paq === 'ACTIVO' && (inf.clases || 0) > 1){
    /* Sin exportación de paquetes: se sabe que compró por el último
       paquete del usuario, pero no cuándo ni cuánto pagó. */
    estado = 'Cerrado'; plan = inf.clases + ' clases'; sinDetalle = true;
  }else{
    const d = diasEntre(x.fecha, HOY_CLAVE);
    estado = (d !== null && d > diasPerdido) ? 'Perdido' : 'Pendiente';
  }
  const k = x.id + '|' + x.fecha + '|' + x.hora;
  const ex = registroExtra[k] || {};
  /* En Crossfy las pruebas sin usuario llevan "(prueba)" en el apellido:
     en el registro va el nombre limpio. */
  const nombre = a ? nombreCompleto(a).replace(/\s*\(prueba\)\s*/ig, ' ').replace(/\s+/g, ' ').trim() : 'Socio #' + x.id;
  return {k, tipo: 'prueba', id: x.id, nombre, provisorio: x.id < 0,
          agenda: x.reserva || x.fecha, actividad: actividadRegistro(x.disc), fecha: x.fecha, hora: x.hora,
          asis, estado, insc, plan, ticket, sinDetalle, canal: ex.canal || '', notas: ex.notas || ''};
}
/* Compras sin clase de prueba que el registro de Agu también anota:
   alguien nuevo que compró directo, o un ex socio que vuelve (su compra
   anterior terminó hace más de 60 días). Las renovaciones no entran. */
function comprasSinPrueba(mes, conPrueba){
  const out = [];
  compras.filter(c => c.fecha && c.fecha.slice(0, 7) === mes && (c.clases || 0) > 1).forEach(c => {
    if(conPrueba.indexOf(c.id) !== -1) return;
    const previas = compras.filter(p => p.id === c.id && p.fecha && p.fecha < c.fecha).sort((a, b) => b.fecha.localeCompare(a.fecha));
    const inf = crossfyInfo[c.id] || {};
    let tipo = '';
    if(previas.length){
      const fin = previas[0].vence || previas[0].fecha;
      if(diasEntre(fin, c.fecha) > 60) tipo = 'exsocio';
    }else if(inf.reg && diasEntre(inf.reg, c.fecha) <= 30) tipo = 'directo';
    if(!tipo) return;
    const a = getAlumno(c.id);
    const k = c.id + '|compra|' + c.fecha;
    const ex = registroExtra[k] || {};
    out.push({k, tipo, id: c.id, nombre: a ? nombreCompleto(a) : 'Socio #' + c.id, agenda: c.fecha, actividad: '', fecha: '', hora: '',
              asis: '', estado: 'Cerrado', insc: c.fecha, plan: c.clases + ' clases', ticket: c.importe || '',
              canal: ex.canal || '', notas: ex.notas != null ? ex.notas : (tipo === 'exsocio' ? 'Ex socio' : 'Compró sin clase de prueba')});
  });
  return out;
}
function filasDelMes(mes){
  const pruebas = clasesDePrueba().filter(x => x.fecha.slice(0, 7) === mes).map(filaDePrueba).filter(Boolean)
    .sort((a, b) => (a.fecha + a.hora).localeCompare(b.fecha + b.hora));
  return pruebas.concat(comprasSinPrueba(mes, pruebas.map(f => f.id)));
}
function metricasDelMes(mes, filas){
  const pr = filas.filter(f => f.tipo === 'prueba');
  const cerr = filas.filter(f => f.estado === 'Cerrado');
  const m = {
    agendados: pr.length,
    concretados: pr.filter(f => f.asis === 'Asistió').length,
    compraron: pr.filter(f => f.estado === 'Cerrado').length,
    pendientes: pr.filter(f => f.estado === 'Pendiente').length,
    redes: cerr.filter(f => f.tipo !== 'exsocio' && ['Instagram','WhatsApp','Facebook','Google'].indexOf(f.canal) !== -1).length,
    exsocios: cerr.filter(f => f.tipo === 'exsocio').length,
    visitas: cerr.filter(f => f.tipo !== 'exsocio' && f.canal === 'Visita').length,
    referidos: cerr.filter(f => f.tipo !== 'exsocio' && f.canal === 'Referido').length,
    sinCanal: cerr.filter(f => f.tipo !== 'exsocio' && !f.canal).length,
    bajas: Object.keys(crossfyInfo).filter(id => { const i = crossfyInfo[id]; return i.paq === 'VENCIDO' && i.vence && i.vence.slice(0, 7) === mes && i.vence <= HOY_CLAVE; }).length,
    activos: Object.keys(crossfyInfo).filter(id => crossfyInfo[id].paq === 'ACTIVO').length,
  };
  m.asistencia = m.agendados ? Math.round(100 * m.concretados / m.agendados) : null;
  m.cierre = m.concretados ? Math.round(100 * m.compraron / m.concretados) : null;
  return m;
}
function textoFilaRegistro(f){

    .map(v => String(v == null ? '' : v).replace(/[\t\n]+/g, ' ')).join('\t');

const MESES_NOMBRE = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

/* ---------- Zonas de fuerza y Progreso ----------
   Cada ejercicio del banco puede tener una o dos zonas (banco[i].zonas).
   La fuerza de una zona es el promedio de cuánto subió la carga de cada
   uno de sus ejercicios en el período; la general, el promedio de las
   zonas que tienen datos. Todo sale de las cargas ya guardadas. */
const ZONAS_F = {empT:'Empuje torso', tracT:'Tracción torso', tracP:'Tracción pierna', empP:'Empuje pierna', core:'Core'};
const ZORD = ['empT', 'tracT', 'tracP', 'empP', 'core'];
const ETQ_Z = {empT:['Empuje', 'torso'], tracT:['Tracción', 'torso'], tracP:['Tracción', 'pierna'], empP:['Empuje', 'pierna'], core:['Core', '']};
function zonasDeEj(nombre){
  const id = buscarEnBanco(nombre), e = id ? ejercicioPorId(id) : null;
  return e && Array.isArray(e.zonas) ? e.zonas : [];
}
function toggleZonaEj(i, z){
  const e = banco[i]; if(!e) return;
  const l = (e.zonas || []).slice();
  const k = l.indexOf(z);
  if(k !== -1) l.splice(k, 1);
  else{
    if(l.length >= 2){ aviso('Un ejercicio puede tener hasta dos zonas. Sacá una primero.'); return; }
    l.push(z);
  }
  e.zonas = ZORD.filter(x => l.indexOf(x) !== -1);
  persistBanco();
  pintarListaBanco();
}
function claveDeCarga(c){ const ms = momentoCarga(c); return ms ? claveFecha(new Date(ms)) : ''; }
/* Clases a las que vino: una por fecha+hora+disciplina. Cuenta lo que
   Crossfy marca presente (o reservado, si la clase ya pasó) más lo que se
   corrigió a mano en la app. */
function asistenciasDe(alumnoId){
  const set = {};
  Object.keys(reservasImportadas).forEach(f => {
    if(f > HOY_CLAVE) return;
    (reservasImportadas[f] || []).forEach(r => {
      if(r.alumnoId !== alumnoId) return;
      const k = f + '|' + (r.hora || '') + '|' + normDisc(r.disciplina);
      const aj = ajustesClase[k] || {};
      const e = String(r.estado || '').toUpperCase();
      let vino = e.indexOf('AUSENT') !== 0;
      if(aj.presentes && aj.presentes.indexOf(alumnoId) !== -1) vino = true;
      if((aj.ausentes || []).indexOf(alumnoId) !== -1 || (aj.quitados || []).indexOf(alumnoId) !== -1) vino = false;
      if(vino) set[k] = f;
    });
  });
  Object.keys(ajustesClase).forEach(k => {
    const aj = ajustesClase[k], f = k.split('|')[0];
    if(f > HOY_CLAVE || !aj) return;
    if((aj.agregados || []).indexOf(alumnoId) !== -1 && (aj.ausentes || []).indexOf(alumnoId) === -1) set[k] = f;
  });
  return Object.keys(set).map(k => set[k]).sort();
}
function primerDiaDe(alumnoId){
  const f = asistenciasDe(alumnoId).concat(cargas.filter(c => c.alumnoId === alumnoId).map(claveDeCarga).filter(Boolean)).sort();
  return f[0] || null;
}
function restarDias(clave, n){ return claveFecha(new Date(fechaDesdeClave(clave).getTime() - n * 86400000)); }
function diasEntreClaves(a, b){ return Math.round((fechaDesdeClave(b).getTime() - fechaDesdeClave(a).getTime()) / 86400000); }
function periodoProg(alumnoId){
  const inicio = state.progPeriodo === 'inicio';
  const desde = inicio ? (primerDiaDe(alumnoId) || HOY_CLAVE) : restarDias(HOY_CLAVE, 27);
  return {desde, hasta: HOY_CLAVE, inicio};
}
function asistenciaProg(alumnoId, per){
  const dias = asistenciasDe(alumnoId).filter(f => f >= per.desde && f <= per.hasta);
  const semanas = Math.max(1, (diasEntreClaves(per.desde, per.hasta) + 1) / 7);
  const semSet = {};
  dias.forEach(f => { semSet[Math.floor(diasEntreClaves(per.desde, f) / 7)] = true; });
  const nSem = Math.max(1, Math.ceil((diasEntreClaves(per.desde, per.hasta) + 1) / 7));
  return {clases: dias.length, porSemana: dias.length / semanas, semConClase: Object.keys(semSet).length, nSem};
}
/* Primera y última carga de cada ejercicio dentro del período. */
function progresoEjs(alumnoId, per){
  const g = {};
  cargas.forEach(c => {
    if(c.alumnoId !== alumnoId || !(Number(c.kg) > 0)) return;
    const k = claveDeCarga(c);
    if(!k || k < per.desde || k > per.hasta) return;
    const id = idEj(c.ejercicio);
    (g[id] = g[id] || []).push(c);
  });
  return Object.keys(g).map(id => {
    const l = g[id].sort((x, y) => momentoCarga(x) - momentoCarga(y));
    if(claveDeCarga(l[0]) === claveDeCarga(l[l.length - 1])) return null;
    const a = Number(l[0].kg), b = Number(l[l.length - 1].kg);
    return {id, nombre: nombreEj(l[0].ejercicio), desde: a, hasta: b, pct: (b - a) / a * 100, zonas: zonasDeEj(l[0].ejercicio)};
  }).filter(Boolean);
}
function fuerzaProg(alumnoId, per){
  const ejs = progresoEjs(alumnoId, per);
  const acc = {};
  ejs.forEach(p => p.zonas.forEach(z => (acc[z] = acc[z] || []).push(p.pct)));
  const zonas = ZORD.map(z => ({z, pct: acc[z] ? acc[z].reduce((s, x) => s + x, 0) / acc[z].length : null}));
  const con = zonas.filter(z => z.pct != null);
  const general = con.length ? con.reduce((s, x) => s + x.pct, 0) / con.length : null;
  const ranking = ejs.filter(p => p.pct > 0).sort((a, b) => b.pct - a.pct).slice(0, 3);
  return {ejs, zonas, general, ranking, sinZona: ejs.filter(p => !p.zonas.length)};
}
function pctTxt(p){ return (p > 0 ? '+' : '') + Math.round(p) + '%'; }
function numKg(n){ return String(Math.round(n * 10) / 10).replace('.', ','); }
function escalaMaxZ(zonas){ const m = Math.max(10, ...zonas.map(z => z.pct || 0)); return Math.ceil(m / 10) * 10; }
function svgPilares(zonas){
  const W = 520, H = 230, base = 170, alto = 120, n = zonas.length, colw = W / n, bw = 46, max = escalaMaxZ(zonas);
  let s = `<svg class="prog-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Fuerza por zona, en porcentaje de mejora">`;
  s += `<line x1="0" y1="${base}" x2="${W}" y2="${base}" style="stroke:var(--border)" stroke-width="1"/>`;
  zonas.forEach((z, i) => {
    const cx = colw * i + colw / 2, v = z.pct;
    const h = v != null && v > 0 ? Math.max(6, alto * v / max) : (v != null ? 3 : 0);
    if(v != null) s += `<rect x="${cx - bw / 2}" y="${base - h}" width="${bw}" height="${h}" rx="${Math.min(4, h / 2)}" style="fill:${v > 0 ? 'var(--accent)' : 'var(--text-faint)'}"></rect>`;
    s += `<text x="${cx}" y="${base - h - 10}" text-anchor="middle" font-weight="800" font-size="19" style="fill:${v != null && v > 0 ? 'var(--text)' : 'var(--text-faint)'}">${v != null ? pctTxt(v) : '—'}</text>`;
    s += `<text x="${cx}" y="${base + 22}" text-anchor="middle" font-size="14" style="fill:var(--text-soft)">${ETQ_Z[z.z][0]}</text>`;
    if(ETQ_Z[z.z][1]) s += `<text x="${cx}" y="${base + 40}" text-anchor="middle" font-size="14" style="fill:var(--text-soft)">${ETQ_Z[z.z][1]}</text>`;
  });
  return s + '</svg>';
}
function puntosRadar(n, cx, cy, r){ return Array.from({length: n}, (_, i) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; }); }
function svgRadar(zonas){
  const W = 520, H = 320, cx = W / 2, cy = 165, R = 105, n = zonas.length, max = escalaMaxZ(zonas);
  let s = `<svg class="prog-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Fuerza por zona en radar, en porcentaje de mejora">`;
  [0.5, 1].forEach(f => { s += `<polygon points="${puntosRadar(n, cx, cy, R * f).map(p => p.join(',')).join(' ')}" fill="none" style="stroke:var(--border)" stroke-width="1"/>`; });
  puntosRadar(n, cx, cy, R).forEach(p => { s += `<line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}" style="stroke:var(--border)" stroke-width="1"/>`; });
  const pts = zonas.map((z, i) => puntosRadar(n, cx, cy, Math.max(4, R * Math.max(0, z.pct || 0) / max))[i]);
  s += `<polygon points="${pts.map(p => p.join(',')).join(' ')}" style="fill:var(--accent-soft); stroke:var(--accent)" stroke-width="2" stroke-linejoin="round"/>`;
  pts.forEach((p, i) => { if(zonas[i].pct != null) s += `<circle cx="${p[0]}" cy="${p[1]}" r="5" style="fill:var(--accent); stroke:var(--bg)" stroke-width="2"></circle>`; });
  puntosRadar(n, cx, cy, R + 26).forEach((p, i) => {
    const z = zonas[i], anc = Math.abs(p[0] - cx) < 10 ? 'middle' : (p[0] > cx ? 'start' : 'end');
    const lab = ETQ_Z[z.z][0] + (ETQ_Z[z.z][1] ? ' ' + ETQ_Z[z.z][1] : '');
    const y0 = i === 0 ? p[1] - 22 : p[1];
    s += `<text x="${p[0]}" y="${y0}" text-anchor="${anc}" font-size="14" style="fill:var(--text-soft)">${lab}</text>`;
    s += `<text x="${p[0]}" y="${y0 + 18}" text-anchor="${anc}" font-weight="800" font-size="17" style="fill:${z.pct != null && z.pct > 0 ? 'var(--accent)' : 'var(--text-faint)'}">${z.pct != null ? pctTxt(z.pct) : '—'}</text>`;

function tecmovProg(alumnoId, per){

/* ---------- Devoluciones y tarjeta ----------
   Una devolución es lo que el profe le dice al alumno: el punto de partida
   (al empezar) o el seguimiento mensual. La app junta los números (clases,
   fuerza, RM, pruebas) y el profe escribe lo demás. De ahí sale una tarjeta

function pilaresTarjeta(x, zonas, X0, y, ancho, k, seco){
  const max = escalaMaxZ(zonas), n = zonas.length, colw = ancho / n, bw = 74 * k, alto = 135 * k;
  const base = y + 34 * k + alto;
  if(!seco){ x.fillStyle = '#333'; x.fillRect(X0, base, ancho, 2); }
  zonas.forEach((z, i) => {
    const cx = X0 + colw * i + colw / 2, v = z.pct;
    const h = v != null && v > 0 ? Math.max(6 * k, alto * v / max) : (v != null ? 4 : 0);
    if(!seco && v != null){ x.fillStyle = v > 0 ? '#C6FC00' : '#555'; rrT(x, cx - bw / 2, base - h, bw, h, 8); x.fill(); }
    if(!seco){
      fuenteT(x, 'd', 800, 26 * k); x.textAlign = 'center'; x.fillStyle = v != null && v > 0 ? '#F2F2F2' : '#A6A6A6';
      x.fillText(v != null ? pctTxt(v) : '—', cx, base - h - 32 * k);
      fuenteT(x, 'b', 400, 21 * k); x.fillStyle = '#A6A6A6';
      x.fillText(ETQ_Z[z.z][0], cx, base + 10 * k); if(ETQ_Z[z.z][1]) x.fillText(ETQ_Z[z.z][1], cx, base + 35 * k);
      x.textAlign = 'left';
    }
  });
  return base + 66 * k;
}
function romboTarjeta(x, zonas, X0, y, ancho, k, seco){
  const R = 112 * k, cx = X0 + ancho / 2, cy = y + 56 * k + R, n = zonas.length, max = escalaMaxZ(zonas);
  if(!seco){
    x.strokeStyle = '#2c2c2c'; x.lineWidth = 2;
    [0.5, 1].forEach(f => { x.beginPath(); puntosRadar(n, cx, cy, R * f).forEach((p, i) => i ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1])); x.closePath(); x.stroke(); });
    puntosRadar(n, cx, cy, R).forEach(p => { x.beginPath(); x.moveTo(cx, cy); x.lineTo(p[0], p[1]); x.stroke(); });
    const pts = zonas.map((z, i) => puntosRadar(n, cx, cy, Math.max(5, R * Math.max(0, z.pct || 0) / max))[i]);
    x.beginPath(); pts.forEach((p, i) => i ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1])); x.closePath();
    x.fillStyle = 'rgba(198,252,0,0.22)'; x.fill(); x.strokeStyle = '#C6FC00'; x.lineWidth = 3; x.lineJoin = 'round'; x.stroke();
    pts.forEach((p, i) => { if(zonas[i].pct == null) return; x.beginPath(); x.arc(p[0], p[1], 7 * k, 0, Math.PI * 2); x.fillStyle = '#C6FC00'; x.fill(); });
    puntosRadar(n, cx, cy, R + 26 * k).forEach((p, i) => {
      const z = zonas[i], al = Math.abs(p[0] - cx) < 10 ? 'center' : (p[0] > cx ? 'left' : 'right');
      x.textAlign = al;
      const lab = ETQ_Z[z.z][0] + (ETQ_Z[z.z][1] ? ' ' + ETQ_Z[z.z][1] : '');
      const ytop = i === 0 ? p[1] - 56 * k : p[1] - 14 * k;
      fuenteT(x, 'b', 400, 21 * k); x.fillStyle = '#A6A6A6'; x.fillText(lab, p[0], ytop);
      fuenteT(x, 'd', 800, 25 * k); x.fillStyle = z.pct != null && z.pct > 0 ? '#C6FC00' : '#A6A6A6'; x.fillText(z.pct != null ? pctTxt(z.pct) : '—', p[0], ytop + 24 * k);
      x.textAlign = 'left';
    });
  }
  return cy + R * Math.cos(Math.PI / n) + 56 * k;
}

function actualizarFichaOverride(a){
  cacheAlertas = null;
  fichaOverrides[a.id] = {objetivo:a.objetivo, observacionIngreso:a.observacionIngreso,
                          condiciones:a.condiciones, adaptaciones:a.adaptaciones};
  persistFichas();
}

   por el teclado), al lado del botón queda escrito que se guardó. */
