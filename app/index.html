/* Novedad de ficha: no está atada a una clase. */
function novedadDeFicha(alumnoId, tipo, nota, extra){
  novedades.unshift(Object.assign({
    id:'n'+Date.now(), alumnoId, claseId:null, dia: claveActiva(), claseHora:'', claseDisc:'',
    profesor: profesorActivo, fecha: fechaCorta(), hora: nowHora(), tipo, nota}, extra || {}));
  persistNovedades();
}
function cerrarFichaModal(){ state.fichaModal = null; render(); }

function pedirCambioNivel(alumnoId, nuevo){
  const a = getAlumno(alumnoId);
  if(!a || !nuevo || nuevo === (a.nivel || 2)){ render(); return; }
  state.fichaModal = {tipo:'nivel', alumnoId, hasta:nuevo, nota:''};
  render();
}
function confirmarCambioNivel(){
  const m = state.fichaModal; if(!m || m.tipo !== 'nivel') return;
  const a = getAlumno(m.alumnoId); if(!a) return;
  const el = document.getElementById('nivel-nota');
  const nota = (el ? el.value : m.nota || '').trim();
  const antes = a.nivel || 2;
  cambiarNivelSinRender(a.id, m.hasta);
  novedadDeFicha(a.id, 'cambio_nivel', nivelLabel(antes) + ' → ' + nivelLabel(m.hasta) + (nota ? ' — ' + nota : ''),
                 {nivelAntes: antes, nivelDespues: m.hasta});
  state.fichaModal = null;
  showToast('Nivel de ' + nombreCompleto(a) + ': ' + nivelLabel(m.hasta));
  render();
}
function cambiarNivelSinRender(alumnoId, nivel){
  const a = getAlumno(alumnoId); if(!a) return;
  a.nivel = nivel; nivelOverrides[alumnoId] = nivel; persistNivel();
}

function itemsLevantables(a, que){
  if(que === 'alerta') return alertasDe(a).map(x => ({
    key: x.fuente === 'nov' ? 'n:' + x.id : 'c:' + x.i, nivel: x.nivel, titulo: x.texto,
    meta: (x.fecha ? x.fecha + ' — ' + (x.profesor || '') + ' · ' : '') + (x.nivel === 'rojo' ? 'Dolor' : 'Molestia')}));
  return adaptacionesActivas(a).map(x => ({
    key: x.legacy && !x.id ? 's:' + x.i : 'a:' + x.id, nivel: '', titulo: tituloAdaptacion(x),
    meta: x.fecha ? x.fecha + ' — ' + (x.profesor || '') : ''}));
}
function abrirLevantar(alumnoId, que){
  const a = getAlumno(alumnoId); if(!a) return;
  const items = itemsLevantables(a, que);
  if(!items.length) return;
  state.fichaModal = {tipo:'levantar', que, alumnoId, sel: items.length === 1 ? items[0].key : null, nota:''};
  render();
}
function elegirLevantar(key){ if(state.fichaModal){ state.fichaModal.sel = key; const n = document.getElementById('lev-nota'); if(n) state.fichaModal.nota = n.value; render(); } }
function confirmarLevantar(){
  const m = state.fichaModal; if(!m || m.tipo !== 'levantar' || !m.sel) return;
  const a = getAlumno(m.alumnoId); if(!a) return;
  const el = document.getElementById('lev-nota');
  const nota = (el ? el.value : m.nota || '').trim();
  const marca = {fecha: fechaCorta(), hora: nowHora(), profesor: profesorActivo, nota, ts: Date.now()};
  let resumen = '', tipoNov = '';
  if(m.que === 'alerta'){
    tipoNov = 'alerta_levantada';
    if(m.sel.indexOf('n:') === 0){
      const n = novedades.find(x => x.id === m.sel.slice(2)); if(!n) return;
      n.levantada = marca; n.editado = Date.now();
      resumen = TIPOS[n.tipo].label + ' del ' + n.fecha + ' (' + (n.profesor || '') + '): «' + (n.nota || TIPOS[n.tipo].label) + '»';
      persistNovedades();
    }else{
      const c = (a.condiciones || [])[Number(m.sel.slice(2))]; if(!c) return;
      c.levantada = marca; actualizarFichaOverride(a);
      resumen = 'Alerta ' + (c.nivel === 'rojo' ? 'roja' : 'amarilla') + ': «' + c.texto + '»';
    }
  }else{
    tipoNov = 'adaptacion_levantada';
    let x = null;
    if(m.sel.indexOf('a:') === 0) x = (a.adaptaciones || []).find(y => y && y.id === m.sel.slice(2));
    else{
      /* Una adaptación de texto libre de antes: se convierte para poder
         marcarla como levantada y que eso viaje al otro aparato. */
      const i = Number(m.sel.slice(2)), t = (a.adaptaciones || [])[i];
      if(typeof t === 'string'){ x = {id:'a' + Date.now(), texto:t}; a.adaptaciones[i] = x; }
    }
    if(!x) return;
    x.levantada = marca; actualizarFichaOverride(a);
    resumen = tituloAdaptacion(x) + (x.fecha ? ' (' + x.fecha + ', ' + (x.profesor || '') + ')' : '');
  }
  novedadDeFicha(a.id, tipoNov, resumen + (nota ? ' — ' + nota : ''));

}

/* ---------- Screen: BUSCAR ALUMNO ---------- */

const FILTROS_ALUMNOS = [
  {key:'reservas', label:'Reservas de hoy'},
  {key:'todos', label:'Todos'},
  {key:'paquete_activo', label:'Con paquete activo'},
  {key:'prueba', label:'Prueba'},
];
let filtroAlumnos = 'reservas';
let buscarQuery = '';

/* Al escribir y al cambiar de filtro se repintan SOLO los chips y la
   lista, nunca el input: un render() completo destruye el input que está
   enfocado y en el celular eso baja el teclado en cada letra tipeada. */
function repintarBuscar(){
  const chips = document.getElementById('buscar-chips');
  const lista = document.getElementById('buscar-lista');
  if(!chips || !lista){ render(); return; }
  chips.innerHTML = buscarChipsHtml();
  lista.innerHTML = buscarListaHtml();
}
function setFiltroAlumnos(k){ filtroAlumnos = k; repintarBuscar(); }
function onBuscarInput(v){ buscarQuery = v; repintarBuscar(); }

function alumnosFiltrados(){
  const hoySet = idsDeHoy();
  let lista = ALUMNOS;
  if(filtroAlumnos === 'reservas') lista = lista.filter(a => hoySet.has(a.id));
  else if(filtroAlumnos === 'paquete_activo') lista = lista.filter(a => a.paquete === 'ACTIVO');
  else if(filtroAlumnos === 'prueba') lista = lista.filter(a => a.prueba);

  const q = buscarQuery.trim().toLowerCase();
  if(q) lista = lista.filter(a => (a.nombre + ' ' + a.apellido).toLowerCase().includes(q));

  return lista.slice().sort((x,y) => (x.apellido+x.nombre).localeCompare(y.apellido+y.nombre));
}

function buscarChipsHtml(){
  return FILTROS_ALUMNOS.map(f => `<button class="chip ${filtroAlumnos===f.key?'active':''}" onclick="setFiltroAlumnos('${f.key}')">${esc(f.label)}</button>`).join('');
}

function buscarListaHtml(){
  const lista = alumnosFiltrados();
  if(lista.length){
    return lista.map(a => {
      const cond = condicionMasSevera(a);
      return `
      <div class="alumno-row">
        <button class="alumno-main" onclick="nav('alumno',{alumnoId:${a.id}})">
          <span class="nombre">${esc(nombreCompleto(a))}<span class="nivel-badge ${nivelClass(a.nivel)}">${nivelLabel(a.nivel)}</span>${badgesAlumno(a)}</span>
          ${cond ? `<span class="cond-line ${cond.nivel}">⚠ ${esc(cond.texto)}</span>` : ''}
        </button>
      </div>`;
    }).join('');
  }
  /* Si no hay resultados dentro del filtro activo pero sí los hay en toda
     la base, hay que decirlo: si no, el profe busca a alguien que hoy no
     tiene clase, ve "no encontrado" y parece que el alumno no está
     cargado. */
  const q = buscarQuery.trim().toLowerCase();
  const enTodos = q ? ALUMNOS.filter(a => (a.nombre + ' ' + a.apellido).toLowerCase().includes(q)).length : 0;
  if(filtroAlumnos !== 'todos' && enTodos){
    return `<div class="empty-state">Sin resultados en este filtro.<br><button class="btn btn-ghost btn-sm" style="margin-top:12px;" onclick="setFiltroAlumnos('todos')">Buscar en toda la base (${enTodos} coincidencia${enTodos===1?'':'s'}) →</button></div>`;
  }
  return `<div class="empty-state">No se encontraron alumnos con este filtro/búsqueda.</div>`;
}

function screenAlumnos(){
  return `
    ${header('Buscar alumno', ALUMNOS.length + ' en la base de Crossfy', true)}
    <div style="margin-bottom:14px; display:flex; gap:8px; align-items:center;">
      <input type="text" class="search-input" style="flex:1; min-width:0;" placeholder="Buscar por nombre o apellido…" value="${esc(buscarQuery)}" oninput="onBuscarInput(this.value)" />
      <button type="button" class="btn btn-primary btn-sm" style="white-space:nowrap;" onclick="abrirNuevoAlumno()">+ Nuevo alumno</button>
    </div>
    <div class="filter-row" id="buscar-chips">${buscarChipsHtml()}</div>
    <div class="card" style="padding:6px 20px 16px;" id="buscar-lista">${buscarListaHtml()}</div>
  `;
}

/* ---------- Modal: Novedad ---------- */

/* ---------- Novedades: 4 botones, panel compacto ----------
   Técnica / movilidad · Cambiar (ejercicio o carga) · Alerta (molestia,
   dolor y avisos de la clase) · Observación (sólo cosas positivas).
   Es una ayuda memoria: en clase alcanza con tocar opciones; la nota y,
   en un cambio de ejercicio, "por cuál", se completan después desde la
   ficha sobre la MISMA novedad. */
const NOV_GRUPOS = {
  tecmov:{label:'Técnica / movilidad'},
  cambiar:{label:'Cambiar'},
  alerta:{label:'Alerta'},
  obs:{label:'Observación'},
};
const NOV_ORDEN = ['tecmov','cambiar','alerta','obs'];
const NOV_QUE = {tecnica:'Técnica', lados:'Diferencia entre lados', rango:'Rango de movimiento', coord:'Coordinación'};
const NOV_CUERPO = ['Hombro','Codo','Muñeca','Cuello','Espalda alta','Lumbar','Cadera','Rodilla','Tobillo'];
const NOV_LADO = {izq:'izquierdo', der:'derecho', ambos:'los dos lados'};
const NOV_OBS_BASE = ['Muy buena energía','Buena actitud','Se animó a más carga','Mejoró mucho'];
const NOV_AVISOS_BASE = ['Llegó cansado/a','Llegó tarde','Se fue antes','Pidió bajar intensidad'];
/* Botones propios que el staff agrega tildando "Agregar como botón". */
let botonesNov = {obs:[], aviso:[]};
/* Pruebas fijas (armadas desde el creador de rutinas), resultados guardados
   y cronómetro en curso. Cada uno vive en su clave de akStore. */
let devoluciones = [];
function persistDevoluciones(){ try{ akStore.setItem('akasha-devoluciones', JSON.stringify(devoluciones)); }catch(e){} }
let pruebasFijas = [];
let pruebasReg = [];
let cronoEstado = null;
function persistPruebasFijas(){ try{ akStore.setItem('akasha-pruebas-fijas', JSON.stringify(pruebasFijas)); }catch(e){} }
function persistPruebasReg(){ try{ akStore.setItem('akasha-pruebas-reg', JSON.stringify(pruebasReg)); }catch(e){} }
function persistCrono(){ try{ if(cronoEstado) akStore.setItem('akasha-crono', JSON.stringify(cronoEstado)); else akStore.removeItem('akasha-crono'); }catch(e){} }
function persistBotonesNov(){ try{ akStore.setItem('akasha-botones-nov', JSON.stringify(botonesNov)); }catch(e){} }
function listaFrases(grupo){
  const base = grupo === 'obs' ? NOV_OBS_BASE : NOV_AVISOS_BASE;
  const extra = (botonesNov[grupo === 'obs' ? 'obs' : 'aviso'] || []);
  return base.concat(extra);
}
/* Qué grupo y sub le corresponde a una novedad, también a las viejas
   (anteriores a los cuatro botones), que sólo traen "tipo". */
function grupoDeNov(n){
  if(n.grupo) return {grupo:n.grupo, sub:n.sub || ''};
  const mapa = {cambio_ejercicio:['cambiar','ejercicio'], cambio_carga:['cambiar','carga'], molestia:['alerta','molestia'], dolor:['alerta','dolor'], aviso:['alerta','aviso'], tecnica_mov:['tecmov',''], observacion:['obs',''], otro:['obs','']};
  const x = mapa[n.tipo];
  return x ? {grupo:x[0], sub:x[1]} : {grupo:'', sub:''};
}
function tipoDeNov(m){
  if(m.grupo === 'tecmov') return 'tecnica_mov';
  if(m.grupo === 'cambiar') return m.sub === 'carga' ? 'cambio_carga' : 'cambio_ejercicio';
  if(m.grupo === 'alerta') return m.sub === 'dolor' ? 'dolor' : (m.sub === 'molestia' ? 'molestia' : 'aviso');
  return 'observacion';
}
function tituloNov(n){
  if(n.grupo === 'tecmov'){ const q = (n.que || []).map(x => NOV_QUE[x]).filter(Boolean).join(' + '); return q || 'Técnica / movilidad'; }
  if(n.grupo === 'alerta' && n.sub === 'aviso') return 'Aviso de la clase';
  return TIPOS[n.tipo] ? TIPOS[n.tipo].label : (n.tipo || '');
}
function detalleNov(n){
  const ej = n.ej ? n.ej : '';
  if(n.grupo === 'tecmov') return [ej, n.lado ? NOV_LADO[n.lado] : '', n.como === 'mejoro' ? 'mejoró' : (n.como === 'costo' ? 'le costó' : '')].filter(Boolean).join(' · ');
  if(n.grupo === 'cambiar') return n.sub === 'carga' ? [ej, n.dir === 'sube' ? 'subió' : (n.dir === 'baja' ? 'bajó' : '')].filter(Boolean).join(' · ') : (ej + (n.nuevo ? ' → ' + n.nuevo : ''));
  if(n.grupo === 'alerta' && n.sub !== 'aviso') return [n.zonaCuerpo || '', n.lado ? NOV_LADO[n.lado] : '', ej ? 'en ' + ej.toLowerCase() : ''].filter(Boolean).join(' · ');
  return (n.frases || []).join(' · ');
}
/* Lo que falta completar desde la ficha. Las novedades viejas no se marcan. */
function faltaNov(n){
  if(!n.grupo || n.convertida) return [];
  const f = [];
  if(n.grupo === 'cambiar' && n.sub === 'ejercicio' && !n.nuevo) f.push('por cuál ejercicio');
  const autoexplicada = (n.grupo === 'obs' || (n.grupo === 'alerta' && n.sub === 'aviso')) && (n.frases || []).length;
  if(!n.nota && !autoexplicada) f.push('la nota');
  return f;
}
/* Bloques de la rutina de la clase con sus ejercicios (para el nivel del alumno). */
function bloquesNov(c, alumno){
  const r = rutinaDeClase(c), out = [];
  ((r && r.bloques) || []).forEach((b, i) => {
    const filas = b.filas || {};
    const claves = filas[alumno && alumno.nivel] ? [alumno.nivel] : (filas[0] ? [0] : Object.keys(filas));
    const ejs = [], vistos = {};
    claves.forEach(k => ((filas[k] || {}).ejs || []).forEach(t => { const n = nombreEj(t), kk = normEj(n); if(n && !vistos[kk]){ vistos[kk] = 1; ejs.push(n); } }));
    out.push({nombre: claveBloque(b, i), titulo: tituloBloque(b, i), ejs});
  });
  return out;
}
function novVacia(alumnoId, claseId){
  return {alumnoId, claseId: claseId || null, editId: null, grupo:'', sub:'', que:[], ej:'', lado:'', como:'', dir:'',
          zonaCuerpo:'', frases:[], nuevo:'', nota:'', bloque:'', propio:'', guardarBoton:false, quitar:false, otroEj:false};
}
/* Cada toque vuelve a dibujar la ventana: se conserva dónde estaba el scroll. */
function novRender(){
  const sh = document.querySelector('.modal-sheet'); const y = sh ? sh.scrollTop : 0;
  render();
  const s2 = document.querySelector('.modal-sheet'); if(s2) s2.scrollTop = y;
}
function abrirNovedad(alumnoId, claseId){
  const m = state.novedadModal = novVacia(alumnoId, claseId);
  state.adaptForm = {orig:'', nuevo:'', nota:''};
  const c = claseId ? getClase(claseId) : null;
  if(c){
    const bs = bloquesNov(c, getAlumno(alumnoId));
    const rut = rutinaDeClase(c);
    const actual = rut ? bs[bloqueIdxClase(c, rut)] : null;   // el bloque que se está viendo
    if(actual) m.bloque = actual.nombre; else if(bs.length === 1) m.bloque = bs[0].nombre;
  }
  render();
}
function editarNovedad(id){
  const n = novedades.find(x => x.id === id);
  if(!n) return;
  const c = CLASES.find(x => esNovedadDeClase(n, x));
  const m = state.novedadModal = novVacia(n.alumnoId, c ? c.id : null);
  const g = grupoDeNov(n);
  Object.assign(m, {editId:id, grupo:g.grupo, sub:g.sub, que:(n.que || []).slice(), ej:n.ej || '', lado:n.lado || '', como:n.como || '',
    dir:n.dir || '', zonaCuerpo:n.zonaCuerpo || '', frases:(n.frases || []).slice(), nuevo:n.nuevo || '', nota:n.nota || '', bloque:n.bloque || ''});
  state.adaptForm = {orig:'', nuevo:'', nota:''};
  render();
}
function pedirBorrarNovedad(id){ state.borrarNov = id; render(); }
function borrarNovedad(id){
  const n = novedades.find(x => x.id === id);
  state.borrarNov = null;
  if(!n) return;
  n.borrada = true; n.editado = Date.now();
  persistNovedades();
  showToast('Novedad borrada');
  render();
}
function cerrarNovedad(){ state.novedadModal = null; state.adaptForm = {orig:'', nuevo:'', nota:''}; render(); }
/* Lo siguen usando los botones de la ficha ("Cambiar ejercicio"). */
function seleccionarTipo(tipo){
  const m = state.novedadModal; if(!m) return;
  const g = grupoDeNov({tipo});
  if(!g.grupo) return;
  m.grupo = g.grupo; m.sub = g.sub; render();
}
function novGrupo(g){ const m = state.novedadModal; if(!m || m.editId) return; m.grupo = m.grupo === g ? '' : g; m.sub = g === 'cambiar' ? 'ejercicio' : (g === 'alerta' ? 'molestia' : ''); m.frases = []; novRender(); }
function novSub(s){ const m = state.novedadModal; if(!m) return; m.sub = s; if(s !== 'aviso') m.frases = []; novRender(); }
function novToggle(campo, val){ const m = state.novedadModal; if(!m) return; const l = m[campo], i = l.indexOf(val); if(i === -1) l.push(val); else l.splice(i, 1); novRender(); }
function novValor(campo, val){ const m = state.novedadModal; if(!m) return; m[campo] = m[campo] === val ? '' : val; novRender(); }
function novBloque(i){
  const m = state.novedadModal; if(!m) return;
  const c = m.claseId ? getClase(m.claseId) : null; if(!c) return;
  const b = bloquesNov(c, getAlumno(m.alumnoId))[i]; if(!b) return;
  m.bloque = b.nombre; m.ej = ''; state.bloqueNov = b.nombre; novRender();
}
function novEjercicios(m){
  const c = m.claseId ? getClase(m.claseId) : null;
  if(!c) return [];
  const b = bloquesNov(c, getAlumno(m.alumnoId)).find(x => x.nombre === m.bloque);
  const l = b ? b.ejs.slice() : [];
  if(m.ej && !l.some(x => normEj(x) === normEj(m.ej))) l.push(m.ej);
  return l;
}
function novEj(i){ const m = state.novedadModal; if(!m) return; const e = novEjercicios(m)[i]; if(e === undefined) return; m.ej = m.ej === e ? '' : e; novRender(); }
function novFrase(i){ const m = state.novedadModal; if(!m) return; const f = listaFrases(m.grupo)[i]; if(f === undefined) return; const j = m.frases.indexOf(f); if(j === -1) m.frases.push(f); else m.frases.splice(j, 1); novRender(); }
function novQuitarBoton(grupo, i){
  const k = grupo === 'obs' ? 'obs' : 'aviso';
  const base = (grupo === 'obs' ? NOV_OBS_BASE : NOV_AVISOS_BASE).length;
  const f = (botonesNov[k] || [])[i - base]; if(f === undefined) return;
  botonesNov[k].splice(i - base, 1); persistBotonesNov();
  const m = state.novedadModal; if(m){ const j = m.frases.indexOf(f); if(j !== -1) m.frases.splice(j, 1); }
  novRender();
}

/* Ejercicios de la rutina de una clase, para elegir cuál se cambia.
   Si el bloque tiene niveles se usan los del alumno. */
function ejerciciosDeRutinaClase(c, alumno){
  const r = rutinaDeClase(c);
  const out = [], vistos = {};
  ((r && r.bloques) || []).forEach(b => {
    const filas = b.filas || {};
    const claves = filas[alumno && alumno.nivel] ? [alumno.nivel] : (filas[0] ? [0] : Object.keys(filas));
    claves.forEach(k => ((filas[k] || {}).ejs || []).forEach(t => {
      const n = nombreEj(t), kk = normEj(n);
      if(n && !vistos[kk]){ vistos[kk] = 1; out.push(n); }
    }));
  });
  return out;
}
function adaptElegirLista(i){ const f = state.adaptForm; f.orig = (f.lista || [])[i] || ''; render(); }
function adaptQuitar(cual){ state.adaptForm[cual] = ''; render(); }
function adaptFormHtml(m){
  const f = state.adaptForm;
  const a = getAlumno(m.alumnoId), c = m.claseId ? getClase(m.claseId) : null;
  if(!f.lista) f.lista = c ? ejerciciosDeRutinaClase(c, a) : [];
  const pill = (cual) => `<div class="ad-chips"><span class="ad-pill">${esc(f[cual])} <button type="button" class="chip-remove" onclick="adaptQuitar('${cual}')" aria-label="Cambiar">×</button></span></div>`;
  const paso1 = f.orig ? pill('orig')
    : (f.lista.length && !f.otro
      ? `<div class="ad-chips">${f.lista.map((n, i) => `<button type="button" class="pend-sug" onclick="adaptElegirLista(${i})">${esc(n)}</button>`).join('')}</div>

      : selectorEj('adapt-orig', 'adaptOrig', {}, 'Buscá en el banco el ejercicio que se cambia…'));

  const t = (el ? el.value : m.propio || '').trim();
  if(!t) return;
  if(m.frases.indexOf(t) === -1) m.frases.push(t);

function guardarNovedad(alumnoId, claseId){
  const m = state.novedadModal;
  if(!m || !m.grupo) return;
  const elN = document.getElementById('nov-nota');
  const nota = (elN ? elN.value : (m.nota || '')).trim();
  const g = m.grupo, edit = !!m.editId;
  const c = claseId ? getClase(claseId) : null;
  /* Desde la ficha, "Cambiar ejercicio" va directo a Adaptaciones habituales. */
  if(!edit && !c && g === 'cambiar' && m.sub === 'ejercicio'){ guardarAdaptacion(alumnoId, null); return; }
  if(g === 'alerta' && m.sub === 'aviso') sumarFrasePropia(m);
  if(g === 'obs') sumarFrasePropia(m);
  const aviso = t => { showToast(t); };
  if(g === 'tecmov' && (!m.que.length || !m.ej)){ aviso('Elegí qué viste y el ejercicio'); return; }
  if(g === 'cambiar' && !m.ej){ aviso('Elegí el ejercicio'); return; }
  if(g === 'alerta' && (m.sub === 'molestia' || m.sub === 'dolor') && !m.zonaCuerpo){ aviso('Elegí dónde'); return; }
  if(g === 'alerta' && m.sub === 'aviso' && !m.frases.length && !nota){ aviso('Elegí un aviso o escribí una nota'); return; }
  if(g === 'obs' && !m.frases.length && !nota){ aviso('Elegí una opción o escribí una nota'); return; }
  const campos = () => {
    const o = {grupo: g, sub: m.sub || '', bloque: m.bloque || ''};
    if(g === 'tecmov'){ o.que = m.que.slice(); o.ej = m.ej; o.como = m.como; if(m.que.indexOf('lados') !== -1 || m.que.indexOf('rango') !== -1) o.lado = m.lado; }
    if(g === 'cambiar'){ o.ej = m.ej; if(m.sub === 'carga') o.dir = m.dir; }
    if(g === 'alerta'){ if(m.sub === 'aviso') o.frases = m.frases.slice(); else { o.zonaCuerpo = m.zonaCuerpo; o.lado = m.lado; o.ej = m.ej; } }
    if(g === 'obs') o.frases = m.frases.slice();
    return o;
  };
  const completarAdaptacion = (n) => {
    const a = getAlumno(n.alumnoId); if(!a) return false;
    a.adaptaciones = a.adaptaciones || [];
    const aid = 'a' + Date.now();
    a.adaptaciones.push({id: aid, orig: m.ej, nuevo: m.nuevo, nota, profesor: n.profesor || profesorActivo, fecha: n.fecha || fechaCorta(), hora: n.hora || nowHora(),
      dia: n.dia || claveActiva(), claseHora: n.claseHora || '', claseDisc: n.claseDisc || ''});
    actualizarFichaOverride(a);
    n.convertida = aid; n.ej = m.ej; n.nuevo = m.nuevo; n.nota = nota; n.editado = Date.now(); n.editadoPor = profesorActivo;
    return true;
  };
  if(edit){
    const n = novedades.find(x => x.id === m.editId);
    if(!n){ cerrarNovedad(); return; }
    const nuevoEstilo = !!n.grupo;
    const autoex = (g === 'obs' || (g === 'alerta' && m.sub === 'aviso')) && m.frases.length;
    if(nuevoEstilo && !nota && !autoex){ aviso('Completá la nota: en la ficha es necesaria'); return; }
    if(g === 'cambiar' && m.sub === 'ejercicio' && nuevoEstilo && !m.nuevo.trim()){ aviso('Completá por cuál ejercicio'); return; }
    if(g === 'cambiar' && m.sub === 'ejercicio' && nuevoEstilo){
      Object.assign(n, campos());
      completarAdaptacion(n);
      persistNovedades(); cerrarNovedad();
      showToast('Pasó a Adaptaciones habituales en la ficha');
      return;
    }
    Object.assign(n, campos());
    if(nuevoEstilo || n.tipo !== 'otro') n.tipo = tipoDeNov(m);
    n.nota = nota; n.editado = Date.now(); n.editadoPor = profesorActivo;
    persistNovedades(); cerrarNovedad();
    showToast('Novedad corregida');
    return;
  }
  const dato = {id:'n' + Date.now(), alumnoId, claseId: claseId || null,
    dia: claveActiva(), claseHora: c ? c.hora : '', claseDisc: c ? c.disciplina : '',
    profesor: profesorActivo, fecha: fechaCorta(), hora: nowHora(), tipo: tipoDeNov(m), nota};
  Object.assign(dato, campos());
  /* En clase, si ya se dijo por cuál se cambia (y hay nota), va directo a Adaptaciones. */
  if(g === 'cambiar' && m.sub === 'ejercicio' && m.nuevo.trim() && nota){
    completarAdaptacion(dato);
    cerrarNovedad();
    showToast('Adaptación guardada en la ficha de ' + nombreCompleto(getAlumno(alumnoId)));
    return;
  }
  if(g === 'cambiar' && m.sub === 'ejercicio' && m.nuevo.trim()) dato.nuevo = m.nuevo.trim();
  novedades.unshift(dato);
  persistNovedades();
  cerrarNovedad();
  showToast('Novedad guardada en la ficha');
}

/* ---------- Ejercicio medido (por bloque, editable desde "Rutina de hoy") ---------- */

/* La clave ahora es clase+bloque, no día+bloque: el mismo día puede
   tener un bloque "Movilidad" en el Método y otro en Funcional, y no son
   el mismo. */
/* Lo medido es de ESE día puntual (el lunes 5/10, no todos los lunes) y
   de esa hora si la rutina la tiene; si la rutina no tiene hora, vale
   para todas las clases de esa disciplina ese día, igual que la rutina.
   Antes la clave no tenía semana, así que lo que se marcaba un lunes
   aparecía marcado en los lunes de todas las semanas. */
function claveSemanaActiva(){
  const p = planDeFecha(fechaActiva);
  const f = p ? fechaDesdeClave(p.desde) : fechaActiva;
  return claveFecha(lunesDe(f || fechaActiva));
}
function claveMedicion(claveCl, bloqueName){
  return claveSemanaActiva() + '§' + claveCl + '|' + bloqueName;
}
function bloqueDe(claveCl, bloqueName){
  const c = rutinasVirtuales[claveCl] || rutinasImportadas.find(x => claveClase(x) === claveCl);
  return c ? c.bloques.find((b,i) => claveBloque(b,i) === bloqueName) : null;
}
/* agregarMedicion quedó reemplazada por medirDeBloque / medirDelBanco /
   medirTextoLibre: el ejercicio medido ya no se escribe suelto, sale del
   banco. Se mantiene el nombre por si quedó algún botón viejo en una
   pestaña abierta. */
function agregarMedicion(claveCl, bloqueName, inputId){
  medirTextoLibre(claveCl, bloqueName, inputId);
}
function quitarMedicion(claveCl, bloqueName, idx){
  const b = bloqueDe(claveCl, bloqueName);
  if(!b || !b.medicion) return;
  b.medicion.splice(idx, 1);
  medicionOverrides[claveMedicion(claveCl, bloqueName)] = b.medicion;
  persistMedicion();
  persistPlanificaciones();
  render();
}

/* Vuelve a poner sobre las rutinas lo que el profe había marcado como
   medido. Hay que llamarlo cada vez que se importa, porque la planilla
   trae los bloques limpios. */
function aplicarMedicionGuardada(){
  rutinasImportadas.forEach(c => {
    const k = claveClase(c);
    c.bloques.forEach((b, i) => {
      const g = medicionOverrides[claveMedicion(k, claveBloque(b, i))];
      /* Sin nada marcado para ESE día, vuelve a lo que traía la planilla
         (o a nada). Los bloques importados antes de este cambio no
         guardaban aparte lo de la planilla: a esos no se los toca. */
      if(g) b.medicion = g.slice();
      else if('medicionPlanilla' in b) b.medicion = (b.medicionPlanilla || []).slice();
      else if(!b.medicion) b.medicion = [];
    });
  });
}

/* Las clases ordenadas como se dan en la semana, para el acordeón. */
function rutinasOrdenadas(){
  return rutinasImportadas.slice().sort((a,b) => {
    const da = DIAS_SEMANA.indexOf(a.dia), db = DIAS_SEMANA.indexOf(b.dia);
    if(da !== db) return (da === -1 ? 99 : da) - (db === -1 ? 99 : db);
    return (enMinutos(a.hora) ?? 9999) - (enMinutos(b.hora) ?? 9999);
  });
}

            <div class="carga-label">${esc(it.ejercicio)}<span class="carga-bloque">${esc(it.bloque)}</span>${ultima ? `<span class="carga-sugerida">Trajo el último registro, de ${esc(ultima.fecha)} · se puede dejar o ajustar</span>` : ''}</div>
            <div class="carga-input-wrap">
              <input type="number" min="0" step="0.5" inputmode="decimal" id="carga-input-${i}" value="${val===null?'':val}" placeholder="0" />

        }).join('')}</div>` : `<p class="empty-hist">Esta clase no tiene rutina cargada, así que no hay ejercicios para cargarles peso. Cargá o elegí la rutina y volvé a probar.</p>`}
        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="cerrarCarga()">Cancelar</button>
          ${items.length ? `<button class="btn btn-primary" onclick="guardarCarga(${m.alumnoId}, ${m.claseId?`'${m.claseId}'`:'null'})">Guardar</button>` : ''}
        </div>
      </div>
    </div>
  `;
}

/* Guarda el ajuste como "pendiente" de esta clase, no como carga
   confirmada — recién se vuelca a la ficha del alumno al finalizar la
   clase (ver commitCargasClase). Así el profe puede reabrir el modal y
   seguir ajustando sin que cada toque quede registrado como historial. */
function guardarCarga(alumnoId, claseId){
  const items = itemsCargaModal(state.cargaModal || {alumnoId, claseId});
  let count = 0;
  items.forEach((it, i) => {
    const el = document.getElementById('carga-input-'+i);
    const val = el ? parseFloat(el.value) : NaN;
    if(isNaN(val) || val <= 0) return;
    cargasPendientes[pendienteKey(claseId, alumnoId, it.ejercicio)] = val;
    count++;
  });
  persistPendientes();
  cerrarCarga();
  showToast(count ? 'Carga guardada · se aplica a la ficha al finalizar la clase' : 'Sin cambios');
}

/* Cuenta, sin escribir nada todavía, cuántos pares alumno+ejercicio de
   esta clase tienen un valor efectivo (pendiente o traído del
   historial) listo para pasar a la ficha al finalizar. */
function contarCargasAConfirmar(claseId){
  const c = getClase(claseId);
  return c ? cargasAVolcar(c).length : 0;
}

/* Vuelca a `cargas` (y por lo tanto a la ficha) lo que se anotó en la
   clase. Un solo registro por alumno+ejercicio+día. Limpia las cargas
   pendientes de esta clase al terminar. */
function commitCargasClase(claseId){
  const c = getClase(claseId);
  if(!c) return;
  /* Al que no vino no se le pasa ninguna carga: la sugerida del
     historial no es un dato de hoy. */
  cargasAVolcar(c).forEach(it => {
    const existing = cargaDe(it.alumnoId, it.ejercicio);
    if(existing){
      existing.kg = it.val; existing.claseId = claseId; existing.profesor = profesorActivo;
    }else{
      cargas.unshift({
        id:'k'+Date.now()+'-'+it.alumnoId+'-'+it.ejercicio.replace(/\s+/g,''),
        alumnoId: it.alumnoId, claseId, bloque: it.bloque, ejercicio: nombreEj(it.ejercicio), kg: it.val,
        ejId: buscarEnBanco(it.ejercicio) || null, ts: Date.now(),
        fecha: fechaCorta(), profesor: profesorActivo,
      });
    }
    delete cargasPendientes[pendienteKey(claseId, it.alumnoId, it.ejercicio)];
  });
  persistCargas();
  persistPendientes();
}

function finalizarClase(claseId){
  const c = getClase(claseId);
  if(!c) return;
  /* Las novedades ampliadas en el cierre. */
  let cambiaron = 0;
  document.querySelectorAll('textarea.nov-fin').forEach(t => {
    const n = novedades.find(x => x.id === t.dataset.nov);
    const v = t.value.trim();
    if(n && v !== (n.nota || '')){ n.nota = v; n.editado = Date.now(); n.editadoPor = profesorActivo; cambiaron++; }
  });
  if(cambiaron) persistNovedades();
  c.obsFinal = document.getElementById('obs-final').value.trim();
  const kn = claveNotaClase(claveActiva(), c.hora, c.disciplina);
  if(c.obsFinal) notasClase[kn] = {texto: c.obsFinal, profesor: profesorActivo, ts: Date.now()};
  else if(notasClase[kn]) notasClase[kn] = {texto: '', profesor: profesorActivo, ts: Date.now()};
  persistNotasClase();
  commitCargasClase(claseId);
  c.finalizada = true;
  persistFinalizadas();
  state.finalizarModal = null;
  showToast('Clase finalizada');
  nav('hoy');
}

/* ---------- Pasar el día a otro dispositivo ----------
   Dos profes, dos aparatos: lo que anota uno no lo ve el otro, porque todo
   vive en el navegador de cada uno. Esto arma un archivo con el trabajo del
   día para llevarlo al otro aparato.

   Las novedades y las cargas tienen id propio y fecha: se suman las que
   faltan y no se pierde nada de ninguno de los dos lados.

   Las alertas y adaptaciones de las fichas también viajan, pero con otra
   regla, porque los dos pueden haber editado al mismo alumno. Son listas,
   así que se UNEN sin repetir: lo que cargó cada uno queda. Objetivo y
   nivel son un valor único y ahí sí hay conflicto posible: no se pisa lo
   que ya había en este aparato, se avisa y decide el profe. Nunca
   desaparece una adaptación en silencio. */
/* Rutinas creadas en la app; con "dias" sólo las de ese período, sin "dias" todas. */
function rutinasCreadasEnApp(dias){
  const out = [], desde = dias ? Date.now() - dias * 86400000 : 0;
  Object.keys(planificaciones).forEach(sem => ((planificaciones[sem] || {}).clases || []).forEach(c => {
    if(c.origen === 'app' && (c.creadaEn || 0) >= desde)
      out.push({sem, desde: planificaciones[sem].desde, hasta: planificaciones[sem].hasta, clase: Object.assign({}, c, {versiones: []})});
  }));
  return out;
}
function armarRespaldo(){
  return {
    app: 'akasha-seguimiento',
    version: 1,
    exportado: new Date().toISOString(),
    dispositivo: profesorActivo,
    fecha: fechaCorta(),
    novedades: novedades.filter(n => n.fecha === fechaCorta() || (n.editado && n.editado > Date.now() - 7 * 86400000)),
    cargas: cargas.filter(k => k.fecha === fechaCorta()),
    pruebasReg: pruebasReg.filter(r => r.dia === claveActiva()),
    devoluciones: devoluciones.filter(d => d.fecha === claveActiva()),
    finalizadas: CLASES.filter(c => c.finalizada).map(c => c.id),
    /* Quién se sumó, quién no vino y a quién se sacó, en cada clase del
       día. Las personas "Prueba" no tienen id de Crossfy: su id es local
       de cada aparato, así que viajan con nombre y apellido para que el
       otro aparato las reconozca. */
    ajustes: Object.keys(ajustesClase).filter(k => k.indexOf(claveActiva() + '|') === 0)
      .reduce((o, k) => { o[k] = ajustesClase[k]; return o; }, {}),
    provisorios: alumnosProvisorios.map(p => ({id: p.id, nombre: p.nombre, apellido: p.apellido, tel: p.tel || '', email: p.email || '', prueba: p.prueba !== false})),
    /* Qué rutina se eligió o se reusó en cada clase: viaja sólo la
       referencia ("en la clase de tal fecha y hora se usó la de tal
       disciplina, fecha y hora"), no la rutina entera. Van las de la
       semana anterior y las próximas dos, por si se eligió con tiempo. */
    dia: claveActiva(),
    /* Rutinas creadas en la app en las últimas dos semanas. */
    rutinasApp: rutinasCreadasEnApp(14),
    notasClase: Object.keys(notasClase).filter(k => k.indexOf(claveActiva() + '|') === 0)
      .reduce((o, k) => { o[k] = notasClase[k]; return o; }, {}),
    clasesManuales: clasesManuales[claveActiva()] || [],
    elecciones: (() => {
      const desde = claveFecha(sumarDias(fechaActiva, -7)), hasta = claveFecha(sumarDias(fechaActiva, 14));
      return Object.keys(eleccionRutinas).filter(k => { const f = k.split('|')[0]; return f >= desde && f <= hasta; })
        .reduce((o, k) => { o[k] = eleccionRutinas[k]; return o; }, {});
    })(),
    /* Sólo las fichas que alguien tocó: fichaOverrides ya es exactamente
       eso, lo editado desde la app. */
    fichas: Object.keys(fichaOverrides).map(id => {
      const a = getAlumno(Number(id));
      return {
        id: Number(id),
        nombre: a ? nombreCompleto(a) : '',
        objetivo: fichaOverrides[id].objetivo || '',
        observacionIngreso: fichaOverrides[id].observacionIngreso || '',
        condiciones: fichaOverrides[id].condiciones || [],
        adaptaciones: fichaOverrides[id].adaptaciones || [],
        nivel: nivelOverrides[id] || null,
      };
    }),
  };
}

/* Resumen completo: todo lo que se cargó a mano en este aparato, de

/* ---------- Respaldo de novedades ----------
   Todas o por rango de fechas. Lleva también las corregidas y las
   borradas (marcadas), así al recuperarlas queda todo como estaba. Tiene
   el mismo formato que el resumen del día, así entra por el mismo lado. */
let respaldoNovRango = false, respaldoNovDesde = '', respaldoNovHasta = '';
/* Fecha completa de una novedad. Las viejas sólo tenían DD/MM: se toma el
   año en curso, o el anterior si esa fecha todavía no llegó este año. */
function fechaDeNovedad(n){
  if(n.dia) return n.dia;
  const m = /^(\d{1,2})\/(\d{1,2})$/.exec(String(n.fecha || ''));
  if(!m) return '';
  const hoy = new Date();
  let anio = hoy.getFullYear();
  const k = anio + '-' + dosDig(+m[2]) + '-' + dosDig(+m[1]);
  if(k > claveFecha(hoy)) anio--;
  return anio + '-' + dosDig(+m[2]) + '-' + dosDig(+m[1]);
}
function novedadesParaRespaldo(){
  return novedades.filter(n => {
    if(!respaldoNovRango) return true;
    const f = fechaDeNovedad(n);
    if(respaldoNovDesde && (!f || f < respaldoNovDesde)) return false;
    if(respaldoNovHasta && (!f || f > respaldoNovHasta)) return false;
    return true;
  });
}
function textoCuentaNov(){
  const ns = novedadesParaRespaldo().filter(n => !n.borrada);
  if(respaldoNovRango && !respaldoNovDesde && !respaldoNovHasta) return 'Elegí desde y/o hasta qué fecha.';
  return ns.length + ' novedad' + (ns.length === 1 ? '' : 'es') + (respaldoNovRango ? ' en ese rango' : ' en total') + ' en este aparato.';
}

    novedades: novedadesParaRespaldo(),
    /* Las personas "Prueba" tienen id local: viajan con nombre para
       que el otro aparato las reconozca. */
    provisorios: alumnosProvisorios.filter(p => novedadesParaRespaldo().some(n => n.alumnoId === p.id))
      .map(p => ({id: p.id, nombre: p.nombre, apellido: p.apellido, tel: p.tel || '', email: p.email || '', prueba: p.prueba !== false})),

/* Fusiona: suma lo que falta y no pisa nada de lo que ya había. */
function aplicarRespaldo(obj){
  if(!obj || obj.app !== 'akasha-seguimiento') return {error:'Ese archivo no es un resumen de Akasha.'};
  let nNov = 0, nCar = 0, nFin = 0, conflictos = 0, nAjustes = 0;
  /* Ids de "Prueba" del otro aparato → los de este (por nombre). */
  const mapa = {};
  /* Si en este aparato esa Prueba ya se unió a su usuario de Crossfy,
     va directo al usuario. */
  (obj.provisorios || []).forEach(p => {
    if(!p || !(p.id < 0)) return;
    const real = buscarAlumnoPorNombre(p.nombre, p.apellido);
    mapa[p.id] = real && real.id > 0 ? real.id : idProvisorio(p.nombre, p.apellido, {tel: p.tel, email: p.email, prueba: p.prueba});
  });
  const rid = id => (mapa[id] !== undefined ? mapa[id] : id);
  if(Object.keys(mapa).length) persistReservas();
  (obj.novedades || []).forEach(n => {
    if(!n || !n.id) return;
    const ya = novedades.find(x => x.id === n.id);
    if(!ya){ novedades.unshift(Object.assign({}, n, {alumnoId: rid(n.alumnoId)})); if(!n.borrada) nNov++; }
    /* Una corrección o un borrado hecho en el otro aparato, si es más nuevo. */
    else if((n.editado || 0) > (ya.editado || 0)){ Object.assign(ya, n, {alumnoId: rid(n.alumnoId)}); nNov++; }
  });
  /* Un cambio de nivel hecho en el otro aparato, si es más nuevo que
     los que hay acá, también cambia el nivel de este. */
  const idNum = id => Number(String(id || '').replace(/\D/g, '')) || 0;
  (obj.novedades || []).forEach(n => {
    if(!n || n.tipo !== 'cambio_nivel' || n.borrada || !n.nivelDespues) return;
    const aid = rid(n.alumnoId), a = getAlumno(aid);
    if(!a) return;
    const otras = novedades.filter(x => x.alumnoId === aid && x.tipo === 'cambio_nivel' && !x.borrada && x.id !== n.id);
    if(otras.every(x => idNum(x.id) < idNum(n.id)) && (a.nivel || 2) !== n.nivelDespues){
      a.nivel = n.nivelDespues; nivelOverrides[aid] = n.nivelDespues; persistNivel();
    }
  });
  Object.keys(obj.ajustes || {}).forEach(k => {
    const ajeno = obj.ajustes[k] || {};
    const propio = ajustesClase[k] = ajustesClase[k] || {agregados:[], ausentes:[], quitados:[]};
    if(ajeno.hora != null && propio.hora == null) propio.hora = ajeno.hora;
    if(ajeno.disc && !propio.disc) propio.disc = ajeno.disc;
    Object.keys(ajeno.agregadosEn || {}).forEach(id => {
      propio.agregadosEn = propio.agregadosEn || {};
      const r = rid(Number(id));
      if(!propio.agregadosEn[r]) propio.agregadosEn[r] = ajeno.agregadosEn[id];
    });
    propio.presentes = propio.presentes || [];
    ['agregados', 'ausentes', 'quitados', 'presentes'].forEach(campo => (ajeno[campo] || []).forEach(id => {
      const r = rid(id);
      if(propio[campo].indexOf(r) === -1){ propio[campo].push(r); nAjustes++; }
    }));
  });
  if(nAjustes){ persistAjustes(); CLASES = construirClases(); }
  let nRutinas = 0;
  (obj.rutinasApp || []).forEach(x => {
    if(!x || !x.clase) return;
    const c = guardarClasesEnSemana([JSON.parse(JSON.stringify(x.clase))], fechaDesdeClave(x.desde || x.sem), fechaDesdeClave(x.hasta || x.sem), false, false);
    if(c.sumadas || c.versionadas) nRutinas++;
  });
  if(nRutinas){ rutinasVirtuales = {}; recalcularRutinasDelDia(); recalcularRutinaHoy(); }
  let nNotas = 0;
  Object.keys(obj.notasClase || {}).forEach(k => {
    const ajena = obj.notasClase[k], propia = notasClase[k];
    if(ajena && (!propia || (ajena.ts || 0) > (propia.ts || 0))){ notasClase[k] = ajena; nNotas++; }
  });
  if(nNotas){ persistNotasClase(); CLASES = construirClases(); }
  let nManuales = 0;
  const fechaResp = obj.dia || claveActiva();
  (obj.clasesManuales || []).forEach(m => {
    const lista = clasesManuales[fechaResp] = clasesManuales[fechaResp] || [];
    if(lista.some(x => x.hora === m.hora && normDisc(x.disciplina) === normDisc(m.disciplina))) return;
    lista.push({id: m.id, hora: m.hora, disciplina: m.disciplina}); nManuales++;
  });
  if(nManuales){ persistClasesManuales(); CLASES = construirClases(); }
  let nElecciones = 0;
  Object.keys(obj.elecciones || {}).forEach(k => {
    const ajena = obj.elecciones[k], propia = eleccionRutinas[k];
    if(!ajena) return;
    if(!propia || (ajena.ts || 0) > (propia.ts || 0)){ eleccionRutinas[k] = ajena; nElecciones++; }
  });
  if(nElecciones){ persistEleccionRutinas(); rutinasVirtuales = {}; recalcularRutinaHoy(); }
  (obj.cargas || []).forEach(k => {
    if(!k || !k.id) return;
    if(cargas.some(x => x.id === k.id)) return;
    const mismo = cargas.find(x => x.alumnoId === rid(k.alumnoId) && mismoEj(x.ejercicio, k.ejercicio) && x.fecha === k.fecha);
    if(mismo){ if(mismo.kg !== k.kg) conflictos++; return; }   // gana lo que ya estaba en este aparato
    cargas.unshift(Object.assign({}, k, {alumnoId: rid(k.alumnoId)})); nCar++;
  });
  (obj.pruebasFijas || []).forEach(x => { if(x && x.id && !pruebasFijas.some(y => y.id === x.id)) pruebasFijas.push(x); });
  (obj.pruebasReg || []).forEach(x => { if(x && x.id && !pruebasReg.some(y => y.id === x.id)) pruebasReg.push(Object.assign({}, x, {alumnoId: rid(x.alumnoId)})); });
  persistPruebasFijas(); persistPruebasReg();
  (obj.devoluciones || []).forEach(x => { if(x && x.id && !devoluciones.some(y => y.id === x.id)) devoluciones.push(Object.assign({}, x, {alumnoId: rid(x.alumnoId)})); });
  persistDevoluciones();
  /* Resumen completo: clases finalizadas y creadas a mano de cualquier fecha. */
  let porFecha = false;
  Object.keys(obj.finalizadasPorFecha || {}).forEach(f => {
    const lista = finalizadasPorFecha[f] = finalizadasPorFecha[f] || [];
    (obj.finalizadasPorFecha[f] || []).forEach(id => { if(lista.indexOf(id) === -1){ lista.push(id); nFin++; porFecha = true; } });
    if(!lista.length) delete finalizadasPorFecha[f];
  });
  Object.keys(obj.clasesManualesPorFecha || {}).forEach(f => {
    (obj.clasesManualesPorFecha[f] || []).forEach(m => {
      const lista = clasesManuales[f] = clasesManuales[f] || [];
      if(lista.some(x => x.hora === m.hora && normDisc(x.disciplina) === normDisc(m.disciplina))) return;
      lista.push({id: m.id, hora: m.hora, disciplina: m.disciplina}); nManuales++; porFecha = true;
    });
  });
  if(porFecha){ persistClasesManuales(); CLASES = construirClases(); }
  (obj.finalizadas || []).forEach(id => {
    const c = getClase(id);
    if(c && !c.finalizada){ c.finalizada = true; nFin++; }
  });

  /* Fichas: las listas se unen, los valores únicos no se pisan. */
  let nAlertas = 0, nAdapt = 0, chocaron = 0;
  const unir = (propia, ajena, mismo) => {
    let sumadas = 0;
    (ajena || []).forEach(x => {
      if(!propia.some(y => mismo(y, x))){ propia.push(x); sumadas++; }
    });
    return sumadas;
  };
  (obj.fichas || []).forEach(f => {
    if(!f || !f.id) return;
    const a = alumnoDeClase(f.id);
    nAlertas += unir(a.condiciones = a.condiciones || [], f.condiciones,
                     (y,x) => String(y.texto||'').toLowerCase() === String(x.texto||'').toLowerCase());
    /* Lo que se levantó en el otro aparato también se levanta acá. */
    (f.condiciones || []).forEach(x => { const y = a.condiciones.find(z => String(z.texto||'').toLowerCase() === String(x.texto||'').toLowerCase()); if(y && x.levantada && !y.levantada){ y.levantada = x.levantada; nAlertas++; } });
    const claveAd = x => typeof x === 'string' ? 'T:' + x.toLowerCase() : (x && x.orig ? 'I:' + x.id : (x && x.texto && !x.id ? 'T:' + String(x.texto).toLowerCase() : (x && x.id ? 'I:' + x.id : 'T:' + String(x && x.texto || '').toLowerCase())));
    a.adaptaciones = a.adaptaciones || [];
    (f.adaptaciones || []).forEach(x => {
      const k = claveAd(x), i = a.adaptaciones.findIndex(y => claveAd(y) === k || (x && x.texto && y && y.texto && String(x.texto).toLowerCase() === String(y.texto).toLowerCase()));
      if(i === -1){ a.adaptaciones.push(x); nAdapt++; return; }
      const y = a.adaptaciones[i];
      if(x && typeof x === 'object' && x.levantada){
        if(typeof y === 'string'){ a.adaptaciones[i] = x; nAdapt++; }
        else if(y && !y.levantada){ y.levantada = x.levantada; nAdapt++; }
      }
    });
    if(f.objetivo && !a.objetivo) a.objetivo = f.objetivo;
    else if(f.objetivo && a.objetivo !== f.objetivo) chocaron++;
    if(f.observacionIngreso && !a.observacionIngreso) a.observacionIngreso = f.observacionIngreso;
    else if(f.observacionIngreso && a.observacionIngreso !== f.observacionIngreso) chocaron++;
    if(f.nivel && !nivelOverrides[f.id]){ a.nivel = f.nivel; nivelOverrides[f.id] = f.nivel; }
    else if(f.nivel && nivelOverrides[f.id] && nivelOverrides[f.id] !== f.nivel) chocaron++;
    actualizarFichaOverride(a);
  });
  if(obj.fichas && obj.fichas.length){ persistNivel(); }

  /* Resto del resumen completo. Niveles: sólo donde este aparato no tiene uno propio. */
  let nNiveles = 0, nBanco = 0, nRegistro = 0, nMedicion = 0;
  Object.keys(obj.niveles || {}).forEach(id => {
    const aid = rid(Number(id)), a = getAlumno(aid), v = obj.niveles[id];
    if(!a || !v) return;
    if(!nivelOverrides[aid]){ nivelOverrides[aid] = v; a.nivel = v; nNiveles++; }
    else if(nivelOverrides[aid] !== v) chocaron++;
  });
  if(nNiveles) persistNivel();
  /* Banco: suma ejercicios y alias que falten; no borra ni renombra. */
  if(obj.banco){
    (obj.banco.borrados || []).forEach(k => { if(k && bancoBorrados.indexOf(k) === -1) bancoBorrados.push(k); });
    (obj.banco.ejercicios || []).forEach(e => {
      if(!e || !e.nombre) return;
      const nombres = [e.nombre].concat(e.alias || []);
      const id = banco.some(x => x.id === e.id && normEj(x.nombre) === normEj(e.nombre)) ? e.id : nombres.map(n => buscarEnBanco(n)).find(Boolean);
      const local = id ? ejercicioPorId(id) : null;
      if(!local){
        if(bancoBorrados.indexOf(normEj(e.nombre)) !== -1) return;
        banco.push({id: banco.some(x => x.id === e.id) ? idDesdeNombre(e.nombre) : e.id, nombre: e.nombre, alias: (e.alias || []).slice(), notas: e.notas || '', nuevo: !!e.nuevo, zonas: (e.zonas || []).slice()});
        construirIndiceBanco(); nBanco++;
        return;
      }
      let sumo = false;
      local.alias = local.alias || [];
      nombres.forEach(n => {
        const k = normEj(n);
        if(!k || k === normEj(local.nombre) || local.alias.some(x => normEj(x) === k)) return;
        if(buscarEnBanco(n) && buscarEnBanco(n) !== local.id) return;   // ese nombre ya es de otro ejercicio acá
        local.alias.push(n); sumo = true;
      });
      if(e.notas && !local.notas){ local.notas = e.notas; sumo = true; }
      if((e.zonas || []).length && !(local.zonas || []).length){ local.zonas = e.zonas.slice(); sumo = true; }
      if(sumo){ construirIndiceBanco(); nBanco++; }
    });
    if(nBanco){ persistBanco(); }
    persistBancoBorrados();
  }
  /* Registro de pruebas: canal y notas, sólo donde acá está vacío. */
  Object.keys(obj.registro || {}).forEach(k => {
    const ajeno = obj.registro[k] || {}, propio = registroExtra[k] = registroExtra[k] || {};
    Object.keys(ajeno).forEach(c => { if(ajeno[c] && !propio[c]){ propio[c] = ajeno[c]; nRegistro++; } });
  });
  if(nRegistro){ try{ akStore.setItem('akasha-registro', JSON.stringify(registroExtra)); }catch(e){} }
  Object.keys(obj.medicion || {}).forEach(k => {
    if(!medicionOverrides[k] && (obj.medicion[k] || []).length){ medicionOverrides[k] = obj.medicion[k].slice(); nMedicion++; }
  });
  if(nMedicion){ persistMedicion(); recalcularRutinaHoy(); }
  if(obj.disciplinas) sumarDisciplinas(obj.disciplinas);
  if(obj.botonesNov){
    let sumoBot = false;
    ['obs', 'aviso'].forEach(k => (obj.botonesNov[k] || []).forEach(t => {
      if(t && listaFrases(k === 'obs' ? 'obs' : 'aviso').indexOf(t) === -1){ botonesNov[k].push(t); sumoBot = true; }
    }));
    if(sumoBot) persistBotonesNov();
  }

  persistNovedades(); persistCargas(); persistFinalizadas();
  return {nNov, nCar, nFin, conflictos, nAlertas, nAdapt, chocaron, nAjustes, nElecciones, nManuales, nNotas, nRutinas,
          nNiveles, nBanco, nRegistro, nMedicion, completo: obj.tipo === 'completo',
          de: obj.dispositivo || '', fecha: obj.fecha || ''};
}
function textoResultadoRespaldo(r){
  const partes = [r.nNov + ' novedad(es)', r.nCar + ' carga(s)'];
  if(r.nAlertas) partes.push(r.nAlertas + ' alerta(s)');
  if(r.nAdapt) partes.push(r.nAdapt + ' adaptación(es)');
  if(r.nAjustes) partes.push(r.nAjustes + ' cambio(s) en listas de clase');
  if(r.nRutinas) partes.push(r.nRutinas + ' rutina(s) creada(s) en la app');
  if(r.nNotas) partes.push(r.nNotas + ' nota(s) de clase');
  if(r.nManuales) partes.push(r.nManuales + ' clase(s) creada(s) a mano');
  if(r.nElecciones) partes.push(r.nElecciones + ' rutina(s) elegida(s) o reusada(s)');
  if(r.nNiveles) partes.push(r.nNiveles + ' nivel(es)');
  if(r.nBanco) partes.push(r.nBanco + ' ejercicio(s) del banco');
  if(r.nRegistro) partes.push(r.nRegistro + ' dato(s) del registro de pruebas');
  if(r.nMedicion) partes.push(r.nMedicion + ' medición(es) del día');
  return (r.completo ? 'Resumen completo · ' : '') + (r.de ? 'De ' + r.de + ': ' : '') + partes.join(', ') + ' sumadas'
    + (r.nFin ? ' · ' + r.nFin + ' clase(s) marcadas como finalizadas' : '')
    + (r.conflictos ? ' · ' + r.conflictos + ' carga(s) ya estaban con otro valor y se dejó la de este aparato' : '')
    + (r.chocaron ? ' · ' + r.chocaron + ' objetivo/nivel distintos: se dejó el de este aparato' : '');
}

/* "En la clase de 12/10 10:00 · GAP se usó la de Funcional del 05/10 · 19:00". */
function lineasEleccionesDelDia(){
  const pre = claveActiva() + '|';
  return Object.keys(eleccionRutinas).filter(k => k.indexOf(pre) === 0).map(k => {
    const e = eleccionRutinas[k], p = k.split('|');
    const clase = CLASES.find(c => (c.hora || '') === p[1] && normDisc(c.disciplina) === p[2]);
    const nom = (p[1] ? p[1] + ' · ' : '') + (clase ? clase.disciplina : (e.disc || p[2]));
    if(e.reuso) return 'En la clase de ' + fechaCortaClave(p[0]) + ' ' + nom + ' se usó la de ' + textoReuso(e.reuso);
    const c = clase && candidatosDeClase(clase).find(x => claveClase(x.r) === e.k && x.v === e.v);
    const et = c ? etiquetaCandidato(c) : e.et;
    return et ? 'En la clase de ' + fechaCortaClave(p[0]) + ' ' + nom + ' se eligió: ' + et : '';
  }).filter(Boolean);
}
/* Resumen de novedades de un día, agrupado por clase: la clase, su nota
   de cierre ("Notas +") y debajo cada alumno con el tipo y la nota. La
   fecha se cambia con las flechas o el calendario (es el día que se está
   viendo en toda la app). */
function moverResumen(paso){ const d = sumarDias(fechaActiva, paso); irAFecha(claveFecha(d)); }
function irResumenFecha(v){ if(/^\d{4}-\d{2}-\d{2}$/.test(v)) irAFecha(v); }
function gruposResumen(){
  const fecha = claveActiva();
  const ns = novedades.filter(n => !n.borrada && !n.convertida && (n.dia ? n.dia === fecha : (n.fecha === fechaCorta() && fechaDeNovedad(n) === fecha)));
  const grupos = {};
  const grupo = (k, hora, disc) => grupos[k] = grupos[k] || {k, hora, disc, novs: [], nota: ''};
  ns.forEach(n => {
    let hora = n.claseHora || '', disc = n.claseDisc || '';
    if(!disc && n.claseId){ const c = getClase(n.claseId); if(c){ hora = c.hora; disc = c.disciplina; } }
    grupo(disc ? hora + '|' + normDisc(disc) : '~fuera', hora, disc).novs.push(n);
  });
  Object.keys(notasClase).forEach(k => {
    const p = k.split('|');
    if(p[0] !== fecha || !notasClase[k].texto) return;
    const c = CLASES.find(x => (x.hora || '') === p[1] && normDisc(x.disciplina) === p[2]);
    grupo(p[1] + '|' + p[2], p[1], c ? c.disciplina : p[2]).nota = notasClase[k].texto;
  });
  return Object.keys(grupos).sort().map(k => grupos[k]);
}
